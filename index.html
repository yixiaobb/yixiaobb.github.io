<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>第二重天 · 西行</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F2EEE4'/%3E%3Ctext x='32' y='45' font-size='42' text-anchor='middle' fill='%239E2B1E' font-family='serif'%3E%E5%A4%A9%3C/text%3E%3C/svg%3E">
<meta name="description" content="第二重天 · 西行 —— 文字叙事Roguelike。穿过八座城,一座也不剩。">
<meta property="og:title" content="第二重天 · 西行">
<meta property="og:description" content="文字叙事Roguelike。穿过八座城,一座也不剩。">
<meta property="og:type" content="website">
<style>
:root{
  --paper:#F2EEE4; --sheet:#FBF8F1; --ink:#201E1A; --ink2:#5C554A; --ink3:#8E8375;
  --red:#9E2B1E; --line:#DCD5C4; --line2:#EAE3D4; --blue:#35566F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Songti SC","SimSun","STSong",serif;font-size:15.5px;line-height:1.95;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:#E8DFC8}

.hd{border-bottom:1px solid var(--line);background:var(--sheet);padding:0 26px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.hd h1{font-size:18px;font-weight:600;letter-spacing:5px}
.hd .meta{font-size:11.5px;color:var(--ink3);font-family:system-ui;letter-spacing:1px}
.hd .ov{margin-left:auto;font-size:11.5px;color:var(--red);font-family:system-ui;letter-spacing:1px}
.hd .snd{border:1px solid var(--line);background:none;border-radius:2px;padding:3px 8px;font-size:11px;font-family:system-ui;color:var(--ink3)}
.hd .snd:hover{border-color:var(--red);color:var(--red)}

.wrap{display:flex;gap:20px;padding:22px 26px;align-items:flex-start;max-width:1120px;margin:0 auto}
.story{flex:1;min-width:0;background:var(--sheet);border:1px solid var(--line);padding:30px 34px 34px;position:relative}
.story::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);opacity:.5}
.side{width:296px;flex:none;display:flex;flex-direction:column;gap:14px;position:sticky;top:78px}
.card{background:var(--sheet);border:1px solid var(--line);padding:15px 16px}
.card h3{font-size:11px;font-weight:600;color:var(--ink3);font-family:system-ui;margin-bottom:12px;letter-spacing:3px}

.scene{width:100%;height:132px;display:block;margin:0 0 20px;border-bottom:1px solid var(--line2)}
.cityname{font-size:27px;font-weight:600;letter-spacing:4px;line-height:1.3}
.lawline{font-size:12px;color:var(--ink3);font-family:system-ui;letter-spacing:1px;margin-top:6px}
.sep{height:1px;background:var(--line2);margin:20px 0}
.verse{white-space:pre-line;font-size:16.5px;line-height:2.15;color:#332F28;border-left:2px solid var(--red);padding:2px 0 2px 16px;margin:4px 0 16px}
.say{font-size:13.5px;color:var(--ink2);margin-bottom:4px}
.evno{font-size:11px;color:var(--ink3);font-family:system-ui;letter-spacing:2px}
.evt{font-size:20px;font-weight:600;letter-spacing:1px;margin:2px 0 14px}
.body{white-space:pre-line;font-size:15.5px;line-height:1.95;min-height:60px}
.caret{display:inline-block;width:7px;background:var(--ink);animation:bl .9s steps(1) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}

/* 选项排版：两行网格。
   之前是 flex + .tag{margin-left:auto}——标签把正文挤成一条窄柱，汉字被逐字折行，读起来像竖排。
   现在正文独占第一行整宽，标签与后果说明落到第二行的 .sub 里。 */
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-areas:"on lb" "on sub";
     align-items:start;column-gap:11px;row-gap:5px;width:100%;text-align:left;
     border:1px solid var(--line);border-left:3px solid var(--line);
     background:var(--sheet);padding:12px 15px;margin-bottom:10px;border-radius:6px;font-size:14.5px;line-height:1.62;
     transition:border-color .16s,box-shadow .16s,transform .12s,background .16s}
.opt:hover:not(:disabled){border-left-color:var(--red);background:#FCFAF4;box-shadow:0 4px 14px rgba(60,40,20,.08);transform:translateX(2px)}
.opt:disabled{opacity:.5;cursor:not-allowed;background:#FAF7F0}
/* 没有序号圈的按钮（读档/铸遗骸器/搭肩/装备）：正文通栏 */
.opt > .lb:first-child{grid-area:lb;grid-column:1 / -1}
.opt .lb{grid-area:lb;min-width:0;font-weight:600;overflow-wrap:break-word;word-break:normal;line-break:strict}
/* 第二行：标签 + 后果说明。flex-wrap 保证窄屏时标签自己换行，不会把后果挤没 */
.opt .sub{grid-area:sub;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 9px}
.opt .hb{font-size:12px;color:var(--ink3);font-family:system-ui;letter-spacing:.3px;min-width:0;overflow-wrap:break-word}
/* 后果里的数值：加粗 + 上色，让代价在点下去之前就摆在眼前 */
.opt .hb b{font-weight:800;color:var(--red);font-size:12.5px;letter-spacing:.2px}
.opt .tag{flex:none;display:inline-block;font-size:10.5px;font-family:system-ui;padding:1px 6px;border-radius:2px;letter-spacing:1px;align-self:center}
.tg{background:#F7E4E1;color:#9E2B1E}.tb{background:#E2EBF2;color:#35566F}.tv{background:#E3EDE4;color:#3B6D45}

.res{background:#F7F3E9;border-left:2px solid var(--ink3);padding:14px 18px;margin:18px 0 4px;font-size:14.5px;line-height:1.9;white-space:pre-line}
/* 结算里的后果块（事件结算专用，结局页那个 .conseq 是另一套）。
   选项列表故意不剧透代价，所以这是玩家唯一能看到「你为此付出了什么」的地方，
   必须是整页最重的一块：朱红左边框 + 米底 + 标题 + 数值加粗。
   代价被看得太轻，就会被算得太轻。 */
.cost{margin:14px 0 4px;padding:13px 17px 14px;border-left:3px solid var(--red);
        background:#FBF0EC;border-radius:0 6px 6px 0}
.cost .chead{font-size:11px;font-family:system-ui;letter-spacing:3px;color:var(--red);
        font-weight:700;margin-bottom:7px}
.cost .cs{display:inline;font-size:14px;color:var(--ink2);line-height:1.95;letter-spacing:.2px}
.cost .cdot{color:var(--line);margin:0 7px;font-size:12px}
/* 后果里的数值：加粗 + 染红。属性名和数字一起，缺多少和得到多少一样显眼。 */
.cost b{font-weight:800;color:var(--red);font-size:14.5px;letter-spacing:.2px}
/* 有后果的选项：标签行留一条极淡的底，让人隐约知道「这条要付东西」，
   但看不到是多少——知道有代价，和知道代价是多少，是两件事。 */
.opt.hascost > .lb:first-child{position:relative}
.opt.hascost > .lb:first-child::after{content:"·";color:var(--red);font-weight:800;margin-left:7px;opacity:.55}
.fade{animation:fi .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}

.mb{border-bottom:1px solid var(--line2);padding:0 0 11px;margin-bottom:11px}
.mb:last-child{border-bottom:0}
.mb.dead{opacity:.55}
.mb .hd2{display:flex;align-items:center;gap:8px}
.seal{width:26px;height:26px;flex:none;background:var(--red);color:#FBF8F1;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:2px}
.seal.g{background:#7C766A}
.mb .nm{font-weight:600;font-size:15px;letter-spacing:1px}
.mb .rk{font-size:10.5px;font-family:system-ui;color:var(--ink3);font-weight:400;margin-left:auto;letter-spacing:.5px}
.bars{margin-top:8px;display:flex;flex-direction:column;gap:5px;padding:7px 8px;background:rgba(0,0,0,.025);border-radius:4px}
.bar{display:flex;align-items:center;gap:7px;font-size:10.5px;font-family:system-ui}
.bar .n{width:30px;flex:none;color:var(--ink2);font-size:11px}
.bar .t{flex:1;height:5px;background:#EAE3D4;overflow:hidden;display:block}
/* .f 必须是块级:它是 span,行内元素会忽略 width/height,填充条就整条画不出来(只留轨道)。
   ——这是"刻度条没填充物"的根因。 */
.bar .f{height:100%;display:block}
.bar .v{width:26px;text-align:right;color:var(--ink2);font-size:11px;font-weight:600}
.pv{font-size:10.5px;font-family:system-ui;color:var(--ink3);margin-top:6px;display:flex;justify-content:space-between}
.eq{font-size:11.5px;font-family:system-ui;color:var(--red);margin-top:5px}

.btn{border:1px solid var(--line);background:none;border-radius:2px;padding:6px 13px;font-size:12.5px;font-family:system-ui;letter-spacing:1px}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.p{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.p:hover{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}

.mask{position:fixed;inset:0;background:rgba(28,25,20,.62);display:flex;align-items:center;justify-content:center;padding:26px;z-index:130;animation:fi .2s ease both}
.dlg{background:var(--sheet);padding:28px 30px;max-width:540px;width:100%;max-height:84vh;overflow:auto;border-top:3px solid var(--red)}
.dlg h2{font-size:19px;margin-bottom:6px;letter-spacing:2px}
.dlg .sub{font-size:12px;color:var(--ink3);font-family:system-ui;margin-bottom:16px;letter-spacing:1px}
.dlg p{font-size:14px;margin-bottom:11px;line-height:1.85}
.lg{font-size:13.5px;border-left:2px solid var(--red);padding:4px 0 4px 12px;margin-bottom:12px;line-height:1.8}
.lg .no{font-family:system-ui;font-size:11px;color:var(--ink3);display:block;margin-top:2px}
.it{font-size:12.5px;font-family:system-ui;padding:7px 9px;border:1px dashed var(--line);margin-bottom:6px;line-height:1.7}
.it b{font-family:inherit;color:var(--red)}
.hint{font-size:11.5px;color:var(--ink3);font-family:system-ui;margin-top:12px;line-height:1.85}

.warn{background:#F7E4E1;border-left:2px solid var(--red);color:#7A2117;padding:12px 16px;font-size:13.5px;margin:14px 0;line-height:1.85}
.ok{background:#E9EDE3;border-left:2px solid #5C7A45;color:#2F4A22;padding:12px 16px;font-size:13.5px;margin:14px 0;line-height:1.85}
.tagline{font-size:12.5px;color:var(--ink3);font-family:system-ui;margin-top:22px;border-top:1px solid var(--line2);padding-top:12px;letter-spacing:1px}
.kbd{font-size:11px;font-family:system-ui;color:var(--ink3);margin-top:20px;letter-spacing:.5px}
.kbd b{color:var(--ink2);font-weight:600}
/* 叠合度氛围:越往西,纸越暗 */
body[data-ov="0"]{--paper:#F4F1E8}
body[data-ov="1"]{--paper:#F2EEE4}
body[data-ov="2"]{--paper:#EFEAE0;--sheet:#F9F5EC}
body[data-ov="3"]{--paper:#EAE4D8;--sheet:#F7F3EA}
body[data-ov="4"]{--paper:#E5DED0;--sheet:#F5F0E7}
body[data-ov="5"]{--paper:#DFD8C9;--sheet:#F3EEE4}
body[data-ov="6"]{--paper:#D8D0C0;--sheet:#F1EBE0}
body[data-ov="7"]{--paper:#D1C8B6;--sheet:#EFE9DD}
body[data-ov="8"]{--paper:#C9BFAC;--sheet:#EDE6D9}

.dots{display:flex;gap:5px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line);transition:.35s}
.dot.now{background:var(--red);transform:scale(1.7)}
.dot.past{background:var(--ink3)}
.hd{box-shadow:0 1px 0 rgba(0,0,0,.035)}

.bar .f{transition:width .55s cubic-bezier(.4,0,.2,1)}
.mb{padding:0 0 11px;transition:.2s}
.mb:hover{background:#F7F3E9}
.opt .on{grid-area:on;align-self:start;flex:none;width:21px;height:21px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-family:system-ui;font-size:11px;margin-top:1px;transition:.15s}
.opt:hover:not(:disabled) .on{background:var(--red)}
.evt::before{content:"";display:inline-block;width:9px;height:9px;border:1px solid var(--red);
  margin-right:11px;vertical-align:3px;transform:rotate(45deg)}

.endmark{width:42px;height:42px;background:var(--red);color:var(--sheet);display:flex;
  align-items:center;justify-content:center;font-size:21px;border-radius:2px;margin-bottom:16px}
.endtitle{font-size:37px;font-weight:600;letter-spacing:9px;line-height:1.25}
.endsub{font-size:12px;color:var(--ink3);font-family:system-ui;letter-spacing:2.5px;margin-top:9px}
/* 结局「后果」框 —— 这一局到底改变了什么,要在整页里一眼看见 */
.conseq{margin:20px 0;padding:17px 19px 16px;border:2px solid var(--red);
  border-left-width:7px;background:linear-gradient(180deg,rgba(158,43,30,.13),rgba(158,43,30,.07));
  border-radius:0 8px 8px 0;box-shadow:0 3px 16px rgba(158,43,30,.14)}
.conseq .ch{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:5px;color:#fff;
  font-weight:800;margin-bottom:13px;font-family:system-ui}
.conseq .ch::before{content:"后果";background:var(--red);color:#fff;letter-spacing:4px;
  padding:3px 11px 4px;border-radius:3px;font-size:12.5px;font-weight:800}
.conseq p{margin:0 0 10px;padding-left:24px;position:relative;font-size:15px;line-height:1.8;
  color:var(--ink);font-weight:600}
.conseq p::before{content:counter(cq);counter-increment:cq;position:absolute;left:0;top:.15em;
  width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;
  font-size:10.5px;font-weight:800;line-height:16px;text-align:center;font-family:system-ui}
.conseq p:last-child{margin-bottom:0}
.conseq b{color:var(--red);font-weight:800;background:rgba(158,43,30,.11);
  padding:1px 4px;border-radius:2px;box-shadow:0 0 0 1px rgba(158,43,30,.2) inset}
/* 首条 = 这个结局的定性后果,比其余条目更大更重 */
.conseq p.leadline{margin-bottom:13px;padding-bottom:12px;border-bottom:1px dashed rgba(158,43,30,.28)}
.conseq p .lead{display:inline;font-size:19px;line-height:1.6;font-weight:800;color:var(--ink);letter-spacing:.3px}
.conseq p .lead b{font-size:19px;background:rgba(158,43,30,.16);padding:2px 6px;border-radius:3px}
.conseq p:first-child{counter-increment:none}
.conseq p:first-child::before{content:"";width:16px;height:16px;background:var(--red);
  box-shadow:0 0 0 3px rgba(158,43,30,.22)}
.conseq{counter-reset:cq}
.storytxt{white-space:pre-wrap;line-height:1.95;font-size:13.5px;color:var(--ink);background:rgba(0,0,0,.018);border:1px solid var(--line);border-radius:7px;padding:15px 17px;margin:10px 0;font-family:"Songti SC","SimSun",serif}
.storytxt b{color:var(--red)}
/* 行囊 · 拾得纸折叠区 */
.papers{border:1px dashed var(--line);border-radius:6px;padding:0;margin:0 0 8px;background:rgba(0,0,0,.015)}
.papers>summary{cursor:pointer;list-style:none;padding:8px 11px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:9px;color:var(--ink)}
.papers>summary::-webkit-details-marker{display:none}
.papers>summary::before{content:"▸";font-size:10px;color:var(--ink3);transition:transform .18s}
.papers[open]>summary::before{transform:rotate(90deg)}
.papers>summary:hover{background:rgba(158,43,30,.05)}
.papers>summary .pm{margin-left:auto;font-weight:400;font-size:11px;color:var(--ink3)}
.papers .it{margin:0 9px 6px;border-left:2px solid rgba(158,43,30,.22)}
.papers .it.sub{background:transparent}
.papers .it.sub:hover{background:rgba(158,43,30,.05)}
.lg{background:#F7F3E9;padding:8px 13px}

.flash{position:fixed;inset:0;background:var(--red);z-index:98;display:flex;align-items:center;
  justify-content:center;flex-direction:column;color:#FBF8F1;pointer-events:none;animation:fl 2.3s ease both}
.flash .big{font-size:46px;letter-spacing:12px;font-weight:600}
.flash .sm{font-size:14px;letter-spacing:3px;margin-top:16px;opacity:.92;line-height:1.9;text-align:center;padding:0 30px}
@keyframes fl{0%{opacity:0}10%{opacity:1}70%{opacity:1}100%{opacity:0}}

.veil{position:fixed;inset:0;background:var(--paper);z-index:97;display:flex;align-items:center;
  justify-content:center;pointer-events:none;animation:vl 1.15s ease both}
.veil .w{font-size:14px;letter-spacing:9px;color:var(--ink3)}
@keyframes vl{0%{opacity:0}18%{opacity:1}66%{opacity:1}100%{opacity:0}}

/* 软件外壳:封面 / 序章 / 图鉴 / 引导 */
.cover{position:fixed;inset:0;z-index:120;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:30px}
.cover.off{display:none}
.coverin{max-width:580px;width:100%;text-align:center}
.bigt{font-size:50px;font-weight:600;letter-spacing:15px;line-height:1.2}
.subt{font-size:11.5px;color:var(--ink3);font-family:system-ui;letter-spacing:4px;margin-top:10px}
.coverrule{width:44px;height:2px;background:var(--red);margin:26px auto}
.menu{display:flex;flex-direction:column;gap:9px;max-width:288px;margin:0 auto}
.menu button{border:1px solid var(--line);background:none;padding:11px 16px;font-size:14px;
  letter-spacing:4px;border-radius:2px;transition:.2s;font-family:inherit}
.menu button:hover:not(:disabled){border-color:var(--red);color:var(--red);letter-spacing:6px}
.menu button.main{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.menu button.main:hover{background:var(--red);border-color:var(--red);color:#fff}
.menu button:disabled{opacity:.32;cursor:not-allowed}
.coverfoot{font-size:11px;color:var(--ink3);font-family:system-ui;margin-top:32px;letter-spacing:1px;line-height:2}

.pro{position:fixed;inset:0;z-index:118;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:28px;overflow:auto}
.proin{max-width:560px;width:100%}
.prostep{font-size:11px;font-family:system-ui;color:var(--ink3);letter-spacing:3px}
.probody{font-size:16px;line-height:2.15;margin:14px 0 22px;white-space:pre-line;min-height:150px}

.note{font-size:12.5px;color:var(--ink3);border-left:2px solid var(--line);
  padding:3px 0 3px 12px;margin-top:15px;line-height:1.85}
.note b{color:var(--red);font-weight:600;letter-spacing:1px}

.term{margin-bottom:15px}
.term b{display:block;font-size:14px;letter-spacing:2px;margin-bottom:3px}
.term span{font-size:13.5px;color:var(--ink2);line-height:1.85}
.helpline{font-size:13.5px;line-height:2;margin-bottom:12px}

.coach{outline:2px solid var(--red);outline-offset:3px;background:var(--sheet)}
.coachtip{position:fixed;z-index:75;background:var(--ink);color:var(--sheet);padding:13px 17px;
  max-width:300px;font-size:13px;line-height:1.9;border-radius:2px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.coachtip b{color:#E5C79E;font-weight:600}
.coachbtn{margin-top:10px;border:1px solid rgba(255,255,255,.35);background:none;color:var(--sheet);
  padding:4px 13px;font-size:12px;border-radius:2px;letter-spacing:1px}
.coachbtn:hover{border-color:#E5C79E;color:#E5C79E}
.coachno{font-size:11px;color:#9C948A;font-family:system-ui;margin-left:9px}

.hdmenu{border:1px solid var(--line);background:none;border-radius:2px;padding:3px 9px;font-size:11px;
  font-family:system-ui;color:var(--ink3)}
.hdmenu:hover{border-color:var(--red);color:var(--red)}

@media(max-width:900px){.wrap{flex-direction:column}.side{width:100%;position:static}}

/* ===== 手机端增强(窄屏/类小程序体验) ===== */
html{ -webkit-text-size-adjust:100%; }
*{ -webkit-tap-highlight-color:rgba(158,43,30,.12); }
.opt,.btn,.menu button,.hdmenu,.snd{ touch-action:manipulation; }
@media (max-width:640px){
  body{ font-size:15px; line-height:1.85; }
  .hd{ flex-wrap:wrap; height:auto; min-height:52px; padding:7px 12px; gap:8px 10px; }
  .hd h1{ order:0; font-size:15px; letter-spacing:2px; }

  main:1,
  t:"西行志 · 第一节:报不报",
  x:"入城的表格摊在桌上。登记官说:填了,就能进城。\n\n填了,你往西这件事就落在这座城的纸上了——包括你去干什么。\n\n不填,你就是这座城的罪人。罪名都写好了:不可预测罪。\n\n陆昭把红蓝双色笔摆在表上。蓝笔记活人,红笔记死人,他干了六年。",
  o:[
   {lb:"照实填,连「去源城停掉那套星星」也写上", echo:"推演院把你那张表归档了,编号 A-0001,标题写着「不可预测事项:一位登记员」。他们什么都算到了,就是没算到你真会去。", hb:"诚实。也会被看见", cls:"tv",
    e:[{will:1},{flag:"报备西行"}],
    r:"他一个字一个字填完,最后一行写:往西,去源头,停掉它。\n\n登记官盖了章,说:可预测,过。\n\n陆昭问:你信吗?\n\n登记官说:我不需要信。我只需要它写在纸上。"},
   {lb:"目的地那栏,只写「往西」两个字", echo:"那张表后来被人翻出来过一次——因为它是全城唯一一份没填满却盖章通过的。翻它的人说:这不算填错,这算填得倔。", hb:"不多说一个字", cls:"tb",
    e:[{will:2}],
    r:"他在目的地那栏写了两个字:往西。\n\n登记官问:西边哪儿?\n\n陆昭说:到了就知道。\n\n登记官在空格上画了个圈,批:方向可预测。过。\n\n这是这座城四十一年来唯一一份没填满却通过的表格。"},
   {lb:"把表格翻过来,在背面写「不报」", echo:"登记官把那张背面有字的表留了下来,没归档。他说不出为什么,就是没舍得。这张表后来在他抽屉里躺到城没了。", hb:"对抗。很小的那种", cls:"tg",
    e:[{will:4},{flag:"不报"}],
    r:"他把表格翻过来,背面写了两个字:不报。然后正面朝上递回去。\n\n登记官看了很久,说:背面我也看。\n\n陆昭说:我知道。\n\n他被罚扫了三天街。扫的时候他想:至少这两个字是我自己写的。"},
   {lb:"交白卷,站着等", echo:"拘留所的排期表上,你那一栏一直是空的。他们后来给这种空格起了个名字,叫「陆昭格」——意思是:排不进去的人。", hb:"什么也不给他们。代价是饿", cls:"tg",
    e:[{will:6},{flag:"白卷"}],
    r:"他把空表递回去,站着,一句话不说。\n\n登记官问了十七遍,他答了十七遍沉默。\n\n第七天他们放了他——拘留所排满了,而他没有排期。\n\n出城时他饿得发抖,胃里空得发疼。他后来一直记得:沉默是要付饭钱的。"}
  ]}},
{n:"削不削", q:"齐物司要削掉你比别人强的那一项。削完大家一样高,一样怕。", ev:{
  main:1,
  t:"西行志 · 第二节:削不削",
  x:"齐物司测出队里最高的那一项,执事摊开册子,问:削不削?\n\n削了,全城一样高、一样重、一样怕,谁也不会出事。\n\n不削,你就得带着那一点「比别人强」走出城门——而城门到下一座城那段路,是你自己的。\n\n他又问了一遍:削不削?",
  o:[
   {lb:"削。大家都一样,最安全", echo:"齐物司给你开了张「已均」的条子。凭它,往后三座城你都不用被问第二遍——因为已经没什么可问的了。", hb:"全队主枢 -8 · 这一节你低头了", cls:"tv",
    e:[{w:"all",st:"high",d:-8},{will:0}],
    r:"仪器转了一圈,报出一个数,然后把它削平。\n\n执事说:合格。\n\n你们进城了。城里的房子一样高,人一样客气,走路一样快。\n\n走出齐物司的时候,没人说话。"},
   {lb:"削,但要求把削下来的那一点带走", echo:"那只空墨水瓶你一直带着。后来有人问里面装的什么,你说:装的是我原来那一点。他说:那现在呢?你说:现在在外面。", hb:"主枢 -8 · 东西我留下", cls:"tb",
    e:[{w:"all",st:"high",d:-8},{item:"削下来的那一点"},{will:2}],
    r:"陆昭掏出一个空墨水瓶,说:削下来的给我。\n\n执事愣了一下,说:那是废料。\n\n陆昭说:废料也是我的。\n\n他们给了他。瓶子里什么都没有,摇一摇也不响。他一直带着。"},
   {lb:"不削,登记为「突出」", echo:"「突出」这两个字跟着你过了两座城。每过一座,查你的人都要多问一句:还在吗?你说:还在。他就在册子上再描一遍。", hb:"主枢 +5 · 从此你是册子上的人", cls:"tg",
    e:[{w:"all",st:"high",d:5},{flag:"突出"},{will:4}],
    r:"执事在册子上写了一行,写得很慢。\n\n写完后他说:突出。这两个字今后会跟着你,逢城必查。\n\n陆昭说:那就查。\n\n他后来才知道,那两个字的笔画,是这座城最难写的。"},
   {lb:"不削,并且当着执事的面再往上推一把", echo:"那天齐物司大堂里所有人都记住了你。记住的方式不太友善,但确实记住了——这座城三年没记住过任何人的脸。", hb:"主枢 +10 · 他很可能会倾覆", cls:"tg",
    e:[{w:"all",st:"high",d:10},{flag:"当众不服"},{will:6}],
    r:"他把仪器推开,说:不削。\n\n执事说:不削按最高值处理。\n\n他说:那就再高一点。\n\n大堂里所有人都停了手。那一刻,这座城第一次有人比别人高出一整截,而没人去削。\n\n代价是那个人从今往后一直抖。"}
  ]}},
{n:"卖不卖", q:"这座城什么都卖,人也卖。他们说:您往后三十年的胆子,现在就能卖。", ev:{
  main:1,
  t:"西行志 · 第三节:卖不卖",
  x:"秤房给你估价。秤砣摆在台上,空的。\n\n执秤的说:您往后三十年的胆子,现在就能卖。到期他们来收。收的时候您还活着,那就是赚了。\n\n他又补了一句:你不卖,别人也会替你卖。\n\n台上那杆秤,一直在等一个重量。",
  o:[
   {lb:"卖。往后三十年的胆子", echo:"那张收据你留着,它很凉,凉得不像纸。三十年后的事三十年后说——你这话说得很大方,因为三十年后的你大概也还在路上。", hb:"三十年后他们会来收", cls:"tv",
    e:[{flag:"卖了胆子"},{will:0}],
    r:"签完字,钱当场就到了。三十年的胆子,一笔勾,当场到账。\n\n执秤的说:三十年后来收。\n\n陆昭问:三十年后来收什么?\n\n执秤的说:收您的胆子。到那天您要是还有,我们再谈。\n\n他把收据折好,收进内皮衣口袋。那张纸后来一直很凉。"},
   {lb:"只卖今年的", echo:"执秤的在那张分期单上盖了章,盖完抬头看了你一眼。那眼神像在看一个不肯一次性死的人。", hb:"只卖一年", cls:"tb",
    e:[{will:2}],
    r:"他说:今年的卖,往后的不卖。\n\n执秤的摇头:分期卖,价最差。\n\n陆昭说:我知道。\n\n只卖一年。不多,但这一年是他自己划的线。"},
   {lb:"不卖,被记为「无价」", echo:"「无价」在秤城是骂人话。你在秤城从此买不到任何东西,但也没人敢再给你开价——双向的,都挺难受。", hb:"「无价」在这里是骂人话", cls:"tg",
    e:[{flag:"无价"},{will:4}],
    r:"执秤的把秤砣挪到最边上,又挪回来,最后在册子上写:无价。\n\n他说:这不是夸您。这是说您没法上架。\n\n陆昭说:那就不上架。\n\n从那天起他在秤城买不到任何东西——不是被赶,是没人肯跟他做买卖。"},
   {lb:"不卖,并且把秤砸了", echo:"那杆断秤一直摆在原处当招牌,底下加了行小字:本秤已坏,欢迎议价。这是秤城四十一年来最诚实的一句广告。", hb:"你得赔", cls:"tg",
    e:[{flag:"砸秤"},{will:6}],
    r:"他把那杆秤举起来,砸在台阶上。秤杆断了,秤砣滚出去很远。\n\n整条街都静了。\n\n他们没打他。他们只是让他赔——赔到城破那天还没赔完,赔得很客气,开了发票。\n\n后来有人说,那天秤城有一杆秤永远是坏的。他们没修,就摆在原处当招牌。"}
  ]}},
{n:"救不救", q:"墙上写着四个字:不要治愈我。治好他们,是这座城唯一认定的伤害。", ev:{
  main:1,
  t:"西行志 · 第四节:救不救",
  x:"颂城的墙上写着四个字:不要治愈我。\n\n他们病着,并且要求继续病着。治好一个人,是这座城唯一认定的伤害。\n\n药在你手里。\n\n你还不知道为什么会有药——你只知道这一路,你是带着药走过来的。",
  o:[
   {lb:"不救。尊重墙上那四个字", echo:"你照墙上那四个字做了。这是你在颂城唯一一次照着做——也是最难受的一次,因为这次是你自己选的。", hb:"你照他们说的做了", cls:"tv",
    e:[{will:0},{flag:"没有出手"}],
    r:"你们把药收好,从墙下走过去。\n\n有人咳嗽,有人摆手,有人冲你们笑。\n\n那笑是真的。他们确实不想被治好。\n\n走出城门的时候,没人回头。回头的那个人,后来一直没想明白自己为什么没伸手。"},
   {lb:"只救开口求你的那个", echo:"他好了以后跟着你们走了半座城,跪着谢了三回。第四回你让他别谢了,他说:不谢我心里过不去。你就让他谢完了。", hb:"全队 念 +6 · 他自己要求的", cls:"tb",
    e:[{w:"all",st:"念",d:6},{will:2}],
    r:"只有一个人开口。他说:我受不了了。\n\n你们给他用了药。他好了,然后跪下来谢,谢了很久。\n\n城里的其他人站在远处看,没有骂,也没有劝。\n\n后来那四个人里,只有他一个人记得这座城。"},
   {lb:"救一个明确说不要救的", echo:"他醒来说了两句话:你们凭什么 / ……谢谢。颂城后来把这两句刻在了墙上,就刻在那四个字底下。这句补充条款,比原文长。", hb:"全队 念 +12 · 你是为你好,不是为他", cls:"tg",
    e:[{w:"all",st:"念",d:12},{flag:"强行救人"},{will:4}],
    r:"他说:别管我。\n\n你们还是管了。按住,灌药,等他烧退。\n\n他醒过来第一句话是:你们凭什么。\n\n第二句话是:……谢谢。\n\n两句话中间隔了很久。这两句,后来在颂城传了很多年。"},
   {lb:"把药方抄一百份,贴满全城", echo:"一百张贴出去,第二天一张不剩,撕得很整齐。但有人在自家门后偷偷熬了一碗。一百份里只要有一份被人藏起来,这一夜就没白熬。", hb:"全城都会看见", cls:"tg",
    e:[{item:"贴满城的药方"},{flag:"贴药方"},{will:6}],
    r:"你们抄了一百份,贴满了每一面墙——包括写着「不要治愈我」的那面。\n\n天亮时全城都在撕。撕得很整齐,一张不落。\n\n可是第二天,有人在自家门后偷偷照着方子熬了一碗。\n\n一百份里,只要有一份被人藏起来,这一夜就没白熬。"}
  ]}},
{n:"报不报名", q:"这座城不许说话,也不许有名字。交了名字,你就没有名字了。", ev:{
  main:1,
  t:"西行志 · 第五节:报不报名",
  x:"静默城不许说话,也不许有名字。\n\n入城要交名字。交上去之后,你就没有名字了——这是这座城给人的交换。\n\n他们递过来一张纸,纸上只有一栏:姓名。\n\n旁边的人一个接一个交了空白纸,然后走进去,再也不出声。",
  o:[
   {lb:"跟着大家一起交空白纸", echo:"你在静默城待了三天。出来的时候差点想不起自己叫什么,想了半天想起的第一件事是职务——那不算名字。", hb:"你成了他们", cls:"tv",
    e:[{will:0}],
    r:"陆昭交了空白纸。\n\n执事看了一眼,点头,放他进去。\n\n城里面很安静,安静得能听见自己的血。\n\n他后来试着想起自己叫什么,想起来的第一个字是「登」。\n\n——那是他的职务,不是他的名字。"},
   {lb:"只写姓", echo:"「陆」这个字在册子上孤零零的。执事说:不完整。你说:留一半。那一半后来一直跟着你,像一件没织完的衣裳。", hb:"一半在这边,一半在那边", cls:"tb",
    e:[{will:2},{flag:"只留姓"}],
    r:"他写了一个字:陆。\n\n执事说:不完整。\n\n他说:留一半。\n\n执事把纸收走了,没再说什么。\n\n那半个字后来一直跟着他,像一件没织完的衣裳。"},
   {lb:"写全名", echo:"你叫了自己一次。就一次,声音很小,但整条街都听见了。第二天全城都在传这件事,只是没人敢说出那个名字。", hb:"全队 念 +8 · 名字交出去就没了", cls:"tg",
    e:[{w:"all",st:"念",d:8},{flag:"报名"},{will:4}],
    r:"他写了三个字:陆昭。\n\n写完那一刻,城里所有纸上的「陆昭」都淡了一层——不是消失,是被收走了。\n\n执事说:从现在起,你不许再自己叫自己。\n\n他还是叫了一次。声音很小,但整条街都听见了。"},
   {lb:"写全名,并且把队里每个人一个一个念出来", echo:"静默城三年没听见名字。那天你念了好几个,念完执事的笔一直没落下去——一旦记下来,他就得承认这座城还有人在。", hb:"全队 念 +14 · 全城都听见了", cls:"tg",
    e:[{w:"all",st:"念",d:14},{flag:"念名"},{will:6}],
    r:"他一个人站在城门下,把队里每个人的名字,一个一个念出来。念得很慢,念完一个停一停。\n\n这座城三年没听见名字了。\n\n有人捂耳朵,有人跪下,有人跟着念。\n\n执事没有拦。他只是站在那儿,手里的笔一直没落下去——因为一旦记下来,他就得承认这座城还有人在。"}
  ]}},
{n:"退不退", q:"军令只有一句:往后一步者,斩。问题是——你往前,是因为想去,还是因为不许自己退。", ev:{
  main:1,
  t:"西行志 · 第六节:退不退",
  x:"铁城的军令只有一句:往后一步者,斩。\n\n他们不是在吓唬人。他们在往前走,前面是源城。\n\n你也在往前走。问题是——你往前走,是因为你想去,还是因为你不许自己退。\n\n前面的路只剩两座城了。队列没有停。",
  o:[
   {lb:"退一步", echo:"你退了那一步,没人斩你,只是被落下了。追上队伍花了半天,追上之后没人提这件事——包括你自己,你提都不想提。", hb:"全队 勇气 -8 · 你退了", cls:"tv",
    e:[{w:"all",st:"敢",d:-8},{flag:"退过一步"},{will:0}],
    r:"你往后挪了一步。\n\n没人斩你。因为队列往前去了,你只是站在原地,然后被落下了。\n\n这比斩难受。\n\n你后来追上了队伍,追得很久。追上之后没人提这件事,包括你自己。"},
   {lb:"原地不动", echo:"你没退,也没走。后来你才想明白:不动也是一种退,只是退得慢一点,慢到你自己都看不出来。", hb:"不退,也没走", cls:"tb",
    e:[{will:2}],
    r:"你站着不动。\n\n队列从你两边过去,像水绕过一块石头。\n\n你没退,所以没人斩你;你也没走,所以没人等你。\n\n后来你想清楚了:不动也是一种退,只是退得慢一点。"},
   {lb:"往前一步", echo:"那一步没什么用,走了和没走,路一样长。但带队的说:不走那一步的人,走不到源城——因为走到一半他就开始算值不值。", hb:"全队 勇气 +8", cls:"tg",
    e:[{w:"all",st:"敢",d:8},{will:4}],
    r:"你往前走了一步,比队列快一步。\n\n将军看了你一眼,没说话。\n\n那一整夜,队伍里没人睡觉,但也没人抱怨。\n\n后来有人问那一步有什么用。带队的说:没用。但不走那一步的人,走不到源城。"},
   {lb:"往前一步,并且不回头", echo:"你把带不动的都倒在路边往前走。有人哭了。不是舍不得,是发现自己真的不会回头了——这两件事差得很远。", hb:"勇气 +12 · 什么都不带走了", cls:"tg",
    e:[{w:"all",st:"敢",d:12},{flag:"不回头"},{will:6}],
    r:"你把行囊里带不动的东西全倒在路边,往前走。\n\n有人喊:东西不要了?\n\n你说:不要了。\n\n那一夜你们走完了别人三天的路。天亮时回头,身后的城已经看不见了。\n\n有人哭了。不是因为舍不得,是因为第一次发现自己真的不会回头了。"}
  ]}},
{n:"留不留", q:"明夷没有律令,也没有人。你可以在这里停下来,没人拦你,也没人记得。", ev:{
  main:1,
  t:"西行志 · 第七节:留不留",
  x:"明夷没有律令,也没有人。\n\n这里是最后一站。往前是源城,往后什么都没有——后面那些城已经不按人的规矩走了。\n\n你可以在这里停下来。没人会拦你,也没人会记得你停过。\n\n风从西边过来,一直是同一个方向。",
  o:[
   {lb:"留下来。这里没人管", echo:"你在明夷坐了很久。这里没有规矩,所以也不用守规矩。这一夜很长,长到足够让人把「算了」说出口——哪怕最后没说。", hb:"你停下了", cls:"tv",
    e:[{will:0},{flag:"想过留下"}],

{n:"伸不伸手", q:"它就在这一秒里。你走了八座城,就是为了走到这里有这么一秒。", ev:{
  main:1,
  t:"西行志 · 第八节:伸不伸手",
  x:"源城没有街道,也没有人。只有一秒——一直在发生的那一秒。\n\n天上那套星星就在这儿。它不发光,它在压。\n\n你走了八座城,穿过七段路,饿了那么多回,把人一个一个丢在半道上——为的就是走到这里有这么一秒。\n\n它在发生。你可以伸手,也可以看着。",
  o:[
   {lb:"不伸手,看着它发生", echo:"你走到了,也确实走到了。只是它一直在发生,你也一直在看,这两件事之间隔着一只手的距离。", hb:"你走到了,但没动手", cls:"tv",
    e:[{will:0},{flag:"看着"}],
    r:"你站在那儿,看着它发生。\n\n它一直在发生,不快也不慢,像呼吸。\n\n你看了很久,然后转身往回走。\n\n往回走的那段路,和来的时候一样长。\n\n很多年以后有人问你看见了什么。你说:我看见它一直在发生。\n\n他说:那你为什么不伸手?\n\n你说:我不知道伸手算不算另一种冒犯。"},
   {lb:"伸手,但是松开了", echo:"你碰过它。知道和改变中间隔着八座城,而你刚走完那八座城,所以现在隔着的只是你自己。", hb:"你碰过它", cls:"tb",
    e:[{will:2},{flag:"碰过"}],
    r:"你伸了手。指尖碰到的时候,整片天安静了一下。\n\n然后你松开了。\n\n松开之后,一切照旧。叠合度照旧播报,人照旧疯,天照旧压着。\n\n但你从此知道它是温的。\n\n知道和改变,中间隔着八座城。"},
   {lb:"伸手,握住", echo:"你想松开,发现松不开了。它不疼,只是不再是一秒了——它变成了「一直在」。从此天上那套星星,有一只手。", hb:"全队 念 +12 · 握住就不一定放得开", cls:"tg",
    e:[{w:"all",st:"念",d:12},{flag:"握住了"},{will:4}],
    r:"你握住它。\n\n那一刻你听见了很多人——路上所有人的声音,一次全来了,挤在一秒里。\n\n你想松开,发现松不开了。\n\n它不疼。它只是不再是一秒了,它变成了「一直在」。\n\n从此天上那套星星,有一只手。"},
   {lb:"伸手,并且叫出它的名字", echo:"叫了名字,它就得应。它应了以后,压着人的那一下松了一指宽。八座城换一指宽,有人说不划算。陆昭说:我干的就是登记,我知道一个名字能有多大。", hb:"全队 念 +16 · 叫了名字,它就得应", cls:"tg",
    e:[{w:"all",st:"念",d:16},{flag:"叫名"},{will:6}],
    r:"你握住它,然后叫了它的名字。\n\n你叫的是它的本名——不是官家报的那个,是言舟在某一页纸上推出来的那一个。\n\n它应了。\n\n应了之后,天还是那个天。但压着人的那一下,松了一指宽。\n\n就一指宽。八座城,七段路,饿过的那些夜,换一指宽。\n\n有人说这不划算。\n\n陆昭说:我干的就是登记。我知道一个名字能有多大。"},
   {lb:"叫完名字,再问它一句:你疼不疼", echo:"你问了,它答了。它说疼。然后它说:我以为我在替他们。它和白证是同一个东西——这句话是你说给它听的。", hb:"全队 念 +24 · 它答了", tag:"第二问", cls:"tg",
    req:{flag:"叫名"},
    e:[{w:"all",st:"念",d:24},{flag:"问了天疼不疼"},{will:2}],
    r:"你握住它,叫了它的名字。它应了,松了一指宽。\n\n你没走。\n\n你问它:你疼不疼?\n\n整片天静了一下。\n\n然后它答了。\n\n它说:疼。\n\n小满在后面小声重复了一遍。她很多年前问过一个人同样的话,那次得到的答案也是这个字。\n\n你又问:你压着他们,他们知道吗?\n\n它说:不知道。我以为我在替他们。\n\n——它和白证是同一个东西。\n\n你们来了一趟,才把它自己也没意识到的事,说给它自己听。\n\n它没有反驳。它只是慢慢松开了手,松得比一指宽多,比一指宽少,谁也说不清。"},
   {lb:"叫完名字,把问题原样送回去:八亿人答不答", echo:"你问了,但你没替任何人回答。你听见天上说:那我去问。这一秒很长,长到足够问完八亿次。", hb:"全队 念 +20 · 你没替它答", tag:"第二问", cls:"tg",
    req:{flag:"叫名"},
    e:[{w:"all",st:"念",d:20},{flag:"没有替它答"},{will:2}],
    r:"你握住它,叫了它的名字。它应了。松了一指宽。\n\n然后它问你——不是用声音,是直接出现在你脑子里,像有人在你耳边放了一句话:\n\n「你替八亿人答了。八亿人答不答?」\n\n你愣住了。\n\n你想说「他们同意」。你想说「他们没反对」。你想说「来不及问」。\n\n三句话都在嘴边,都是白证说过的话。\n\n你一句都没说。\n\n你说:我不答。这是他们的事。\n\n然后你把那道问题原样送了回去——不是答,是问。\n\n你听见天上响起了一个很轻的声音。它说:那我去问。\n\n然后它真的去了。一秒很长,长到足够它问完八亿次。\n\n你不知道答案是什么。\n\n你只知道:从这一秒起,那八亿个人,是被问过的。"},
   {lb:"叫完名字,听回音——八亿个不一样的答案", echo:"你一直以为你叫的是它的名字。现在你听见了:它认的是它自己。它重新变成一个数字——有些东西知道了就回不去。", hb:"全队 念 +16 · 你听见了回音", tag:"第二问", cls:"tg",
    req:{flag:"叫名"},
    e:[{w:"all",st:"念",d:16},{flag:"听见了回音"},{will:2}],
    r:"你握住它,叫了它的名字。它应了,松了一指宽。\n\n然后你听见了回音。\n\n不是一句话。是八亿个不一样的声音同时在说话,有的在哭,有的在骂,有的在问「凭什么是我」,有的只是单纯地不想再听见了。\n\n你一直以为你叫的是它的名字。\n\n现在你明白了:你叫它的时候,它也认了——它认的是它自己。\n\n而这一秒里压在它下面的,不是它。是一整个不肯被数完的数。\n\n你松开手。\n\n天还是那个天。但从这一秒起,你听不见了——它重新变成一个数字。\n\n有些东西知道了就回不去。"}
  ]}}
];
function willVerdict(w,up){
  if(up>=6) return '八节里有六节你都没低头。这座城的规矩、那座城的规矩,你一节也没照着活。走到源城的时候,你是站着进去的。';
  if(w>=34) return '你大体上是硬着走过来的。有些节你绕了,有些节你忍了,但没有哪一节是你跪着过去的。';
  if(w>=20) return '你一半低头,一半没低头。这是大多数人的走法——活着走到西边,规矩也没改多少。';
  if(w>0)   return '你大多数时候都照着做了。这没什么可耻:照着做的人活得久。只是天还是那个天。';
  return '八节里你一节都没顶回去。你走到了源城,也确实走到了——只是走到的一路上,没有一件事是你自己决定的。';
}

function willEvent(){
  if(!WILL_EVENTS) return null;
  for(let i=0;i<WILL_EVENTS.length;i++){

  }

}

function flagEchoHTML(){
  const f=S.flags||{};
  const hits=FLAG_ECHO.filter(function(x){ return f[x.f] && x.city===S.ci; });
  if(!hits.length) return "";
  return hits.slice(0,2).map(function(x){
    return '<div class="flagecho"><b>你留下的痕迹</b> —— '+x.t+'</div>';
  }).join("");
}
function flagEchoCount(){ const f=S.flags||{}; return FLAG_ECHO.filter(function(x){return f[x.f];}).length; }

function mainEchoHTML(){
  if(!S.mainPick || S.ci<=0) return "";
  const pi=S.mainPick[S.ci-1]; if(pi==null) return "";
  const m=MAIN[S.ci-1]; if(!m || !m.ev.o[pi] || !m.ev.o[pi].echo) return "";
  return '<div class="mainecho"><b>上一节 · '+m.n+'</b> —— '+m.ev.o[pi].echo+'</div>';
}
function mainEv(){ return (MAIN[S.ci] && MAIN[S.ci].ev) ? MAIN[S.ci].ev : null; }
function mainTitle(){ const m=MAIN[S.ci]; return m ? ("西行志 · 第 "+(S.ci+1)+" 节 · "+m.n) : ""; }
/* 白证足迹:他第一次出现在秤城(第3城),之后每座城都留一道「近况」,
   让这条反派主线像一根贯穿全程的线 —— 你追着他往西走。 */
function baizhengLine(){
  const f=S.flags||{};
  if(!f["白证一"]) return "";
  const ci=S.ci; if(ci<=2) return "";
  const T={
    3:"白证比你们先到了颂城。他在城门口按着别人的肩膀,按一下,那个人就不疼了。按完他没回头,往西走。",
    4:"静默城里有人传,白证在那边一句话不说,只是挨个按。按过的人,从此记不得自己疼过——也记不得自己是谁。",
    5:"铁城的军报里夹了张条,据说是白证留的:大阵就差最后一块,他往源城去了。",
    6:"明夷快塌的时候,白证在废墟里走来走去,像在丈量什么。他说:再往西一步,就齐了。",
    7:"白证已经在源城了。他支起了那套大阵,说只差一个人按下去。他站着,等。"
  };
  const t=T[ci]; if(!t) return "";
  const pic = (PIC["白证"]&&PORTRAIT[PIC["白证"]]) ?
    '<img style="width:60px;float:right;margin:0 0 6px 10px;border-radius:4px;border:1px solid #d8cfbf" src="'+PORTRAIT[PIC["白证"]]+'" alt="白证">' : '';
  /* 白证不进队伍,但他的「例」(一个独缺念、差一点就倾覆的人)要让你看见。
     这里把他的立绘摆出来,跟着每座的近况一起走。 */
  return '<div class="baizheng" style="overflow:hidden">'+pic+'<span class="tag">白证近况</span>'+t+'</div>';
}

function endCount(){ try{ const st=achState(); return ACHIEVEMENTS.filter(function(a){return a.id.indexOf("end_")===0;}).filter(function(a){return st.u[a.id];}).length; }catch(e){ return 0; } }
function checkAch(){
  S.flags=S.flags||{};
  if(obsName()){ S.flags.obsEver=true; achUnlock("observer"); }
  if(S.recruited && S.recruited.length>=ROSTER.length) achUnlock("all_recruit");
  /* 意志成就:随时可解,不必等终局 */
  if((S.will||0)>=20) achUnlock("ironspine");
  if((S.will||0)>=28) achUnlock("hardhead");
  /* 痕迹/收藏:随时可解 */
  if(flagEchoCount()>=8) achUnlock("traces");
  if((S.items||[]).length>=15) achUnlock("paperman");
  /* 主线人物 / 剧情痕迹类成就 */
  if(S.flags["白证一"]) achUnlock("met_baizheng");
  if(S.flags["救小满"]) achUnlock("save_xiaoman");
  if(S.flags["拒绝陆萤"]) achUnlock("refuse_luying");
  if(S.flags["陆昭答应"]) achUnlock("accept_luying");
  if(S.flags["郑刻接管"]) achUnlock("zhengke");
  if(S.flags["陆昭被处决"]) achUnlock("luzhao_exec");
  if((S.ledger||[]).length>=6) achUnlock("ledger6");
  if(ledgerGrade()==="heavy") achUnlock("thick_ledger");
  if((S.met||[]).length>=5) achUnlock("all_met");
  if(S.flags["烧账"]) achUnlock("hidden_burn");
  if(S.flags["继续记"]) achUnlock("hidden_keep");
}
function openAch(){
  sfx("tap");
  const st=achState();

  /* 分组:结局 / 路上(意志·同行·见闻·抉择) / 隐藏(永远在最底下) */
  const GROUPS=[["结局",function(a){return a.id.indexOf("end_")===0 && !a.hidden;}],

    const list=ACHIEVEMENTS.filter(gp[1]);

    h+='<div class="achgrp"><span>'+gp[0]+'</span><i>'+n+' / '+list.length+'</i></div>';

    });
  });
  const hidList=ACHIEVEMENTS.filter(function(a){return a.hidden;});
  if(hidList.length){

    h+='<div class="achgrp"><span>隐藏</span><i>'+hn+' / '+hidList.length+'</i></div>';

      const on=!!st.u[a.id];
      h+='<div class="ach '+(on?"on":"off hid")+'"><div class="ai">'+(on?"★":"?")+'</div><div class="ax"><div class="an">'+(on?a.name:"？？？")+'</div><div class="ad">'+(on?a.desc:"隐藏成就 · 达成条件未知")+'</div></div></div>';
    });
  }
  h+='<div class="row"><button type="button" class="btn p" onclick="closeModal()">合上</button></div></div></div>';

/* ============ 结局判定 ============
   设计原则（2026-10-03 修正）：
   1) 每个结局都必须由玩家**做过的某个具体选择**触发,没有兜底默认值。
   2) 四枢刻度必须影响结局——「算」不够看不见真相,「念」不够听不见人,「义」不够推不开门。
   3) 白证是全程对照人物:他强在义 99 却缺「念」,所以他只能一个人按下去。
      玩家若比他多一样东西(愿意问),走的就是另一条路。*/
/* —— 账本厚度 ——
   「记住」在这个游戏里是可积累的量：死在你身边的人会进 S.ledger，
   而你一路主动替别人记下的那些事，会留下 flag。两样加起来就是账本的厚度。
   厚度的意义不在分数，在于：厚到一定程度，这本账自己就有重量了——
   它会开始替你做决定，而你未必想让它替你做。 */
const LEDGER_MARKS=[
  "继续记","自记","念名","只留姓","借过名字","抄过白证的名录","带走白证的账",
  "挨个问","替白证问","敲过一夜","改过一个字","留过一句","挪过一寸","见过白证"
];
function ledgerThickness(){
  const marks=LEDGER_MARKS.filter(function(x){return S.flags&&S.flags[x];}).length;
  const n=(S.ledger||[]).length;
  return { n:n, marks:marks, t:n+marks };
}
function ledgerGrade(){
  const t=ledgerThickness().t;
  return t>=10 ? "heavy" : (t>=5 ? "thick" : (t>0 ? "thin" : "blank"));
}
function ledgerBadge(){
  const th=ledgerThickness();
  const g=th.t>=10?"heavy":(th.t>=5?"thick":"thin");
  const nm={heavy:"重",thick:"厚",thin:"薄"}[g];
  const col={heavy:"#e0554a",thick:"#c8a45a",thin:"#7d8a99"}[g];
  return '<span style="font-size:12px;color:'+col+';letter-spacing:1px" title="账本厚度 = 死者 '+th.n+' 人 + 你主动记下的 '+th.marks+' 件 = '+th.t+'">账厚 '+th.t+' · '+nm+'</span>';
}
function judgeEnding(){
  const al=alive(), f=S.flags||{};
  /* —— 第零层:中途收手。
        这是玩家主动按下的停止键,不是任何一种走到头的走法——
        必须排在最前面,否则半路的账会被后面的判定改写成「走完了」。 —— */
  if(f["中途收手"]) return "stop";
  const top=k=>{ // 队伍内该项最高刻度
    let v=0; al.forEach(m=>{ if(m.s&&m.s[k]>v) v=m.s[k]; }); return v;
  };
  const avg=k=>{
    if(!al.length) return 0;
    let t=0; al.forEach(m=>{ t+=(m.s&&m.s[k])||0; }); return t/al.length;
  };

  /* —— 第零点五层:一路硬顶到底(西行志八节里大多数节都没低头)。
        必须排在「身边一个人也没剩」之前:意志是玩家一路上刻意打出来的东西,
        属于明确成就;人死光了更像一种结果,不该盖掉玩家的选择。 —— */
  if((S.will||0)>=34) return "unbowed";

  /* —— 第零点六层:源城的第二问。
        这三条必须在「全灭」和「硬顶」之后、「接阵」之前:玩家走到源城,
        已经听过天答过一次了——这比"一路没低头"更接近这个游戏真正要说的事。
        排序理由:它们都要求明确的第二问行为,是玩家主动走到的一步,不该被"死光了"盖掉。 —— */
  if(f["没有替它答"]) return "askback";
  if(f["问了天疼不疼"]) return "itpain";
  if(f["听见了回音"]) return "echochorus";

  /* —— 第一层:身边一个人也没剩。
        注意:不能写成 al.length===0 —— 陆昭的四枢锁死在九,changeStat 对他直接 return,
        他不可能死,所以 alive 永远至少为 1,写 0 这个结局就永远走不到。
        「人间没你」指的是除他之外一个都没剩下。 —— */
  if(al.length<=1) return "none";

  /* —— 第二层:明确接下大阵。这是有代价的选择,不是默认。 —— */
  if(f.接手大阵) return "second";

  /* —— 第二点五层:账本厚到能自己站住。
        要求「记」这件事你主动做了很多,而且还有人跟着你走到了这一段。
        排在「接阵」「让他做完」之后:那两条是你替所有人做了决定,
        这条是你没替任何人做决定,只是一页一页记了下来——两件事不能混。
        排在「活不到三个」之前,因为它认的是记的厚度,不是人数。 —— */
  if(ledgerGrade()==="heavy" && al.length>=2) return "thickbook";

  /* —— 第三层:让他做完。玩家认可了白证的路。 —— */
  if(f.让他做完) return "second";

  /* —— 第四层:活不到三个。人是攒不起来的。 —— */
  if(al.length<=2) return "zhang";

  /* —— 第五层:能力门槛决定"能不能自己走完"。
        这里用队伍平均念与义:念够=听得见人,义够=担得起。 —— */
  const nAvg=Math.round(avg("念")), yAvg=Math.round(avg("义")), gAvg=Math.round(avg("敢")), sAvg=Math.round(avg("算"));

  /* —— 第六层:听见了但没搭肩。这是最冷的失败:你什么都看见了,
        却只是看着。比全灭更难受,所以单独给它一条路。
        注意:陆昭四项锁死在 9,会把队伍平均值拉低约 15 点,
        所以门槛按"多数人达标"来定(约 45),不是按半数。 —— */
  if((S.obsEver || f.obsEver) && !S.shoulders){
    /* 你看见了真相(念/算够),但从头到尾没伸过手 */
    if(nAvg>=45 || sAvg>=45) return "observe";
  }

  /* —— 第七层:托举起所有人,但代价是有人再也退不出去。
        这条路要求"念"够高——因为你得先听见每个人的声音,才能让他们都签下。 —— */
  if((f.挨个问 || f.替白证问) && nAvg>=30) return "lift";

  /* —— 第八层:账本写满了人。没救回来几个,但都记住了。 —— */
  if(S.ledger.length>=6) return "rot";

  /* —— 第九层:有人请你喝过那杯(元彩蛋) —— */
  if(f.drink && al.length>=2) return "drink";

  /* —— 第十层:搭肩过。分过担,所以走得到。 —— */
  if(S.shoulders>=1) return "yu";

  /* —— 第十一层:能力全低且没人死。走完了,但什么都没做成。
        这是"你没长出任何东西"的那个结局,不是"你按了所有人的头"。 —— */
  /* 原条件要求四项平均都 <20 —— 陆昭之外的人刻度普遍在 40 以上,实际永远不成立。
     改成「全队没有任何一项推到 55」:你没长出任何东西,这才是「走到头了,然后没有然后」。 */
  { let peak=0; al.forEach(function(m){ STATS.forEach(function(k){ if((m.s[k]||0)>peak) peak=m.s[k]; }); });
    if(peak<55) return "flat"; }

  /* —— 第十二层:没有大阵、没人死、刻度尚可、也没搭肩。
        此时最合理的是"各走各的"——不是成为第二个白证。 —— */
  return "apart";
}

/* 给结局页用的数值小结:告诉玩家这一趟到底差在哪 */
function endingAdvice(){
  const al=alive();
  const avg=k=>{
    if(!al.length) return 0;
    let t=0; al.forEach(m=>{ t+=(m.s&&m.s[k])||0; }); return Math.round(t/al.length);
  };
  const f=S.flags||{};
  const miss=[];
  if(avg("念")<30) miss.push("念太低 · 你没真正听见队伍里的人在说什么");
  if(avg("义")<30) miss.push("义太低 · 没人肯把后背交给你");
  if(avg("算")<30) miss.push("算太低 · 关键处你没算出下一步");
  if(avg("敢")<30) miss.push("敢太低 · 你在每个该顶上去的瞬间退了");
  if(!S.shoulders) miss.push("全程没搭过肩 · 你一直是独自扛着的");
  if(S.ledger.length>=4) miss.push("账本上名字太多 · 你记住了,但没救回来");
  return miss;
}

/* ============ 工具 ============ */
const rank = v => v<1?"凡人":v<=20?"微执":v<=45?"持者":v<=70?"偏者":v<=90?"倾者":v<=99?"逆者":"倾覆";
const alive = () => S.crew.filter(m=>!m.dead);
const byName = n => S.crew.find(m=>m.name===n && !m.dead);
const topStat = m => STATS.reduce((a,b)=> m.s[b]>m.s[a]?b:a, "敢");

/* 观测:队里算最高的人。高于六十,才估得出路上的把握、看得见某些藏起来的路 */
function obsName(){
  let b=null; alive().forEach(m=>{ if(!b||m.s["算"]>b.s["算"]) b=m; });
  return (b && b.s["算"]>60) ? b.name : null;
}
/* 选项的署名标签:从效果里算出"谁·哪一项·加多少"。陆昭的项一律显示锁死 */
function effTag(o){
  const g={};
  const others=alive().filter(m=>m.name!=="陆昭").length;
  (o.e||[]).forEach(function(e){
    if(e.st){
      let w;
      if(e.w==="all"){ if(!others) return; w="全队"; }
      else if(e.w==="self") w="陆昭";
      else w=fixWho(e.w);
      if(w==="陆昭"){ if(!g["陆昭"]) g["陆昭"]=["锁9"]; return; }
      const k = e.st==="high" ? "主枢" : e.st;
      (g[w]=g[w]||[]).push(k+(e.d>=0?"+":"")+e.d);
    }
    else if(e.sh){ (g["搭肩"]=g["搭肩"]||[]).push("+1"); }
    else if(e.will){ (g["意志"]=g["意志"]||[]).push((e.will>=0?"+":"")+e.will); }
  });
  return Object.keys(g).map(function(w){ return w+" "+g[w].join(" "); }).join(" · ");
}

/* 剧本里写死了这五个人的名字。谁没被招进来,就由队里同主枢的人顶上——文本自洽,不会串场 */
const ORIG_NAME = ["陶矜","言舟","崔十七","阿织","小满"];
const ORIG_SUB  = {"陶矜":"义","言舟":"算","崔十七":"敢","阿织":"念","小满":"low"};
const mxStat = m => Math.max(m.s["敢"], m.s["念"], m.s["算"], m.s["义"]);
function subFor(n){
  const k = ORIG_SUB[n]; if(!k) return null;
  const a = alive().filter(m=>m.name!=="陆昭");
  if(!a.length) return "陆昭";
  if(k==="low") return a.reduce((b,m)=> mxStat(m)<mxStat(b)?m:b, a[0]).name;
  return a.reduce((b,m)=> m.s[k]>b.s[k]?m:b, a[0]).name;
}
/* 性别：谁是谁。一局之内不变，替换名字时用来改代词。
   这张表必须覆盖「所有可能被填进空缺的名字」——不只是 ORIG_NAME 五个，
   还要包括陆昭和任何可入队角色（老周/郑刻/白证…）。
   否则 fixGender 遇到不在表里的替身会跳过代词替换，
   出现「崔十七（男）顶了小满（女），却还叫她」这类性别错乱。 */
const ORIG_GENDER={"陶矜":"f","言舟":"m","崔十七":"m","阿织":"f","小满":"f","陆昭":"m","老周":"m","郑刻":"m","白证":"m"};
/* 替换名字时必须连性别代词一起换。
   否则会出现「崔十七 正义+14 · 她的条子」这种——
   名字被换成了崔十七（男），代词「她」还留在那儿，
   玩家看到的是崔矜同体。配色是设计，代词错乱是 bug。 */
function fixGender(text, fromName, toName){
  const g1=ORIG_GENDER[fromName], g2=ORIG_GENDER[toName];
  if(!g1 || !g2 || g1===g2) return text;
  return String(text).split(g1==="f"?"她":"他").join(g2==="f"?"她":"他");
}
function fixNames(t){
  if(!t) return t;
  ORIG_NAME.forEach(n=>{
    if(t.indexOf(n)>=0 && !byName(n)){
      const s = subFor(n);
      if(s && s!==n){ t = fixGender(t.split(n).join(s), n, s); }
    }
  });
  return t;
}
function fixWho(w){
  if(!w || w==="all" || w==="self" || String(w).indexOf("high:")===0) return w;
  if(byName(w)) return w;
  if(ORIG_NAME.indexOf(w)>=0){ const s=subFor(w); if(s) return s; }
  return w;
}
const power = m => Math.round(Math.max(...STATS.map(k=>m.s[k]))*1.2) + (S.relics.filter(r=>r.equipped===m.name)).reduce((a,r)=>a+r.power,0);
const teamPower = () => alive().reduce((a,m)=>a+power(m),0);

function pickTargets(w){
  if(w==="all") return alive();
  if(w==="self"){const l=byName("陆昭");return l?[l]:[];}
  if(String(w).indexOf("high:")===0){const k=w.split(":")[1];let b=null;alive().forEach(m=>{if(!b||m.s[k]>b.s[k])b=m;});return b?[b]:[];}
  const m=byName(fixWho(w)); return m?[m]:[];
}

/* ============ 选项可信度 ============
   玩家反馈里最伤的一条是「有的人物还没出现过就在选项里了」，
   以及「队友A 出问题，A 可以和自己互动」。
   根因：事件文案是写死的，而队伍是活的。
   「陶矜用欠条保他」在陶矜没入队时照样显示；
   更糟的是有事件的效果目标是事件主角自己——
   主角就是陶矜时，这条就变成了「陶矜用欠条保陶矜」。
   下面两个函数把「文案里的名字」和「当前队伍」对上，
   对不上就别显示——玩家看不到自己演不了的那场戏。 */

/* 文案里提到的角色，现在还在队里吗？
   认所有 ORIG_NAME 里的名字（陶矜/言舟/崔十七/郑刻…），
   也认「他/她」这种代词——代词一律按最近出现的人名解。 */
const NARRATOR="陆昭";
function mentionedNames(t){
  const found=[];
  if(!t) return found;
  ORIG_NAME.concat(["陆昭"]).forEach(function(n){
    if(n && t.indexOf(n)>=0) found.push(n);
  });
  return found;
}
/* 这条选项在当前队伍下还成立吗？
   规则：
     - 效果目标必须能落到活人身上
   单人队时另有一层：需要别人参与的事做不成。
   ——但不能因此让玩家无路可走，所以最后有一步兜底：
      一个事件至少留两条能走的路。宁可给一条「自己硬扛」的选择，
      也不能让玩家对着一屏灰字只能按空格。 */
function optionAlive(o){
  const al=alive();
  /* 单人队：任何需要「别人」参与的事都做不成。
     判据是效果里有没有指向具名他人或 high:（最高者必然是别人）。 */
  if(al.length<=1){
    const e=o.e||[];
    for(let i=0;i<e.length;i++){
      const x=e[i];
      if(!x.st) continue;
      if(x.w==="all"||x.w==="self") continue;         // 陆昭自己，铁律锁死，不算
      if(String(x.w).indexOf("high:")===0) return false;  // 「队里最高的」——只有一人时无意义
      if(x.w!=="陆昭" && x.w!==NARRATOR) return false;    // 指向一个现在不在队里的人
    }
  }
  /* 效果目标必须真能落地。原先 pickTargets 对不存在的名字返回空数组，
     效果就悄悄消失了——玩家选了却什么都没发生，还以为自己算错了。 */
  const e=o.e||[];
  for(let i=0;i<e.length;i++){
    const x=e[i];
    if(x.st && x.w!=="all" && x.w!=="self" && String(x.w).indexOf("high:")!==0
       && x.w!=="陆昭" && !byName(fixWho(x.w))) return false;
  }
  return true;
}

/* 一个事件在当前队伍下，能走的路有几条？
   门槛（req）不满足的也算——那些会显示成灰的「看得见但走不通」，
   它们是玩家的目标提示。全空才是死路。 */
function viableOptions(ev){
  const out=[];
  ev.o.forEach(function(o){
    if(!optionAlive(o)) return;
    if(o.req){
      const isWill=(o.req.will!==undefined);
      const met=isWill ? ((S.will||0)>=o.req.will)
                       : alive().some(m=>m.s[o.req.stat]>=o.req.min);
      if(!met && !o.req.hard) {
        /* 灰显的也算一条路：玩家看得见自己在哪不够。
           但若全城都这样，就等于没有路——所以只算「有观测时」的那种。 */
        if(!obsName()) return;
      }
    }
    out.push(o);
  });
  return out;
}

/* 把文案里的属性名统一成双字：念→精神、算→谨慎、敢→勇气、义→正义。
   为什么统一成双字：单字是数据层的键（m.s["念"]），玩家看不见也不该看见；
   双字才是给人看的东西，界面上其它地方（队伍卡/搭肩/佩戴/铸器）
   一律用双字——STAT_NAME 就是那张对照表。
   两种名字同时出现在一屏上，玩家会当成两套系统：
   「念+14」和「勇气+25」看起来不像一回事，于是「我选的到底是哪个？」。

   之前 335 条后果文案里有 202 条用单字、133 条用双字，
   现在统一在渲染层转换——不手改文案，那些语气都是调过的。 */
const STAT_WORD={敢:"勇气",念:"精神",算:"谨慎",义:"正义"};
function unifyStatWords(t){
  if(!t) return t;
  /* 只在「属性字紧跟符号数字」的位置换，也就是「念 +14」这种。
     两个前置条件缺一不可：
       1. 前面不能紧挨着另一个同类字 —— 否则「正义 +10」里的「义 +10」
          会被当成单字属性，转完变成「正正义 +10」。
          （这是实测踩到的：结算里出现「全队 正正义 +6」。）
       2. 只认单字形态，属性字本身不能是双字的一部分。
     另外「他念叨了两句」这种普通词也不能动 —— 后面必须跟符号数字。 */
  /* 运算符除了 +−- 还有 ≥ > → 这几种（实测漏过「要有人 念 ≥ 40」），
     一并纳入，否则门槛提示会露出单字。 */
  const OP = "\\s*(?:[+\\u2212-]|≥|\\u2265|>|<|→|\\u2192)\\s*\\d";
  const re = new RegExp("([^\\u4e00-\\u9fa5])(敢|念|算|义)(" + OP + ")", "g");
  return String(t)
    .replace(re, function(m, prev, word, num){
      if(/[正勇精谨]/.test(prev)) return m;
      return prev + STAT_WORD[word] + num;
    })
    /* 句首的那一个：「念 +12」。上面那条要求前面有个非汉字，
       句首没有，所以单独处理。 */
    .replace(new RegExp("^(敢|念|算|义)(" + OP + ")"), function(m, word, num){
      return STAT_WORD[word] + num;
    })
    /* 「主枢 / 最高枢」是抽象统称，不是第五个属性名。
       它没法翻成双字（谁的哪一枢？），但光秃秃一个「主枢 -8」会和
       「勇气 -8」混在一起，让人以为又有一套东西。
       所以统一裹上书名号：它立刻退回「术语」的位置。
       注意「最高枢」是「最」+「高枢」，不是「高」+「主枢」；
       空格必须留在引号外，否则「」和数字会脱开。 */
    .replace(/((?:全队|队)?(?:最高枢|主枢)|四枢(?:各)?)(\s*(?:[+\u2212-]|≥|>|<|→)\s*\d+)/g,
      function(m, word, rest){
        return "「"+word+"」"+rest;
      });
}

/* ============ 刻度 / 倾覆 ============ */
function changeStat(m, k, d){
  if(m.dead) return null;
  /* 大纲铁律:陆昭的四枢永远锁死在 9——他一样也不肯舍弃,每次要往一边走,另一边就把他拉回来 */
  if(m.name==="陆昭") return null;
  const before = m.s[k];
  m.s[k] = Math.max(0, Math.min(100, m.s[k]+d));
  const after = m.s[k];
  if(after>=100){ overturn(m,k); return "dead"; }
  if(after>=91 && after>before && Math.random() < (after-90)*0.06){ overturn(m,k); return "dead"; }
  if(after>=91 && after>before) return "risk";
  return null;
}
function overturn(m,k){
  sfx("die"); achUnlock("overturn");
  m.dead = true; m.deadBy = k;
  const way = Math.random()<0.45 ? "崩身" : "归星";
  m.way = way;
  S.relics.filter(r=>r.equipped===m.name).forEach(r=>r.equipped=null);
  S.pending = m;}

/* ============ 拾得的纸 ============ */
function addItem(n){ if(S.items.indexOf(n)<0) S.items.push(n); }
/* 无主遗骸器:不是从本队某个人的倾覆里铸出来的,来源是外头的活人/死人。
   跟队友遗骸器的区别:
     owner = null  →  UI 不显示"谁做的",也不许装备(没人可戴)
     不进 S.ledger  →  陆昭的账本只记他认识的人,这件事他不认识
   设计依据:养器铺那把刀(《发布/index.html》养器铺事件)——
   一个人被锁了三年替有钱人养刀,刀是拿他的三年喂出来的,不是拿尸体做的。
   所以它该在遗骸器栏,但跟"某某的刀"不是一回事。 */
function addLooseRelic(o){
  S.relics=S.relics||[];
  if(S.relics.some(function(r){return r.name===o.name;})) return;
  S.relics.push({name:o.name, owner:null, stat:o.stat, power:o.power, infect:o.infect,
                 equipped:null, loose:true, desc:o.desc||""});
}

function applyEffects(list){
  const dead=[], risk=[];
  list.forEach(e=>{
    if(e.item){ addItem(e.item); }
    /* 非队长的遗骸器:来源不是本队某人的倾覆,而是路上买下/捡到的东西
       (例:养器铺里那个被锁了三年的人替他养的刀)。
       没有主人名,所以不写进 S.ledger,也不能装备——只能被登记、只能看。 */
    if(e.relic){ addLooseRelic(e.relic); }
    if(e.drop){ S.relics = S.relics.filter(r=>r.name!==e.drop); }
    if(e.flag){ S.flags = S.flags||{}; S.flags[e.flag]=true; }
    if(e.sh){ S.shoulders += e.sh; }
    if(e.will){ S.will = Math.max(0,(S.will||0)+e.will); S.willLog=S.willLog||{}; S.willLog[S.ci]=Math.max(S.willLog[S.ci]||0,e.will); }
    if(e.note){ S.log.push(e.note); }
    if(e.st){
      pickTargets(e.w).forEach(m=>{
        const k = e.st==="high" ? topStat(m) : e.st;
        const r = changeStat(m,k,e.d);
        if(r==="dead") dead.push(m); else if(r==="risk") risk.push(m);
      });
    }
  });
  return {dead,risk};
}

function audioInit(){
  if(AC) { try{ if(AC.state==="suspended") AC.resume(); }catch(e){} return true; }
  try{
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return false;
    AC = new Ctor();
    MASTER = AC.createGain(); MASTER.gain.value=.85;
    VERB = AC.createConvolver();
    const rate=AC.sampleRate, len=Math.floor(rate*2.6);
    const buf=AC.createBuffer(2,len,rate);
    for(let ch=0; ch<2; ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 2.8);
    }
    VERB.buffer=buf;
    const wet=AC.createGain(); wet.gain.value=.34;
    VERB.connect(wet); wet.connect(MASTER);
    MASTER.connect(AC.destination);
    return true;
  }catch(e){ return false; }
}

function startDrone(){
  if(DRONE || !AC) return;
  try{
    DRONE=AC.createOscillator(); DRONE.type="triangle";
    DRONE_G=AC.createGain(); DRONE_G.gain.value=0;
    const lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=300;
    DRONE.connect(lp); lp.connect(DRONE_G);
    DRONE_G.connect(MASTER); DRONE_G.connect(VERB);
    DRONE.frequency.value=110;
    DRONE.start();
  }catch(e){}
}
function setDrone(freq, vol){
  if(!DRONE || !AC) return;
  try{
    DRONE.frequency.setTargetAtTime(freq, AC.currentTime, 1.4);
    DRONE_G.gain.setTargetAtTime(vol, AC.currentTime, 1.2);
  }catch(e){}
}
function ping(freq, dur, vol, type){
  if(!AC) return;
  try{
    const t=AC.currentTime;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol, t+.04);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(MASTER); g.connect(VERB);
    o.start(t); o.stop(t+dur+.06);
  }catch(e){}
}
function thud(){
  if(!AC) return;
  try{
    const t=AC.currentTime;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(72,t);
    o.frequency.exponentialRampToValueAtTime(38,t+.15);
    g.gain.setValueAtTime(.15,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(g); g.connect(MASTER);
    o.start(t); o.stop(t+.24);
  }catch(e){}
}
function mTick(){
  const m=MOODS[MOOD_NOW] || MOODS.calm;
  if(Math.random()<.74){
    const deg=m.sc[Math.floor(Math.random()*m.sc.length)];
    const semi=deg + m.oct + (Math.random()<.24?12:0);
    ping(110*Math.pow(2, semi/12), 1.7+Math.random()*1.5, m.vol*(.6+Math.random()*.5), "sine");
  }
  if(m.beat && MSTEP%2===0) thud();
  if(m.dis>0 && Math.random()<m.dis){
    ping(110*Math.pow(2, (m.sc[0]+1+m.oct)/12), 1.3, m.vol*.65, "triangle");
  }
  MSTEP++;
}
function setMood(k){
  MOOD_NOW=k;
  if(!SND || !AC) { if(MTIMER){ clearInterval(MTIMER); MTIMER=null; } return; }
  const m=MOODS[k] || MOODS.calm;
  if(MTIMER){ clearInterval(MTIMER); MTIMER=null; }
  startDrone();
  setDrone(m.drone, k==="grief"?.034:.05);
  MTIMER=setInterval(mTick, Math.round(60000/m.bpm));
}
function stopMusic(){

function gameMood(){
  if(S.phase==="epilogue") return "end";
  if(S.pending) return "grief";
  if(S.phase==="city") return "calm";
  let mx=0;
  alive().forEach(function(m){ const v=Math.max(m.s.敢,m.s.念,m.s.算,m.s.义); if(v>mx) mx=v; });
  if(mx>=91) return "danger";
  if(mx>=71) return "tense";
  const c=CITIES[S.ci];
  if(c && c.ov>=.62) return "tense";
  return "walk";
}

function sfx(kind){
  if(!SND) return;
  if(!audioInit()) return;
  if(kind==="mu"){
    try{
      const t=AC.currentTime, len=Math.floor(AC.sampleRate*.14);
      const b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, 4.5);
      const src=AC.createBufferSource(); src.buffer=b;
      const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=820; bp.Q.value=2.5;
      const g=AC.createGain(); g.gain.value=.42;
      src.connect(bp); bp.connect(g); g.connect(MASTER); g.connect(VERB);
      src.start(t);
    }catch(e){}
  }else if(kind==="die"){
    try{
      const t=AC.currentTime;
      const o=AC.createOscillator(), g=AC.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(140,t);
      o.frequency.exponentialRampToValueAtTime(32,t+.9);
      g.gain.setValueAtTime(.17,t);
      g.gain.exponentialRampToValueAtTime(.001,t+1.0);
      o.connect(g); g.connect(MASTER); g.connect(VERB);
      o.start(t); o.stop(t+1.05);
    }catch(e){}
  }else{
    ping(720, .09, .04, "sine");
  }
}

/* ============ 存档导出 / 导入 ============
   localStorage 按"浏览器+网址"隔离:手机存的电脑看不到,线上链接存的 itch.io 也看不到。
   导出成一段文字即可跨设备搬运。 */
const B64C="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
function b64enc(str){
  const utf8=new TextEncoder().encode(str);
  let out="";
  for(let i=0;i<utf8.length;i+=3){
    const a=utf8[i], b=i+1<utf8.length?utf8[i+1]:0, c=i+2<utf8.length?utf8[i+2]:0;
    const n=(a<<16)|(b<<8)|c;
    out+=B64C[(n>>18)&63]+B64C[(n>>12)&63]+(i+1<utf8.length?B64C[(n>>6)&63]:"=")+(i+2<utf8.length?B64C[n&63]:"=");
  }
  return out;
}
function b64dec(str){
  const s=String(str).replace(/[\s\r\n]/g,"");
  const bytes=[]; let buf=0,bits=0;
  for(let i=0;i<s.length;i++){
    const v=B64C.indexOf(s[i]);
    if(v<0) continue;
    buf=((buf<<6)|v); bits+=6;
    if(bits>=8){ bits-=8; bytes.push((buf>>bits)&255); }
  }
  return new TextDecoder().decode(new Uint8Array(bytes));
}
function saveToken(){
  const d=loadSave();
  if(!d) return "";
  return b64enc(JSON.stringify({v:1,ts:Date.now(),d}));
}

}

function copySave(){
  const ta=el("savetok"); if(!ta) return;
  const fallback=()=>{
    ta.select(); ta.setSelectionRange(0,999999);
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    saveTip(ok?"已复制到剪贴板":"请长按或 Ctrl+C 手动复制");
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(()=>saveTip("已复制到剪贴板"),fallback);
  } else fallback();
}
function importSave(){
  sfx("tap");
  const box=el("savein");
  const raw=(box&&typeof box.value==="string")?box.value.trim():"";
  if(!raw){ saveTip("先粘贴一段存档文字"); return; }
  let obj=null;
  try{ obj=JSON.parse(b64dec(raw)); }catch(e){}
  if(!obj||typeof obj!=="object"||!obj.d){
    saveTip("这段存档不完整,复制时要连开头结尾一起带上"); return;
  }
  const d=obj.d&&obj.d.crew?obj.d:null;
  if(!d){ saveTip("存档内容不完整或已损坏"); return; }
  S=d; delete S.pending;
  save();
  closeModal();
  saveTip("已导入存档");
  setTimeout(()=>{ closeTitle(); render(); },400);
}

   ok:"他愣了很久,说:你哪儿不正常?\n\n陆昭说:我什么都不肯扔。\n\n他想了想,说:那更严重。\n\n他跟了上来。",
   no:"他说:那你也不需要我。"},
  {lb:"「我们需要敢冲的人。」", p:55,
   ok:"他眼睛亮了一下,随即暗下去:你们需要的是敢死的。\n\n他说完还是跟了上来。",
   no:"他说:我冲了十一次。第十二次我跑了。"},
  {lb:"「你为什么道歉?」", p:80,
   ok:"他说:习惯了。\n\n他说完沉默了很久,然后说:从来没有人问过。\n\n他跟了上来。",
   no:"他说:不知道。他低下头,没有动。"}],
 join:"崔十七入队。他走在最后。他说他习惯走在最后,因为前面的人死了他能看见。"},

/* —— 第三座城前 —— */
{name:"言舟", pic:"yanzhou", city:2, s:{敢:8,念:22,算:60,义:19}, tag:"流亡预测官 · 算六十,差一点", sub:"算",
 meet:"一个人蹲在路边,用石头在地上画格子。一格一个数。\n\n他说:你们往西的话,第一站活下来的概率是零点六八。第二站零点五一。\n\n他说:再往后我不算了。算了也没人听。",
 ask:[
  {lb:"「算我自己。」", p:65,
   ok:"他抬头看了很久,说:零点四。是这些人里最高的一个。\n\n他说完把石头放下,站起来:我跟你走,我还可以接着算。",
   no:"他说:算了你会后悔。\n\n他继续画格子。"},
  {lb:"「你为什么被赶出来?」", p:75,
   ok:"他说:我把日子说出去了。\n\n他说完看着你:你不会赶我走吧。\n\n你说不会。他跟了上来。",
   no:"他说:说了你也不信。\n\n他低头继续画。"},
  {lb:"「数字救不了人。」", p:40,
   ok:"他说:我知道。\n\n他站起来:但我只会这个。他跟了上来。",
   no:"他说:那我就更没用了。\n\n他没有站起来。"}],
 join:"言舟入队。他做的第一件事是把全队的存活概率重算了一遍。算完低了。他没说。\n\n走之前他说了一句:我六十。就差那么一点——过了六十,路上的把握我就能替你们估出来。\n\n他说:你们帮我记着这一样。"},

{name:"小满", pic:"xiaoman", city:2, s:{敢:12,念:16,算:9,义:18}, tag:"十一岁 · 捡了一件衣裳", sub:"low",
 meet:"一个小孩坐在路牌下面,抱着一个包。她已经在这儿坐了两天。\n\n她问:你们往西吗。\n\n她说:我不问能不能跟。我问往西吗。",
 ask:[
  {lb:"「往西。」", p:85,
   ok:"她站起来,把包背上,说:那我跟你走。\n\n她说得很干脆,像早就想好了。",
   no:"她点点头,坐回去:那我在这儿等下一个往西的。"},
  {lb:"「你叫什么?」", p:90,
   ok:"她说:小满。\n\n她说完反问:你记下来了吗?\n\n陆昭把本子拿出来写。她跟了上来。",
   no:"她说了名字,然后坐回去,没有再说话。"},
  {lb:"「你家里人呢?」", p:50,
   ok:"她说:没了。\n\n她又说:你别可怜我,可怜我的人后来都走了。\n\n陆昭说:我不可怜你,我记你。\n\n她跟了上来。",
   no:"她不说话了。抱紧了包。"}],
 join:"小满入队。她的包里只有一件捡来的衣裳和半袋糖。"},

/* —— 第五座城前 —— */
{name:"阿织", pic:"azhi", city:4, s:{敢:11,念:55,算:13,义:22}, tag:"从共同体里撕下来的", sub:"念",
 meet:"一个人坐在土坡上,两只手捂着耳朵。\n\n她听见很多人。城里的人,路上的人,死了的人。她已经三天没睡。\n\n她说:你别说话。你一说话我就得多听一个人的。",
 ask:[
  {lb:"「那我不说。」", p:75,
   ok:"她等了很久。\n\n然后她说:你真的不说了。\n\n她把手放下来,第一次睁开眼:我已经很久没遇见不说话的人。\n\n她跟了上来。",
   no:"她等了很久,然后重新捂上耳朵。"},
  {lb:"「我能帮你挡一点。」", p:55,
   ok:"她说:你怎么挡。\n\n陆昭说:我听着。\n\n她说:你听不完。\n\n但她还是站了起来。",
   no:"她说:挡不住的。她坐着没动。"},
  {lb:"「你叫什么?」", p:70,
   ok:"她很久才回答:阿织。\n\n她说:很久没人叫过了。\n\n她跟了上来。",
   no:"她没有回答,捂着耳朵。"}],
 join:"阿织入队。她走在中间,因为两边都有人,她就听得匀一点。"},

/* —— 第四座城前 —— */
{name:"老周", pic:"laozhou", city:3, s:{敢:6,念:8,算:7,义:12}, tag:"收尸人 · 什么也不会,就会摆", sub:"low",
 meet:"一个老头蹲在路边,正在把一具尸体摆正。\n\n他说:摆正了好看点。\n\n他说:我不觉醒,我也不会什么。我就会摆。\n\n他说:你们要不要一个摆尸体的。",
 ask:[
  {lb:"「要。」", p:90,
   ok:"他说:那我跟你走。\n\n他说完把最后一个人摆正,站起来:我这活儿,到哪儿都有。",
   no:"他说:那我不添乱。他继续摆。"},
  {lb:"「你不害怕?」", p:70,
   ok:"他说:怕。\n\n他说完站起来:怕也得摆。\n\n他跟了上来。",
   no:"他说:怕。他蹲着没动。"},
  {lb:"「你图什么?」", p:75,
   ok:"他说:图他们有个样子。\n\n他说完跟着你走了。",
   no:"他说:不图。他继续摆。"}],
 join:"老周入队。他入队第一天,把路上三具没人管的尸体摆正了。队里没人笑话他。"},

/* —— 第五座城前 —— */
{name:"郑刻", pic:"zhengke", city:4, s:{敢:31,念:26,算:38,义:63}, tag:"白证师弟 · 跟他是一路人", sub:"义",
 meet:"一个人拦在路中间。\n\n他说:你们往西?那你们迟早要碰上白证。\n\n他说:我不跟白证。我跟他是一路人,所以我更知道他错在哪儿。\n\n他说:带上我。到了那边你们会需要有人认得他。",
 ask:[
  {lb:"「你跟他什么关系?」", p:60,
   ok:"他说:他是我师兄。\n\n他说完往边上让了一步:所以我更得去。\n\n他跟了上来。",
   no:"他说:说了你也不信。他没让开,但也没跟上来。"},
  {lb:"「你怎么证明你不是他。」", p:70,
   ok:"他说:证明不了。\n\n他说完笑了:所以他才对,我才得跟着你们,让你们看着。\n\n他跟了上来。",
   no:"他说:证明不了。他走了。"},
  {lb:"「走吧。」", p:55,
   ok:"他跟了上来。边走边说:你答得太快了。",
   no:"他说:太快了。他没动。"}],
 join:"郑刻入队。他入队第一件事是问队里每个人的义是多少。问完他说:都太低了。"},

  x:"陆萤比陆昭小五岁。\n\n她妈死得早。陆昭在医院太平间上了三年班,就是为了那点职工家属补助,供她念书。他登记死人的时候,她在楼下等他下班,一等就是三个小时。\n\n她从来不问他在楼上干什么。他也不说。\n\n覆写第七天,她为了把他从塌了的楼里拖出来,把能用的都用完了。\n\n她最后一句话是:哥,你记着记我。"},
 {t:"我在记我欠了多少",
  x:"陆昭记了。编号〇〇〇一。陆萤。念 96。归星。\n\n后来他带着她的半只耳蜗上路。戴上能听见她说话,一次比一次短。\n\n他给每个人记账,是从她开始的。\n\n陶矜有次问他:你到底在记什么。\n\n他说:我在记我欠了多少。\n\n陶矜说:你欠谁的。\n\n他说:所有人。"}
]},
{city:6, who:"陆昭", p:[
 {t:"这一栏大部分人空着",
  x:"陆昭在太平间做了三年登记员。\n\n他的活儿是:人进来,填一张表,写清楚编号、姓名、随身物品、死因。表上有一栏叫附注,大部分人空着。\n\n他每一张都填。\n\n〇七三一,男,五十九,随身一只没拆封的灯泡。附注:他大概想换个亮一点的屋子。\n\n〇四八八,女,三十四,随身一张没寄出去的信。附注:她想说的话比信长。\n\n〇九〇二,男,七岁。附注:这个我不知道。\n\n最后这张他写了一整夜。写出来的就是这句。"},
 {t:"今欠",
  x:"他不放人。\n\n该忘的他忘不掉,该扔的他扔不掉,该结的账他永远不结。账本越写越厚,他一页也没撕过。\n\n就因为这个,他的四项枢永远是九、九、九、九。测不出偏执,因为他哪一边都不肯走到头。\n\n城里管这叫完人。他自己知道这是什么:他只是不肯把任何一个人划掉。\n\n明夷在前头。进去的人,大部分出不来。\n\n他把账本翻到最后一页,写了一行:今欠。\n\n然后带人往里走。"}
]},
{city:7, who:"说书的", p:[
 {t:"走到这儿",
  x:"城门口那个说书的老头,每座城都有。\n\n他面前摊着一本《诸城志》,从来不翻。他说词,但不说下回分解,因为他说他知道后头是什么。\n\n陆昭第二次见他的时候问:您到底是谁。\n\n老头说:我是上一批里,走到的那个人。\n\n陆昭问:走到哪儿。\n\n老头说:走到这儿。"},
 {t:"记得就是欠着",
  x:"老头说,上一次他也带了一队人,也是四个,也是往西。\n\n他说:我记得每个人的名字,一共四个。到现在我还记得。\n\n陆昭说:那挺好。\n\n老头说:不好。记得就是欠着。\n\n他把《诸城志》合上,说了句陆昭听不懂的话:再往西,还有一座城。过了那座呢?还有一座。\n\n后来陆昭才明白,他说的不是城。\n\n陆昭问:那您怎么还坐在这儿。\n\n老头说:我在等下一个肯记账的。"}
]},
{city:4, who:"卖静的", p:[
 {t:"一罐安静",
  x:"静默城外有个摊子,卖的是「安静」。\n\n摊主说:装罐里,带出去。别处太吵了。\n\n陆昭问:怎么卖。\n\n摊主说:按安静的纯度。顶级的,开罐之后,方圆三里没人想说话。\n\n崔十七试了一罐,回来半天没吭声。\n\n陆昭问:怎么样。\n\n崔十七说:……\n\n他说不出来。那是顶级的。"},
 {t:"安静的保质期",
  x:"陆昭问罐子能放多久。\n\n摊主说:看装的是哪种安静。「没人理你」的那种放得最久,十年八年。「大家都累」的那种,出城就散。\n\n陆昭说:那我买后一种。\n\n摊主说:后一种不卖。那是静默城自己产的,免费,你待久了自然有。\n\n陆昭在账本上记:安静也有产地。本城产的最便宜,也最贵——得拿命待出来。"}
]}

"病人开的方子":

"过审颂词":

function drinkMarked(){ try{ return localStorage.getItem("erchongtian_drink")==="1"; }catch(e){ return false; } }
function markDrink(){ try{ localStorage.setItem("erchongtian_drink","1"); }catch(e){} }
function zoomQR(){
  markDrink();
  try{ S=S||{}; S.flags=S.flags||{}; S.flags.drink=1; }catch(e){}
  openQR();
}

function openQR(){
  sfx("tap");
  var box=el("modal"); if(!box) return;
  box.innerHTML='<div class="mask"><div class="dlg" style="max-width:620px;text-align:center">'+
    '<div class="prostep" style="text-align:left">请佚笑喝一杯</div>'+
    '<img src="'+QRIMG+'" alt="微信赞赏码" style="width:100%;max-width:520px;display:block;margin:16px auto 6px;background:#fff;border:1px solid var(--line);image-rendering:pixelated">'+
    '<p style="font-size:12.5px;color:var(--ink3);margin:12px 0 0">微信扫一扫 · 长按图片也能识别<br>这一杯，他会记在账本最后一页。</p>'+
    '<div class="row" style="justify-content:center">'+
      '<button type="button" class="btn" onclick="openAbout()">返回</button>'+
      '<button type="button" class="btn p" onclick="closeModal()">合上</button>'+
    '</div>'+
  '</div></div>';
}

function showTitle(){
  const c=el("cover");
  if(!c) return;
  const has=hasSave();
  c.innerHTML='<div class="coverin">'+
    '<div class="bigt">第二重天</div>'+
    '<div class="subt">西行 · 八座城 · 一座也不剩</div>'+
    '<div class="coverrule"></div>'+
    '<div class="menu">'+
    '<button type="button" class="main" onclick="startNew()">开始西行</button>'+
    '<button type="button" '+(has?"":"disabled")+' onclick="continueGame()">'+(has?"继续上次":"继续上次(暂无存档)")+'</button>'+
    '<button type="button" onclick="openPrologue(false)">背景故事</button>'+
    '<button type="button" onclick="openHelp()">玩法说明</button>'+
    '<button type="button" onclick="showOnboard(0)">新手引导</button>'+
    '<button type="button" onclick="openJourney()">走到哪儿了</button>'+
    '<button type="button" onclick="openSaveIO()">存档</button>'+
    '<button type="button" onclick="openAch()">成就 '+achCount()+'</button>'+
    '<button type="button" onclick="openPower()">战力榜</button>'+
    '<button type="button" onclick="openAbout()">关于 · 打赏</button>'+
    '</div>'+
    '<div class="coverfoot">单文件 · 离线可玩 · 进度存在本机<br>历史最高战力 <b>'+hiscore()+'</b> · 没看过原作也能玩,建议先花半分钟读「背景故事」</div>'+
    '</div>';
  c.classList.remove("off");
}
function closeTitle(){ const c=el("cover"); if(c) c.classList.add("off"); }
function returnToTitle(){ try{ save(); }catch(e){} showTitle(); }

function musicOn(){
  if(!SND) return;
  try{ if(audioInit()) setMood(gameMood()); }catch(e){}
}
function startNew(){
  try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_BAK); }catch(e){}
  newGame(); closeTitle(); sfx("mu");
  let seen=false; try{ seen=localStorage.getItem("ersky_pro")==="1"; }catch(e){}
  if(!seen) openPrologue(true);
  else { render(); musicOn(); maybeTutorial(); }
}
function continueGame(){
  const d=loadSave();
  if(d){ S=d; delete S.pending; }
  else newGame();
  closeTitle(); sfx("mu"); render(); musicOn();
}

function openPrologue(fromStart){
  PRO_FROM=!!fromStart; PRO_I=0; proRender();
}
function proRender(){
  const p=PRO[PRO_I];
  el("modal").innerHTML='<div class="mask"><div class="dlg" style="max-width:600px">'+
    '<div class="prostep">序章 · '+p.t+'</div>'+
    sceneSVG(p.s)+
    '<div class="probody">'+p.x+'</div>'+
    (function(){ var n=pickNote(p.x); return n?'<div class="note"><b>'+n+'</b> —— '+TERMS[n]+'</div>':''; })()+
    '<div class="row"><button type="button" class="btn p" onclick="proNext()">'+
    (PRO_I===PRO.length-1?(PRO_FROM?"开始西行":"知道了"):"继续")+'</button>'+
    '<button type="button" class="btn" onclick="proSkip()">跳过</button></div>'+
    '<div class="hint">'+(PRO_I+1)+' / '+PRO.length+'</div></div></div>';
}
function proNext(){
  sfx("tap");
  if(PRO_I<PRO.length-1){ PRO_I++; proRender(); return; }
  proSkip();
}
function proSkip(){
  closeModal();
  try{ localStorage.setItem("ersky_pro","1"); }catch(e){}
  if(PRO_FROM){ render(); musicOn(); maybeTutorial(); }
}

function coach(i){
  try{
    document.querySelectorAll(".coach").forEach(function(n){ n.classList.remove("coach"); });
  }catch(e){}
  const old=elOrNull("coachTip");
  if(old && old.parentNode){ try{ old.parentNode.removeChild(old); }catch(e){} }
  if(i>=TUT.length){ try{ localStorage.setItem("ersky_tut","1"); }catch(e){} return; }
  const t=TUT[i], tg=el(t.sel);
  let tip;
  try{ tip=document.createElement("div"); }catch(e){ return; }
  tip.id="coachTip"; tip.className="coachtip";
  tip.innerHTML=t.txt+'<div><button type="button" class="coachbtn" onclick="coach('+(i+1)+')">'+
    (i===TUT.length-1?"开始玩":"知道了")+'</button>'+
    '<span class="coachno">'+(i+1)+' / '+TUT.length+'</span></div>';
  try{ document.body.appendChild(tip); }catch(e){ return; }
  if(tg) tg.classList.add("coach");
  try{
    const r=tg.getBoundingClientRect();
    tip.style.left=Math.max(16, Math.min(r.left, window.innerWidth-320))+"px";
    tip.style.top=Math.max(70, Math.min(r.bottom+10, window.innerHeight-160))+"px";
  }catch(e){}
}
function maybeTutorial(){
  let onb=false; try{ onb=localStorage.getItem("ersky_onb")!=="1"; }catch(e){}
  if(onb){ showOnboard(0); return; }
  startCoachTour();
}
function startCoachTour(){
  let done=false; try{ done=localStorage.getItem("ersky_tut")==="1"; }catch(e){}
  if(done) return;
  try{ setTimeout(function(){ coach(0); }, 650); }catch(e){}
}
function showOnboard(i){
  i=Number(i)||0;
  if(!(i>=0) || i>=ONBOARD.length){
    try{ localStorage.setItem("ersky_onb","1"); }catch(e){}
    closeModal(); startCoachTour(); return;
  }
  const p=ONBOARD[i];
  if(!p){ closeModal(); return; }
  el("modal").innerHTML='<div class="mask"><div class="dlg" style="max-width:660px">'+
    '<div class="prostep">新手引导 · '+p.t+'</div>'+
    '<div class="probody">'+p.x+'</div>'+
    '<div class="row"><button type="button" class="btn p" onclick="showOnboard('+(i+1)+')">'+(i===ONBOARD.length-1?"开始西行":"下一步")+'</button>'+
    '<button type="button" class="btn" onclick="skipOnboard()">跳过引导</button></div>'+
    '<div class="hint">'+(i+1)+' / '+ONBOARD.length+'</div></div></div>';
}
function skipOnboard(){
  try{ localStorage.setItem("ersky_onb","1"); }catch(e){}
  closeModal(); startCoachTour();
}

/* ============ 渲染 ============ */
/* el() 是所有 DOM 读写的唯一入口。以前直接返回 getElementById 的结果——
   万一某个 id 不在 DOM 里（比如脚本在容器节点之前执行、或某段 HTML 被删了），
   返回 null 会让 `el("x").innerHTML=…` 抛 TypeError，
   一次就把整个 render() 打断，页面停在半截状态，而且连报错都难定位。
   现在返回一个替身：写操作安全落地，读操作返回空值。 */
function el(id){
  const n=document.getElementById(id);
  if(n) return n;
  return {
    id:id, _ghost:true, innerHTML:"", textContent:"", value:"", className:"",
    style:{}, dataset:{},
    classList:{add(){},remove(){},toggle(){},contains(){return false;}},
    setAttribute(){},getAttribute(){return null;},removeAttribute(){},
    appendChild(){},removeChild(){},remove(){},insertAdjacentHTML(){},
    addEventListener(){},removeEventListener(){},focus(){},click(){},
    querySelector(){return null;},querySelectorAll(){return [];},
    getBoundingClientRect(){return {width:0,height:0,top:0,left:0,right:0,bottom:0};},
    children:[],childNodes:[],parentNode:null,firstChild:null
  };
}
/* el() 的逃生口：返回原始节点，没有就是 null。
   懒创建型代码（toast / saveTip / coachTip）必须用这个，
   因为它们靠「拿到 null」来判断「该创建了」。 */
function elOrNull(id){ return document.getElementById(id); }

function bars(m){
  return '<div class="bars">'+STATS.map(k=>{
    const v=m.s[k], rk=(v>=91);
    return '<div class="bar'+(rk?' risk':'')+'">'+
      '<span class="n">'+STAT_NAME[k]+'</span>'+
      '<span class="t'+(rk?' risk':'')+'">'+
        '<span class="f" style="width:'+v+'%;background:'+(rk?'#C0392B':STAT_COLOR[k])+'"></span>'+
        '<span class="mark"></span>'+
      '</span>'+
      '<span class="v">'+v+'</span>'+
      '<span class="lv'+(rk?' risk':'')+'">'+rank(v)+'</span>'+
    '</div>';
  }).join("")+
  '<div class="lvnote">刻度条上的竖线是 <b>91</b> 的倾覆线 · 越过随时倾覆,到 100 必死。</div>'+
  (m.name==="陆昭"?'<div class="hint" style="margin:2px 0 0;font-size:10px;line-height:1.4">四枢锁死在九 · 他一样也不肯舍弃</div>':'')+

}

function meetIdxOf(name){
  S.met = S.met || [];
  let r=-1; MEET.forEach(function(x,i){ if(x.who===name && S.met.indexOf(x.city)>=0) r=i; });
  return r;
}
function nameTag(m,i){
  /* 名字 = 看来历（文字）；旁边的按钮 = 看立绘（图）。两个入口不打架。 */
  return '<span class="nm" style="cursor:pointer;border-bottom:1px dotted #9E2B1E" '+
         'title="看他的来历" onclick="openStory('+i+')">'+m.name+'</span>'+
         (PIC[m.name]?' <button type="button" class="picbtn" title="看立绘" '+
          'onclick="event.stopPropagation();openPic(\''+m.name+'\')">看立绘</button>':'');
}
/* 看立绘：点按钮弹大图。没画的人不会走到这里。 */
function openPic(name){
  const k=PIC[name], src=PORTRAIT[k];
  if(!src){ modalMsg("这个人还没有立绘。"); return; }
  sfx("tap");
  const sub=(S.crew.filter(x=>x.name===name)[0]||{}).tag || "";
  el("modal").innerHTML='<div class="mask"><div class="dlg" style="max-width:420px">'+
    '<div class="prostep">立绘 · '+name+'</div>'+
    '<div class="picbox"><img src="'+src+'" alt="'+name+'的立绘"></div>'+
    (sub?'<div class="note"><b>'+name+'</b> —— '+sub+'</div>':'')+
    '<div class="row"><button type="button" class="btn p" onclick="closeModal()">合上</button></div></div></div>';
}
function openStory(i){
  const m=S.crew[i]; if(!m) return;
  sfx("tap");

    '<div class="prostep">来历 · '+m.name+'</div>'+
    '<div class="note"><b>'+m.name+'</b> —— '+m.tag+'</div>'+
    '<div class="probody">'+(m.story||"他没说过自己从哪儿来。")+'</div>'+
    '<button type="button" class="btn" onclick="closeModal()">合上</button></div></div>';
}
/* ============ 西行志卡片:意志在哪看 ============
   之前意志只出现在顶部栏一个 10px 灰字徽章里,玩家根本找不到。
   这里给一个常驻查看位置:刻度条 + 下一档门槛 + 八节进度 + 详情弹窗。 */
function willMax(){ return MAIN.length*6; }
function willSteps(){
  const out=[];
  (typeof WILL_EVENTS!=="undefined"?WILL_EVENTS:[]).forEach(function(w){
    out.push({v:w.will, t:"硬骨头支线 · "+String(w.ev.t).split(" · ")[0], kind:"side"});
  });
  out.push({v:20,t:"成就 · 硬骨头",kind:"ach"});
  out.push({v:28,t:"成就 · 九头牛都拉不回",kind:"ach"});
  out.push({v:34,t:"结局 · 一路没低过头",kind:"end"});
  out.sort(function(a,b){ return a.v-b.v; });
  return out;
}
function willUp(){ const lg=S.willLog||{}; return Object.keys(lg).filter(function(k){return lg[k]>=4;}).length; }
function willDown(){ const lg=S.willLog||{}; return Object.keys(lg).filter(function(k){return lg[k]>0&&lg[k]<4;}).length; }
function willDot(){
  const lg=S.willLog||{};
  let h='<div class="w8">';
  for(let i=0;i<MAIN.length;i++){
    const v=lg[i];
    const cls = (v===undefined) ? (i===S.ci?"now":"") : (v>=4?"up":"dw");
    const tip = "第"+(i+1)+"节 · "+MAIN[i].n+(v===undefined?" · 还没走到":(v>=4?" · 顶回去了":" · 照着做了"));
    h+='<i class="'+cls+'" title="'+tip+'"></i>';
  }
  h+='</div>';
  h+='<div class="wrow">顶 <b>'+willUp()+'</b> 节 · 低 <b>'+willDown()+'</b> 节 · 未走 <b>'+(MAIN.length-willUp()-willDown())+'</b> 节</div>';
  return h;
}
function renderWill(){
  const w=S.will||0, mx=willMax(), steps=willSteps();
  let next=null;
  for(let i=0;i<steps.length;i++){ if(steps[i].v>w){ next=steps[i]; break; } }
  let h='<h3>西行志 · 意志 <b style="color:#9E2B1E;font-size:15px">'+w+'</b>'+
        '<span style="font-size:11px;color:#857C6E"> / 上限 '+mx+'</span></h3>';
  h+='<div class="wbar"><span class="wf" style="width:'+(w/mx*100).toFixed(1)+'%"></span>'+
     steps.map(function(x){
       return '<span class="wk'+(w>=x.v?' done':'')+'" style="left:'+(x.v/mx*100).toFixed(2)+'%" title="'+x.v+' · '+x.t+'"></span>';
     }).join("")+'</div>';
  h+='<div class="wscale"><span>0</span><span>'+Math.round(mx/2)+'</span><span>'+mx+'</span></div>';
  h+='<div class="it">'+(next
      ? '下一档 <b>'+next.v+'</b> · 还差 <b>'+(next.v-w)+'</b> —— '+next.t
      : '全部门槛都过了。往西这一路,你一节也没低过头。')+'</div>';
  h+='<div class="it" style="padding:6px 9px">'+willDot()+'</div>';
  h+='<button type="button" class="btn" onclick="openWill()">细看西行志</button>';
  h+='<div class="hint" style="margin-top:8px;font-size:10.5px">意志只从<b>西行志</b>来:每座城事件列表第一条,顶回去加意志,照着做加 0。它不进四枢,不会让你倾覆。</div>';
  el("willCard").innerHTML=h;
}
function openWill(){
  try{ sfx("tap"); }catch(e){}
  const w=S.will||0, mx=willMax(), lg=S.willLog||{}, steps=willSteps();
  let h='<div class="mask"><div class="dlg" style="max-width:660px">'+
    '<div class="prostep">西行志 · 意志 '+w+' / '+mx+'</div><div class="probody">';
  h+='<div class="it">意志只从<b>西行志</b>来。八座城,每城一节,每节问同一件事:<b>这座城的规矩,你低不低头?</b><br>'+
     '顶回去最多 +6,照着做 +0。意志<b>不进四枢</b>,堆多高都不会让你倾覆、不会害死任何人——它只决定你走到源城的时候,是站着还是跪着。</div>';
  h+='<div class="it"><b>八节</b><br>';
  MAIN.forEach(function(m,i){
    const v=lg[i];
    const st = (v===undefined) ? '<span style="color:#857C6E">还没走到</span>'
             : (v>=4 ? '<b style="color:#9E2B1E">顶回去了 · +'+v+'</b>' : '照着做了 · +'+v);
    h+='第'+(i+1)+'节 · '+m.n+' —— '+st+'<br>';
  });
  h+='</div>';
  h+='<div class="it"><b>门槛</b><br>';
  steps.forEach(function(x){
    const ok=(w>=x.v);
    h+='<span style="color:'+(ok?"#1D9E75":"#857C6E")+'">'+(ok?"已过":"未到")+'</span> · <b>'+x.v+'</b> —— '+x.t+
       (ok?'':' <span style="font-size:11px;color:#857C6E">(还差 '+(x.v-w)+')</span>')+'<br>';
  });
  h+='</div>';
  h+='<div class="it"><b>现在的判词</b><br>'+willVerdict(w, willUp())+'</div>';
  h+='<div class="it" style="font-size:11px;color:#857C6E">怎么涨:进每座城,点<b>事件列表第一条</b>(带「主线」标的那一节),挑最硬的选项。硬选项通常要付代价——涨四枢涨得狠,或者让队里某个人去挨一下。</div>';
  h+='</div><div class="row"><button type="button" class="btn" onclick="closeModal()">合上</button></div></div></div>';
  el("modal").innerHTML=h;
}
function renderTeam(){
  let h='<h3>队伍 '+alive().length+'/'+MAXCREW+' · 战力 '+teamPower()+'</h3>';
  S.crew.forEach((m,i)=>{
    if(m.dead){
      h+='<div class="mb dead"><div class="hd2">'+seal(m)+nameTag(m,i)+
         '<span class="rk">已'+m.way+'</span></div>'+
         '<div class="pv"><span>'+fallText(m)+'</span></div></div>';
    }else{
      const eq=S.relics.filter(r=>r.equipped===m.name);
      const mx=Math.max(...STATS.map(k=>m.s[k]));
      h+='<div class="mb"><div class="hd2">'+seal(m)+nameTag(m,i)+
         '<span class="rk">'+rank(mx)+' · 力'+power(m)+'</span></div>'+
         bars(m)+
         '<div class="pv"><span>主枢 '+STAT_NAME[topStat(m)]+'</span><span>'+m.s[topStat(m)]+'</span></div>'+
         (eq.length?'<div class="eq">佩戴 '+eq.map(r=>r.name+' 染'+r.infect).join("、")+'</div>':'')+
         '</div>';
    }
  });
  { const hot=alive().filter(function(m){ return m.name!=="陆昭" && Math.max.apply(null,STATS.map(function(k){return m.s[k];}))>=75; });
    if(hot.length) h+='<div class="it" style="font-size:11px;color:#9E2B1E;background:#FCEBEB">'+
      '<b>有人快到顶了</b>:'+hot.map(function(m){return m.name;}).join("、")+
      ' —— 再涨就要进 91 的倾覆区。<b>点队伍面板上的「搭肩」</b>,把最高那项分 30 点出去,他降下去,大家各担一点。</div>'; }
  h+='<div class="hint">刻度越高越强。91 起随时倾覆,100 必死。倾覆者可铸成遗骸器。<br>点名字看他的来历。队伍满 '+MAXCREW+' 人,要有人死了才有新位置。<br>刻度条上的<b>竖线是 91</b>,越过随时倾覆。</div>';
  el("teamCard").innerHTML=h;
}

  let h='<h3>行囊</h3>';
  /* 纸类收进折叠区:数量一多就吵,点开才看。
     所有拾得的东西都算「纸」——以前没图鉴条目的会掉进 others,
     变成一行没有下文的死字,点它什么也不发生。
     玩家反馈「物资增减逻辑不明」有一半是从这来的:
     明明捡了东西,却像没捡。 */
  const papers=[];
  S.items.forEach((it,i)=>{ papers.push([it,i]); });
  if(papers.length){
    h+='<details class="papers"'+(papers.length>6?'':' open')+'><summary>'+
       '<b>拾得纸 '+papers.length+' 张</b><span class="pm">点开展读</span></summary>';
    papers.forEach(function(p){
      const has=DOCS[p[0]];
      h+='<div class="it sub" style="cursor:pointer" onclick="openDoc('+p[1]+')">'+
         '<b style="color:#9E2B1E">'+p[0]+'</b>'+
         '<span style="font-size:11px;color:#857C6E"> · '+(has?"展读":"字迹不清")+'</span></div>';
    });

function pickNote(text){
  S.seen = S.seen || {};
  const keys=Object.keys(TERMS);
  for(let i=0;i<keys.length;i++){
    if(text.indexOf(keys[i])>=0 && !S.seen[keys[i]]){
      S.seen[keys[i]]=true;
      return keys[i];
    }
  }
  return null;
}

      ? '<span class="mq">' + mainTitle() + '</span><span class="mw">意志 <b>' + (S.will||0) + '</b> / ' + (MAIN.length*6) + '</span>'
      : ""; }

      '<div class="lawline">本城律令 · '+c.law+'</div>'+
      (cnote?'<div class="note"><b>'+cnote+'</b> —— '+TERMS[cnote]+'</div>':'')+
      '<div class="sep"></div>'+
      '<div class="verse">'+c.verse+'</div>'+
      '<div class="say">'+c.say+'</div>'+
      (MAIN[S.ci] ? '<div class="mainq"><b>'+mainTitle()+'</b> —— '+MAIN[S.ci].q+'</div>'+
        '<div class="mprog">西行志进度 <div class="bar">'+MAIN.map(function(m,i){return '<i class="'+(i<S.ci?'on':(i===S.ci?'cur':''))+'"></i>';}).join("")+'</div> 第 '+(S.ci+1)+' / '+MAIN.length+' 节</div>' : '')+
      mainEchoHTML()+
      flagEchoHTML()+
      baizhengLine()+
      '<div class="row"><button type="button" class="btn p" onclick="startCity()">入城</button>'+
      (c.doc&&DOCS[c.doc]?'<button type="button" class="btn" onclick="openCityDoc()">这座城怎么变成这样的</button>':'')+'</div>'+
      '<div class="kbd">按 <b>空格</b> 入城</div></div>';
    save();
    return;
  }

  const evs = curEvents();
  const ev = evs[S.ei];
  let h = '<div class="evno">事件 '+(S.ei+1)+' / '+evs.length+'</div>';
  h += '<div class="evt">'+(ev.main?'<span class="mtag">主线</span>':'')+ev.t+'</div>';
  h += '<div class="body" id="evbody"></div>';
  const nt = pickNote(fixNames(ev.x)+" "+(S.last||"")+" "+ev.o.map(function(o){return o.lb;}).join(""));
  if(nt) h += '<div class="note"><b>'+nt+'</b> —— '+TERMS[nt]+'</div>';
  if(S.last) h += '<div class="res fade">'+S.last+'</div>';
  if(S.lastConseq) h += '<div class="cost fade">'+S.lastConseq+'</div>';
  if(!S.awaiting){
    h += '<div class="sep"></div>';
    const ob=obsName();
    let hid=0, vi=0;
    /* 有些选项在当前队伍下根本不成立——「陶矜用欠条保他」，
       可陶矜已经不在队里；「让最高敢的人上」，可队里只剩陆昭。
       照样显示的话，玩家会点进去发现什么都没发生，
       或者更糟：看见一个自己从没遇到过的人在替自己做决定。
       这种选项不渲染，也不计入编号——编号必须连续，
       否则玩家按 3 结果按到了别的选项上，那就不是玄学，是 bug 了。 */
    const shown=[];
    ev.o.forEach(function(o){ if(optionAlive(o)) shown.push(o); });
    /* 死路兜底：一个选项都不剩时，玩家会对着一屏灰字——
       这是最让人弃游的场景（「四个选项全空白」就是这个）。
       所以这里现编一条：一个人扛着往前走。
       它不给属性收益（陆昭的九锁死，本来也涨不了），
       只给意志——那才是他一个人能挣到的东西。 */
    let soloFallback=false;
    if(!shown.length && !viableOptions(ev).length){
      soloFallback=true;
      h += '<button type="button" class="opt" onclick="soloPush()"><span class="on">1</span>'+
           '<span class="lb">一个人扛过去</span><span class="sub"><span class="tag tb">没别的路了</span></span></button>';
      h += '<div class="note"><b>这条路要有人一起走</b> —— 你现在就一个人。别的选项都需要队伍里的人:'+
           '他们没入队，或者已经倾覆了。先往前走,人会在后面的城里遇到。</div>';
    }
    shown.forEach(function(o){
      const i=ev.o.indexOf(o);
      if(o.req){
        const isWill=(o.req.will!==undefined);
        const statWord=STAT_NAME[o.req.stat]||o.req.stat;
        const met=isWill ? ((S.will||0)>=o.req.will)
                         : alive().some(m=>m.s[o.req.stat]>=o.req.min);
        if(!met){
          /* req.hard = 硬门槛:永远可见,但明确拒绝,并告诉你差多少。
             这是"值不够就走不通"的核心反馈——玩家必须看见自己不够。*/
          if(o.req.hard || isWill){
            const gate = isWill
              ? ('推不开 · 意志只有 '+(S.will||0)+'，要 '+o.req.will+' ——这是硬顶过来的人才走得到的路')
              : ('推不开 · 队里最高的'+statWord+' '+alive().reduce((a,m)=>Math.max(a, m.s[o.req.stat]||0), 0)+'，要 '+o.req.min);
            h += '<button type="button" class="opt opt-locked" disabled><span class="on">✕</span><span class="lb">'+fixNames(o.lb)+'</span>'+
                 '<span class="sub"><span class="hb gate">'+hbBold(gate)+'</span></span></button>';
            return;
          }
          /* 否则走原逻辑:有观测的人,才看得见这里有条走不通的路;没有观测,这条路根本不存在 */
          if(!ob){ hid++; return; }
          h += '<button type="button" class="opt" disabled><span class="on">–</span><span class="lb">'+fixNames(o.lb)+'</span>'+
               '<span class="sub"><span class="hb">'+hbBold(ob+'看得见这条:还没人够得着 · 要有人 '+statWord+' ≥ '+o.req.min)+'</span></span></button>';
          return;
        }
      }
      vi++;
      /* 做法(lb) + 定性标签(硬顶/极险)。
         后果(hb)在这里是**故意不显示**的——先剧透代价，玩家就会照着代价挑选项，
         那不叫选择，那叫抄答案。代价要等选完、不能反悔了，再摆到结算里标红。 */
      const tagTxt=(o.tag||"");
      h += '<button type="button" class="opt'+(o.hb?' hascost':'')+'" onclick="choose('+i+')">'+
           '<span class="on">'+vi+'</span><span class="lb">'+fixNames(o.lb)+'</span>'+
           (tagTxt?'<span class="sub"><span class="tag '+(o.cls||"tb")+'">'+tagTxt+'</span></span>':"")+
           '</button>';
    });
    if(hid) h += '<div class="note"><b>看不清</b> —— 这一步后面还有路,现在看不见。队里得有人『<b>谨慎</b>』过六十,它们才显形。</div>';
    if(vi) h += '<div class="kbd">按 <b>1–'+vi+'</b> 选择</div>';
  }else{
    h += '<div class="row"><button type="button" class="btn p" onclick="next()">'+(S.pending?"去处理他的身体":"继续")+'</button></div>';
    h += '<div class="kbd">按 <b>空格</b> 继续</div>';
  }
  st.innerHTML = '<div class="fade">'+h+'</div>';
  typewrite(el("evbody"), fixNames(ev.x));
  save(); checkAch();
}

const PWR_KEY="erchongtian_pwr";
function getBoard(){ try{ var d=JSON.parse(localStorage.getItem(PWR_KEY)); if(Array.isArray(d)) return d; }catch(e){} return []; }
function saveBoard(b){ try{ localStorage.setItem(PWR_KEY, JSON.stringify(b)); }catch(e){} }
function hiscore(){ try{ var b=getBoard(); return b.length?b[0].score:0; }catch(e){ return 0; } }
function recordRun(key){
  var al=alive();
  var total=teamPower();
  var best=al.reduce(function(a,m){return Math.max(a,power(m));},0);
  var rec={date:Date.now(), score:total, best:best, ending:key||"", alive:al.length,
           crew:al.map(function(m){return {n:m.name,p:power(m),t:topStat(m)};})};
  var b=getBoard(); b.push(rec); b.sort(function(x,y){return y.score-x.score;});
  var top=b.slice(0,20); saveBoard(top);
  var rk=top.indexOf(rec)+1; var isTop=top.length>0 && top[0]===rec;
  return {rec:rec, rank:rk, isTop:isTop, board:top, total:total};
}
