/* 结局关键后果——高亮成醒目的「后果」框 */
function endingConsequence(){
  const f=S.flags||{}, L=S.ledger||[], al=alive(), lg=S.willLog||{};
  const k=judgeEnding();
  const lines=[];
  const stopped=(k==="stop"), walked=Math.min(S.ci+(stopped?0:1), CITIES.length);
  if(stopped){
    lines.push("你走到了<b>第 "+walked+" 座城</b>，然后自己按了停止。剩下 "+(CITIES.length-walked)+" 座没去——<b>天还在扣着所有人，包括不看它的你</b>。");
  }
  else if(f["没有替它答"]) lines.push("它问你「八亿人答不答」，你<b>把问题原样送了回去</b>。手上有三句现成的话，你一句都没说——<b>那不是你的答案</b>。");
  else if(f["问了天疼不疼"]) lines.push("你问了天疼不疼，它答了<b>疼</b>，又说「我以为我在替他们」。<b>它和白证是同一个念头</b>——这句话是你说给它自己听的。");
  else if(f["听见了回音"]) lines.push("你听见了<b>八亿个不一样的答案</b>，然后松了手。<b>有些东西知道了就回不去</b>——你从此听不见它了。");
  else if(f["接手大阵"]||f["让他做完"]) lines.push("你接手了那套大阵——<b>天，被你亲手停了</b>。");
  else if(k==="unbowed") lines.push("八座城，你<b>一座也没低头</b>。天还在，但你没跪。");
  else if(k==="none") lines.push("名册上记着你，<b>人间没有你</b>。");
  else if(k==="apart") lines.push("你活着到了源城，可<b>身边已经没有人了</b>。");
  else if(k==="zhang") lines.push("你按自己的章法走完，可<b>身边的人一个接一个没了</b>。");
  else if(k==="observe") lines.push("你只是看着。<b>天塌的时候，你站在能看清的位置</b>。");
  else if(k==="lift") lines.push("你替白证，把那些名字<b>一个一个念了出来</b>。");
  else if(k==="rot") lines.push("你记住了太多人的名字，<b>他们却没活下来</b>。");
  else if(k==="drink") lines.push("你什么都没管，<b>先喝了一杯</b>。");
  else if(k==="yu") lines.push("你搭上了一只肩膀，<b>有人因此没倒下</b>。");
  else if(k==="flat") lines.push("你走到了头，<b>可什么也没改变</b>。");
  const up=Object.keys(lg).filter(function(x){return lg[x]>=4;}).length;
  const dw=Object.keys(lg).filter(function(x){return lg[x]>0&&lg[x]<4;}).length;
  if(up||dw) lines.push("西行志八节，你<b>顶回去 "+up+" 节、低头 "+dw+" 节</b>。");
  if(L.length) lines.push("名册上多了 <b>"+L.length+" 个名字</b>："+L.map(function(x){return x.name;}).join("、")+"。");
  /* 账本厚度：一本够重的账不需要结论，它自己站得住 */
  const th=ledgerThickness();
  if(th.t>=10) lines.push("账本厚度 <b>"+th.t+"</b>（死者 "+th.n+" · 你主动记下的 "+th.marks+" 件）。<b>它厚到自己会翻页了</b>——有人开始照着你的格式，自己记。");
  else if(th.t>=5) lines.push("账本厚度 <b>"+th.t+"</b>。<b>这本账开始有分量了</b>，但还压不住人。");
  else if(th.t>0) lines.push("账本厚度 <b>"+th.t+"</b>。薄，但它是真的。");
  if(stopped){
    lines.push("跟着你走到这里的，是 <b>"+(al.length?al.map(function(m){return m.name;}).join("、"):"没有人")+"</b>。");
  }
  else if(al.length===1) lines.push("走到最后的，<b>只有"+al[0].name+"</b>。");
  else if(al.length>1) lines.push("走到源城的，是 <b>"+al.map(function(m){return m.name;}).join("、")+"</b>。");
  /* 第一条是这个结局的定性后果,渲染时加大加重——其余条目退成次级 */
  if(lines.length) lines[0]="<span class=\"lead\">"+lines[0]+"</span>";
  return lines;
}

/* 这一轮结束时的「你这一路」——写成一篇短小说,不是清单。
   通关走到源城、中途死在城里,都会调它。 */
function journeyStory(){
  const f=S.flags||{}, lg=S.willLog||{}, C=CITIES, M=MAIN;
  const k=judgeEnding(), E=ENDINGS[k];
  const L=S.ledger||[], al=alive().map(function(m){return m.name;});
  /* 走过几座城:通关是八座全走过(ci 已到 8);半路停下则 ci+1 座 */
  const walked=(S.ci>=CITIES.length)?CITIES.length:Math.min(S.ci+1, CITIES.length);

  /* 每座城按「顶回去了 / 认了 / 没掺和」三种走法各一句,写具体动作,不写抽象总结 */
  const J=[
    {res:"算缄城要你把往后的事写进一张表。你把它翻过来,在背面写了两个字:不报。登记官说背面我也看。你说我知道。",
     sub:"算缄城那张表摊在每个人面前。你坐下,一笔一划填了——三天里发生什么写什么,没发生的写「无」。这是全城最省事的一种守法。",
     abs:"算缄城要每个人把往后写进表。你不写,他们也就没记住你。后来这座城覆写的时候,档案里没有你这一行。"},
    {res:"均城要把所有人削成一样高。齐物司的仪器转了一圈,报出你的数,你让他们削。削完那天队伍走得特别齐,步子一样,喘气的声音都一样——齐得让人心慌。",
     sub:"均城给你和所有人一样的高度。你接受了。削完那几天你睡得很沉,沉到自己都觉得可疑。有人在睡梦里替你说了句「谢了」,你自己没听见。",
     abs:"均城削人的那天你在场外。仪器转的时候你数了数,一共十四个人,前后不到两刻钟。"},
    {res:"秤城给你称了个价,签了字按了手印。三十年的胆子在收据上写完了,当场到账。收据很凉,凉得不像纸,你把它折好收进内皮衣口袋。",
     sub:"秤城也给你称了价。你认了那个数。认的时候你在心里算了一遍——三十年,说长不长,说短不短,反正那时候你大概还在路上。",
     abs:"秤城称量你的时候,你退到了队尾。执秤的报了个数,没人回头,你也没。"},
    {res:"颂城有个人病着,并且要求继续病着。药在你手里。你还是给他灌了。他醒过来第一句是「你们凭什么」,第二句隔了很久,是「……谢谢」。这两句后来在颂城传了很多年。",
     sub:"颂城要你救一个明说不要救的人。你照他们写的救了,灌完药,等人退烧。救是救了,人却没回来——城破的时候他被抬走了,一直抬到城外三十里。",
     abs:"颂城那场救人,你站在墙边没动。药在别人手里,递出去的不是你。后来你想起过这件事,想起的次数比愿意承认的多。"},
    {res:"静默城要你交出名字。你写了张条子塞进队伍最后一个人的口袋——你自己没交。那张条子后来在静默城传开,因为它比这座城所有的规矩都老。",
     sub:"静默城收名字。你报了,报得很轻,像交出一件不重要的行李。后来这座城不许任何人说自己的名字,而你是少数几个还记得自己名字的人之一。",
     abs:"静默城收名字的队伍里没有你。你在城外站了一夜,想自己叫什么,想了很久,发现还想得起来。"},
    {res:"铁城要你退一步,把所有刻度平摊给全队。你把手搭上去,替那个人分了一半。他活下来了,你也轻了一半——轻得后来有点站不稳。",
     sub:"铁城让你退,你退了。摊完之后那几天你睡得很沉,沉到自己都觉得可疑。有人在睡梦里替你说了句「谢了」,你自己没听见。",
     abs:"铁城那道退令你没接。别人接了,一个一个退了回去。城破的时候那道上过令的墙还在,令还在。"},
    {res:"明夷城没有规矩,你可以在路边坐下。有人说再走就来不及了,有人说来得及。你们坐了很久,最后站起来往西走。天亮时身后空了一地东西,没人回头捡。",
     sub:"明夷城问你留不留。你留了一夜,又走了。走之前有人赖着不肯起身,把他拽起来的时候他说:我就想再躺一会儿。这句话后来在很多条路上都成立过。",
     abs:"明夷城留人的路口你没停。城里没人管,也没人拦,连挽留都没有——一个地方对你再好,也不是你的地方。"},
    {res:"源城那套大阵按在所有人头上。你走上去,把手按在阵眼上,往下压。天停了,压下来的地方塌了一圈,像一口井,谁也没掉进去。",
     sub:"源城那套大阵前,你没伸手。你站了很久,后来是白证上去的。他做完最后一笔,写的是自己的名字,写完对你说了声谢谢——他说,做完的人比被叫停的人少一份悬着。",
     abs:"源城的大阵,你隔着人群看完了整场。看完你转身走了,没跟任何人解释。你后来也没解释过。"}
  ];

  let t="你是在"+C[0].name+"起的程。那时候车上只有你一个人,一本账、一支红蓝双色笔、半只耳蜗——\n\n";
  t+="陆昭说:往西走,去把那套扣在每个人头上的天,停了。\n\n";
  t+="你没问他凭什么要去。你只是把笔帽咬在嘴里,开始记。\n\n";

  /* 八城一段一段走:走过的才写,没赶上的不编。每两段空一行,读起来像走过,不是像列表 */
  for(let i=0;i<walked;i++){
    const w=lg[i], j=J[i];
    t+=(w===undefined? j.abs : (w>=4? j.res : j.sub));
    /* 城与城之间接一句「往西」,让八段连成一条路 */
    if(i<walked-1) t+="\n\n";
  }
  t+="\n\n";

  /* 中途死的/中途收手的,把断在那里这件事讲清楚 */
  if(S.ci<CITIES.length-1 && !S.done){
    t+="你没能走到"+C[S.ci+1].name+"。\n\n";
  }
  if(f["中途收手"]){
    t+="剩下那几座城,你没去。天还在那儿扣着,扣在所有人头上——也扣在你头上。你只是不再看它了。\n\n";
  }

  /* 路上那些具体的、值得单拎出来的事 */
  const beats=[];
  if(f["白证一"]) beats.push("白证比你先到秤城。往后每过一座城,都能听到他的近况——他不求救,也不托人带话,只是每隔一段就让人传一句:他还在,走到哪儿了,做什么。");
  if(f["接手大阵"]) beats.push("源城那套大阵,最后是你的手按下去的。按下去之前你没有犹豫;按下去之后,你也没有立刻走开。");
  if(f["让他做完"]) beats.push("你让白证做完了。做完的人比被叫停的人少一份悬着——这是他说的。他做完的最后一笔,写的是自己的名字。");
  if(f["郑刻接管"]) beats.push("郑刻接过了队伍。你只说了一个「认」字,剩下的他替你安排完了。");
  if(f["陆昭被处决"]) beats.push("陆昭站上了那台。他把名字和编号一个字一个字报清楚,像在报账。后来没人杀成他——排期排到了下周,下周城没了。");
  if(f["救小满"]) beats.push("城破那一刻你折了回去。逃命的人往回走,回头的人都这么给自己添堵——但小满确实被你带出来了。");
  if(f["拒绝陆萤"]) beats.push("陆萤要你应她。你放她走了。你后来想过很多次,如果那一次应了,结局会不会不同——想了很多次,一次也没算出来。");
  if(f["陆昭答应"]) beats.push("陆萤要你应她。你应了一声。你答应的是「记着」,不是「救得回」——静默城的人说,答应了就好,答应了今晚能睡着。");
  if(f["烧账"]) beats.push("最后一笔账,你一把火烧了。烧的时候纸响了一下,像谁清了清嗓子。");
  if(ledgerGrade()==="heavy") beats.push("账本厚到了一种程度:它开始自己翻页了。有人照着你写的格式,在你没看见的时候,自己记了一笔。他记的是:某人今天说了一句不像他会说的话。他记完来问你:这样算不算。你说:算。——你终于明白白证为什么要写四千年。不是因为他算得清,是因为他停不下来。而你和他是同一个人。你只是比他多留了几页空白。");
  if(f["继续记"]) beats.push("你翻回前一页,在账本上又记了一笔。账本已经写满了,你还是记了。");
  if(f["无价"]) beats.push("秤城给你记的是「无价」。这两个字在那座城是骂人话——从此没人敢给你开价,也没人肯跟你做生意。");
  if(beats.length) t+=beats.join("\n\n")+"\n\n";

  /* 结尾:谁到了,谁没到 */
  if(f["中途收手"]){
    t+="这一趟走到第 "+walked+" 座城结束。跟着你到这里的,是"+(al.length?al.join("、"):"没有人")+"。\n\n";
  }
  else if(al.length){
    t+="八座城走完。活着走到最西边的,是"+al.join("、")+"。\n\n";
  }else{
    t+="最后一个也在半路倒下了。账本摊在膝盖上,没有人翻下一页。\n\n";
  }
  if(L.length){
    const th=ledgerThickness();
    t+="账本上多了"+L.length+"个名字:"+L.map(function(x){return x.name;}).join("、")+"。\n\n";
    t+="你替他们记着。记着这件事不会让谁活过来,但至少有人没被算成「无名」。\n\n";
    /* 厚度不同,这句话的重量也不同——这是机制,不是修辞 */
    if(th.t>=10){
      t+="后来这本账厚到了一个新的程度:\n\n";
      t+="有人在你不在的时候,照着前面的格式,自己记了一笔。他记完问你:这样算不算。\n\n";
      t+="你看了很久,说:算。\n\n";
      t+="——你本来只想记住。可你记的太多了,多到它开始自己拿主意。\n\n";
      t+="某天你翻回第一页,发现自己早就不记得当初为什么开始记了。\n\n";
      t+="第一页上第一个名字,你不认识。\n\n";
    }else if(th.t>=5){
      t+="这本账开始有分量了。翻它的时候要两只手。\n\n";
      t+="陆昭有一次说:这本账再厚一点,就能自己站住了。\n\n";
      t+="你说:那不是好事。\n\n";
      t+="他说:我知道。所以我先跟你说。\n\n";
    }
  }
  t+="——「"+E.t+"」。"+E.sub;
  return t;
}
function copyStory(){
  const t=journeyStory();
  const fallback=function(){ saveTip("请长按或 Ctrl+C 手动复制"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ saveTip("已复制：你这一路"); },fallback);
  } else fallback();
}

/* 后果框 HTML —— 第一条是「定性后果」，单独加重 */
function conseqHTML(list, mt){
  if(!list||!list.length) return "";
  return '<div class="conseq"'+(mt?' style="margin-top:'+mt+'"':'')+'><span class="ch">这趟西行的</span>'+
    list.map(function(x,i){
      return '<p'+(i===0?' class="leadline"':'')+'>'+x+'</p>';
    }).join("")+'</div>';
}
function showStoryModal(){
  const t=journeyStory().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const consHtml=conseqHTML(endingConsequence(), 16);
  const stopped=(judgeEnding()==="stop");
  const walked=stopped?Math.min(S.ci,CITIES.length-1)+1:CITIES.length;
  const sub=stopped
    ? ("走到第 "+walked+" 座就停了 · 这是你走过的这一段")
    : ("八座城走完 · 这是你走过的这一段");
  el("modal").innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="dlg" style="max-width:620px">'+
    '<h2>你这一路</h2>'+
    '<div class="sub">'+sub+'</div>'+
    '<div class="storytxt" style="margin-top:8px">'+t+'</div>'+
    consHtml+
    '<div class="row"><button type="button" class="btn p" onclick="closeModal()">回到结局</button>'+
    '<button type="button" class="btn" onclick="copyStory()">复制这个故事</button></div></div></div>';
}

/* ============ 流程 ============ */
function startCity(){
  sfx("mu");
  S.met=S.met||[]; S.recruited=S.recruited||[];
  gateNext();
}
/* 进城前的顺序:先讲旧事(若有) → 路上招人(若有空位) → 入城 */
function gateNext(){
  S.met=S.met||[]; S.recruited=S.recruited||[];
  let mi=-1; MEET.forEach(function(m,i){ if(m.city===S.ci && S.met.indexOf(m.city)<0) mi=i; });
  if(mi>=0){ openMeet(mi, true); return; }
  buildRoad();
  if(S.road.length){ ROAD_I=0; roadRender(); return; }
  if(alive().length>=MAXCREW && S.ci<CITIES.length-1){ showFull(); return; }
  enterCity();
}

/* ============ 招募 ============ */
let ROAD_I=0;
function buildRoad(){
  S.road=[];
  const room = MAXCREW - alive().length;
  if(room<=0) return;
  ROSTER.forEach(function(r,i){
    if(r.city!==S.ci) return;
    if(S.recruited.indexOf(r.name)>=0) return;
    if(byName(r.name)) return;
    S.road.push(i);
  });
  S.road = S.road.slice(0, room);
}
function roadRender(){
  const r=ROSTER[S.road[ROAD_I]];
  const ob=obsName();
  let rh="";
  try{ if(localStorage.getItem("tut_road")!=="1"){
    rh='<div class="note">路上遇人:说得对路他可能跟你走,说错或扭头就走,往后不会再遇。队伍满 4 人就带不上了。'+
       (ob?('把握是'+ob+'估的——队里『算』过六十的人才有这本事。'):'几成把握,现在还估不出来。这活儿要队里有人『算』过六十——路上多留意算得准的人。')+'</div>';
    localStorage.setItem("tut_road","1"); } }catch(e){}
  /* 招募画面把要招的人立绘摆出来——先看人，再决定说不说话。 */
  const rp=r.pic&&PORTRAIT[r.pic] ? '<img class="roadpic" src="'+PORTRAIT[r.pic]+'" alt="'+r.name+'">' : '';
  let h='<div class="mask"><div class="dlg" style="max-width:600px">'+
    '<div class="prostep">路上 · 往 '+CITIES[S.ci].name+' 去</div>'+
    rh+
    sceneSVG(CITIES[S.ci].name)+
    (rp?'<div class="roaddl">'+rp+
       '<div class="roadtx"><b>'+r.name+'</b><span>'+r.tag+'</span>'+
       '<div class="roodmeet">'+r.meet+'</div></div></div>'
      :'<div class="probody">'+r.meet+'</div>')+
    '<div class="sep"></div>';
  r.ask.forEach(function(a,i){
    h+='<button type="button" class="opt" onclick="roadAsk('+i+')"><span class="on">'+(i+1)+'</span>'+
       '<span class="lb">'+a.lb+'</span><span class="sub"><span class="hb">'+(ob?hbBold(ob+'估 · 把握 '+a.p+'%'):'看不出把握')+'</span></span></button>'
  });
  h+='<button type="button" class="opt" onclick="roadPass()"><span class="on">0</span>'+
    '<span class="lb">不问,走过去</span><span class="sub"><span class="hb">错过这个人</span></span></button>';
  h+='<div class="hint">队伍 '+alive().length+' / '+MAXCREW+' 人</div></div></div>';
  el("modal").innerHTML=h;
}
function roadAsk(i){
  sfx("tap");
  const r=ROSTER[S.road[ROAD_I]], a=r.ask[i];
  const ok = (alive().length<MAXCREW) && (Math.random()*100 < a.p);
  let h='<div class="mask"><div class="dlg" style="max-width:600px">'+

6:[{t:"入城事务所 · 优先搜救登记",
 x:"明夷城门口支了张桌子。桌上摆着「优先搜救登记」的牌子。\n\n办事员说:进去的人,大部分出不来。但总有几个被找到的。登记了,找到的时候先通知你家人。\n\n他说:不登记也行。不登记,找到了也是按编号排。\n\n旁边一人正在填表。他在「若找不到,骨灰盒颜色」那栏犹豫。",
 o:[
  {lb:"替全队把名字都登记上", hb:"编号越小越靠前", cls:"tg",
   e:[{w:"陆昭",st:"义",d:12},{item:"优先搜救编号"}],
   r:"陆昭把四个人的名字都填了。编号是今天发的最后几个。\n\n办事员说:放心,编号只决定通知顺序。能不能被找到,另算。\n\n他把回执收好。回执背面印着一行小字:本编号不代表任何承诺,仅用于统计。"},

   r:"公示牌写着:本月入城 1374 人,找到 11 人,其中能说话的 3 人。\n\n陆昭算了算:千分之八。\n\n他把这个数记进本子,想了想,又在旁边写:但我们都觉得会是我们。\n\n这句他没划掉。"},
  {lb:"陪那人坐一会儿", hb:"他也不是来问要不要进的", cls:"tv",

   r:"那人听了,把笔放下。\n\n然后他又拿起来,把「骨灰盒颜色」填了:和他妻子的一样。\n\n他说:我不是来问要不要进的。我是来问,万一回不来,家里那边怎么写。\n\n你们没再劝。有些问题,答案不在劝不劝。"},

  {t:"白证的最后一夜 · 他坐在阵前面",
 x:"明夷风大,有人在风里搭了个棚。棚里坐着白证,面前摊着他那张写了二十七年的纸。\n\n纸已经写满了,正面写满,背面也写满。他正在往第二本上写。\n\n他写得很慢,比谁都慢。\n\n崔十七想过去问一句,被陆昭拦住了。陆昭说:别打扰他。\n\n后来他才解释:他不是在数。他是在一个一个写。\n\n写一个要一分多钟。八千零四十二个,写到现在,用了二十七年。",
 o:[
  {lb:"过去问他:你打算写到什么时候", hb:"他会说一个让你说不出话的答案", cls:"tg",
   e:[{w:"all",st:"念",d:16},{flag:"白证的打算"}],
   r:"你们还是过去了。\n\n你问他:你打算写到什么时候?\n\n他没抬头,说:写完。\n\n你说:写完要多久?\n\n他算了一下。那个算式你看得见——他算得很快,这一项他算过很多遍。\n\n他说:照这个速度,还需要四千三百年。\n\n你说:四千年?\n\n他说:我一天写两千多个。第二本已经写到三千七百个,剩下八千个,四千年。\n\n他抬头看你,说:你嫌慢。\n\n你说:我嫌太慢。\n\n他说:我知道。四千年太久,八万人等不到那时候。\n\n他把笔放下,第一次有点生气。他说:那你说该怎么办?\n\n你说:你为什么要写?\n\n他愣住了。\n\n他说:因为写名字的时候,他们在我是谁。\n\n这是他今天第二次说这句话。他知道你没听懂,又说了一遍,更慢:\n\n——因为我一算完,他们就是数字了。写名字的时候,他们还是人。\n\n他说:我算了一辈子。我算得全对。\n\n他说:可我算完就没法再看见他们。\n\n你站在那儿,发现你接不上话。\n\n因为他做错了一件事,可他做的这一件事,是你们所有人四千年也做不完的。\n\n——你终于明白他为什么赢了:他一个人,把那件所有人都做不完的事,认领了。\n\n代价是,他也没给自己留一个位置。"},
  {lb:"坐下,陪他写", hb:"意志 ≥16 · 全队 念 +20 · 你什么也没帮上", tag:"硬顶", cls:"tg",
   req:{will:16},
   e:[{w:"all",st:"念",d:20},{flag:"陪白证写"}],
   r:"你们坐下来了。四个人,加上白证,五个人在风里各自写。\n\n他写名字。你们也写。写的是你们自己见过的、记不住的那些人。\n\n写了一个时辰,谁也没说话。\n\n他先停下来,说:你们写得不对。\n\n你问哪儿不对。\n\n他说:你们写的是印象。「门房,」「砍柴的,」这些是印象,不是编号,也不是名字。\n\n他拿起你们的本子,把其中一个名字圈出来,说:这个,我要的是这个。\n\n他说:有名字才有编号。有编号才找得到人。\n\n他讲了很久。讲的是他的方法:先有名字,再有编号,再有一张表,表能排序,排序能统计,统计能预测。\n\n——他说得对。全对。\n\n讲完他才反应过来,他在教一个八岁的算术给几个刚认识的人。\n\n他停住了。\n\n崔十七说:那我们的名字呢?\n\n他说:你们的在这儿。\n\n他从怀里摸出一张纸,上面有你们的名字,注着日期,是他认识你们那天。\n\n——他早就在记了。\n\n那晚上风很大。陆昭回去以后在自己的账本最后一页写了一行:某夜,和白证一起写名字。他没问我名字,我也没给他。他给的是编号,我给的是记。\n\n两种都对。两种都不够。"},
  {lb:"劝他:等你想清楚了再按", hb:"他会同意,但你会后悔", cls:"tb",
   e:[{w:"all",st:"义",d:8},{flag:"劝过白证"}],
   r:"你说:别按。等你想清楚了再按。\n\n他说:我想了二十七年。\n\n你说:你想清楚的是「怎么按」,不是「该不该按」。\n\n他很久没说话。\n\n然后他说:你说得对。\n\n你没想到他认得这么快。\n\n他说:我不按,八亿人要等四千年。四千年里他们会死,会疯,会互相踩。我算过,四千年里会死掉十一个亿。\n\n他说:我知道按下去不一定对。我知道可能错。\n\n他说:可是我知道我等的每一天,都在死人。\n\n他说完就去收拾那张纸。\n\n临走他回头补了一句:你们劝我的时候,你们也慢。\n\n这句话你说不出怎么回。\n\n因为他说得对。\n\n——你后来想了很久才想明白:那天他不是不肯听。他是把你们的方法,和八亿人的命,放在同一个秤上称了一遍。\n\n然后他选了后者。\n\n不是因为他不算。是因为他算得太清了。\n\n他算清了,所以他扛不动。他扛不动的那个东西,叫四千年。\n\n任何人扛不动四千年。包括你。"},
  {lb:"把他写满的那本要走", hb:"要有人 正义 ≥45 · 他会跟你走 —— 但这改变不了任何事", tag:"极险", cls:"tg",
   req:{stat:"义",min:45,hard:1},
   e:[{w:"all",st:"义",d:18},{flag:"带走白证的账"},{flag:"见过白证"}],
   r:"你说:这本给我。\n\n他说:你要它干什么。\n\n你说:我记的记不完。你记完了。\n\n他看着你,看了很久。然后他把那本塞过来了。\n\n他说:那我干什么?\n\n你说:你去问。\n\n他说:问谁?\n\n你说:随便一个。第一个看见的人。\n\n他愣住。他说:问得完吗?\n\n你说:问不完。\n\n他说:那问它干什么?\n\n你说:让他知道有人问过他。\n\n他抱着账本站在那儿,半天,说:我试试。\n\n——他真的去问了。他走到街上,拦住第一个人,问了那句话。\n\n第一个人说:我没病。\n\n他说:我不是问你有病。我问你要不要。\n\n那人说:要什么?\n\n他说:要有人问你。\n\n那人看了他一会儿,说:神经。\n\n然后走了。\n\n白证站在街上,手里什么也没有了。\n\n陶矜后来问他:你后悔吗?\n\n他说:不后悔。就是一个一个太慢了。\n\n——他到最后都没明白:慢不是问题。四千年才是问题。\n\n而他之所以觉得是慢的问题,是因为他手上那本写完的账,让他以为自己已经做完了。"}
 ]}
 ],

1:[{t:"均输司 · 悲伤再分配",

  {lb:"拒缴。悲伤是我自己的", hb:"全队 念 +12 · 正义 +8", cls:"tg",
   e:[{w:"all",st:"念",d:12},{w:"all",st:"义",d:8}],
   r:"陶矜拒缴。她说:悲伤是我自己的,凭什么上缴。\n\n司员说:因为不均。\n\n她说:不均就不均。\n\n司员看了她很久,在册子上写:此人悲伤超标,拒不调剂,属突出。\n\n突出在均城是最重的罪名。她认了。"},
  {lb:"反向操作:申请补足快乐", hb:"算 +12 · 全队 念 -6", cls:"tb",
   e:[{w:"high:算",st:"算",d:12},{w:"all",st:"念",d:-6}],
   r:"言舟填了申请表,申请补足「快乐差额」。\n\n司里研究了三天,回复:本司无此项。\n\n他又填了一张:那申请补足「不悲伤」。\n\n这次批了。批文写着:同意补足,以静默充抵。\n\n言舟说:行。那我先静默一会儿。"}
 ]},
 {t:"噩梦均输司 · 做梦的人赔,不做梦的人收",
 x:"均城连噩梦也归均。\n\n新规:谁做了噩梦,司里按人头给全城发一份『小睡一会儿』。做梦的人醒来记不清,收到补发的人不做梦。\n\n告示底下有人用铅笔补了一句:那不做梦的人算不算赚了?\n\n下面有人补:做梦的人才亏。做梦是免费的,补发是别人的。",
 o:[
  {lb:"算一下全城一年补发了多少", hb:"陆昭 算 +14 · 算完他把这个数记进了账本", cls:"tb",
   e:[{"w":"陆昭","st":"算","d":14}],
   r:"陆昭算了。\n\n全年做梦人次:十一万七千。补发人次:九十六万。\n\n他说:不做梦的人比做梦的人多八倍,而且这个比例还在拉大。\n\n办事员说:那说明城里治安好。\n\n陆昭说:说明做梦的人比不做的更累。\n\n他把算式抄在纸上,抄完又添了一句:均城之均,均的是别人替你难受。\n\n办事员看了很久,说:这句不能写。\n\n陆昭说:我知道。我写在账本上。"},
  {lb:"陶矜问:做梦算不算一种义务", hb:"全队 正义 +12 · 这个问题没人答得上来", cls:"tv",
   e:[{"w":"all","st":"义","d":12}],
   r:"陶矜问:做梦算不算一种义务?\n\n办事员翻了半天册子,说:册子上没写。\n\n她说:那就是不该算。\n\n办事员说:可要是真不算,城里一半人从此不做梦,补发就发不出去了。\n\n陶矜说:发不出很好。\n\n她说:人不做梦才叫好事。\n\n办事员看着她,忽然说:您是第一个来问『做梦算不算义务』的。\n\n他说:其余的人都是来问『我今晚还能不能做梦』的。"},
  {lb:"有人不肯领补发:领了就等于被人梦过", hb:"全队 念 +14 · 他不肯说的理由最重", cls:"tv",
   e:[{"w":"all","st":"念","d":14}],
   r:"队伍里一个年轻人不肯领。\n\n他说:领了这笔,我这半年做的那些梦就算被人睡了。\n\n你们问他:梦本来也不是你的。\n\n他说:那也不该是我的。\n\n他说完把自己的那份退了。办事员在收据上写:退补发一份,理由栏他不肯填。\n\n他填的是:不领。\n\n陶矜看着那张收据看了很久。她说她留了那么多文书,这张最短。\n\n她说:因为这张是他自己说的。"},
  {lb:"问他:那你今晚还做梦吗", hb:"全队 念 +12 · 这一问没人替他答", cls:"tv",
   e:[{"w":"all","st":"念","d":12}],
   r:"陆昭问他:那你今晚还做梦吗?\n\n他说:做。\n\n陆昭说:退了补发还做梦?\n\n他说:不做的话,梦就白费了。\n\n他说得很平常,像在说一件很划算的事。\n\n陆昭没再问。他后来在账本里给这个人开了一页,写的是:退了一份补发,一整晚没睡。\n\n陶矜问:那这一页算什么?\n\n陆昭说:算他没睡。"}
  ]}],
2:[{t:"秤房 · 秤心如意",
 x:"秤城什么都上秤。粮上秤,人上秤,一句话轻不轻也上秤。\n\n秤房墙上四个大字:秤心如意。\n\n写字的师傅已经疯了——他天天给人称,称到自己刻度过百,当场倾覆。\n\n现在秤还在,秤房空着,秤星上还留着他最后称的那一个人的重量。",
 o:[
  {lb:"把全队都称一遍", hb:"全队 念 +8", cls:"tb",
   e:[{w:"all",st:"念",d:8}],
   r:"你们一个个上秤。称完,执事报数,一个不差,报得很认真。\n\n小满问:那是轻还是重?\n\n执事说:不知道。秤没写。秤只管称,不管好坏。\n\n他说:这是我师傅教我的最后一句。"},
  {lb:"修秤。让它重新能称", hb:"算 +14", cls:"tg",
   e:[{w:"high:算",st:"算",d:14}],
   r:"言舟把秤修好了。修好那天,全城排队来称。\n\n第一天称了三千人。第二天八百。第三天没人来了。\n\n因为称完大家发现:秤准了,人就不值钱了。\n\n以前秤是坏的。坏秤称出来的数,大家都还能活。"},
  {lb:"把师傅最后称的那个数抄下来", hb:"全队 念 +14 · 崔十七 敢 -6", cls:"tv",
   e:[{w:"all",st:"念",d:14},{w:"崔十七",st:"敢",d:-6},{relic:{name:"秤星上最后的重量", stat:"算", power:14, infect:3,
           desc:"秤房墙上四个字:秤心如意。写字的师傅称到自己过百,当场倾覆。秤星上留着他最后称的那一个人的重量——那不是重量,是一个人被称到一百的数字。"}}],
   r:"你们把秤星上最后那个数抄了下来。\n\n那不是重量。那是一个人被称到一百时候的数字。\n\n陆昭在账本上写:编号〇〇〇〇,男,秤房师傅,死于称得太准。\n\n他写完想了想,又添一句:他称了全城,没称过自己。"}
 ]},
 {t:"良心称量所 · 秤不出心,秤得出欠多少",
 x:"秤城新规:凡须做决定者,先称良心。\n\n良心按克称,一克折一两,当场上秤。当场付不出的可以赊,赊账加一成『心意税』。\n\n秤旁挂着价目表:良心一两=一票,一克=一钱,一两以上需预约。\n\n有人问:良心不够秤怎么办。\n\n办事员说:那就少做决定。",
 o:[
  {lb:"称一称自己的良心", hb:"全队 念 +10 · 秤上的数字不太可信", cls:"tv",
   e:[{"w":"all","st":"念","d":10}],
   r:"陆昭站上去。秤盘沉了一下,刻度停在『溢出』。\n\n办事员看了一眼:溢出部分我们不收。\n\n陆昭问:为什么不收。\n\n办事员说:装着容易洒。洒了还得有人擦,擦的人比收的人贵。\n\n他在单子上写:溢出——不予计价,不予入册,不予承认。\n\n陆昭看着那三行字,说:所以我有多少良心,你们并不知道。\n\n办事员说:知道也不能用。你要是拿出来用,它就不溢出了。"},
  {lb:"问:这个秤是称给谁看的", hb:"陆昭 算 +16 · 答案在第七条", cls:"tb",
   e:[{"w":"陆昭","st":"算","d":16}],
   r:"陆昭问:这个秤是称给谁看的?\n\n办事员说:上面。\n\n他说:上面是谁?\n\n办事员翻出条例第七条:本秤所数据每月汇总一次,呈报上级,用于评估市民品行。\n\n陆昭把它抄下来。\n\n他说:那就是说,自己称了不算,报上去才算。\n\n办事员说:对。\n\n陆昭说:所以市民称良心,是为了让人替他称。\n\n办事员笑了一下:您这句话,重一点。\n\n陆昭问:多少斤?\n\n办事员说:这句不在价目表上。"},
  {lb:"赊两斤,一次投票权抵一年", hb:"全队 勇气 +14 · 你会拿到一张很长的单子", cls:"tg",
   e:[{"w":"all","st":"敢","d":14}],
   r:"陆昭赊了两斤。\n\n单子很长:本金二斤,心意税二两,滞纳按月计,逾期则由全城代偿——代偿部分从他的表决权里扣。\n\n他算了算,说:照这个算法,我的表决权七年后就是零。\n\n办事员说:您可以提前结清。\n\n陆昭说:结清要多少。\n\n办事员说:两万四千斤。\n\n陆昭说:那不如欠着。\n\n他把单子折起来收好。\n\n后来他跟陶矜说:秤城最诚实的地方,是它肯告诉你欠多少。\n\n陶矜问:最不诚实的地方呢?\n\n陆昭说:它让你以为秤的是良心。"},
  {lb:"陶矜要一张欠良心的凭据", hb:"全队 念 +12 · 这张纸本身也收费", cls:"tv",
   e:[{"w":"all","st":"念","d":12}],
   r:"陶矜说:给我一张凭据。\n\n办事员问:什么凭据?\n\n她说:欠良心的凭据。\n\n办事员愣了一下,然后开了一张。\n\n她把纸展开看:欠良心如意秤一所,良心二两四钱,已赊,未清。\n\n落款是她的名字。日期是今天。\n\n她把它折好收进本子,和别的文书放在一起。\n\n陆昭问:你收这个做什么。\n\n她说:全城只有这一张纸上写着我的名字,证明我也有欠着不还的东西。\n\n她说:人不是病,是账。谁都有。\n\n办事员在后面补了一句:凭据工本费,三分。"}
  ]}],
3:[{t:"颂词审核处 · 颂与送同音",
 x:"颂城必须歌颂。歌颂的对象已经没了,歌颂还在。\n\n审核处每天收三千份颂词。处里只有一个要求:不许出现「送」字。\n\n因为「送」和「颂」同音,审核处认为不吉利。\n\n于是全城的颂词里,没有一个送别。全城的人,也一个都送不走。",
 o:[
  {lb:"交一份颂词,换三天的粮", hb:"全队 正义 -10", cls:"tv",
   e:[{w:"all",st:"义",d:-10},{item:"过审颂词"}],
   r:"你们交了一份。颂词是陶矜写的,一共四句,没有一句是真的。\n\n审核处批了:合格。批语是:情感饱满,方向正确。\n\n领粮的时候陶矜说:我写了三年假话,头一回有人给我发粮。\n\n她说:以前发的是处分。"},
  {lb:"在颂词里偷偷写下一个「送」字", hb:"敢最高者 勇气 +16 · 全队 正义 +10", cls:"tg",
   e:[{w:"high:敢",st:"敢",d:16},{w:"all",st:"义",d:10}],
   r:"崔十七在颂词的第十九页第三行,写了一个「送」。\n\n审核处查了三天没查出来。因为全城都在歌颂,没人真的在读。\n\n过了三个月,有人发现了。那时候崔十七已经不在了。\n\n发现的人说:这个字写得好。这是全城唯一一句真话。"},
  {lb:"问审核处:你们歌颂的到底是谁", hb:"算 +12 · 全队 念 +8", cls:"tb",
   e:[{w:"high:算",st:"算",d:12},{w:"all",st:"念",d:8}],
   r:"言舟问:你们歌颂的对象是谁。\n\n审核员翻了翻册子,说:上一个。\n\n问:上一个是谁。\n\n答:上一个的上一个。\n\n问:那最上面那个是谁。\n\n答:最上面那个,是头一个说要歌颂的人。他也疯了。疯之前他写了第一份颂词,歌颂的是自己。"}
 ]},
 {t:"错字修正处 · 改对了也要登记",
 x:"颂城不许说错字。\n\n说错的去修正处排队,当着窗口把那个字重新念一遍,念对了才能走。\n\n窗口外有一本《错字登记册》,很厚,比《均城字典》厚三倍。\n\n有游客问:这本册子记的是字?\n\n排队的人说:记的是人。字只是顺手。",
 o:[
  {lb:"崔十七念错一个字,罚念一百遍", hb:"全队 念 +10 · 他会念到相信那个字", cls:"tg",
   e:[{"w":"all","st":"念","d":10}],
   r:"崔十七在窗口前说错了一个字。\n\n窗口说:重念一百遍。\n\n他念到第九十遍的时候,排队的人开始跟着念。\n\n念到一百遍,窗口说:过了。\n\n崔十七愣了一下,问:过了?哪个字?\n\n窗口说:哪个都行。\n\n他走出三步,回头问:那我刚才念的那个,是对的还是错的?\n\n窗口说:你已经念了一百遍,现在它是了。\n\n崔十七说:那它原来是什么?\n\n窗口没听见。\n\n——他后来一路都在想这件事。他说他这趟西行,学会的唯一一件事就是:同一个字,念够遍数就是对的。\n\n陆昭说:那他要是错得再久一点呢?\n\n崔十七说:那我就是颂城的对。"},
  {lb:"言舟说:错字比正字好用", hb:"全队 念 +14 · 这句话也要登记", cls:"tv",
   e:[{"w":"all","st":"念","d":14}],
   r:"言舟看着那本厚册子,说了一句:错字其实比正字好用。\n\n陆昭问:怎么说?\n\n他说:正字只能写一种意思。错字能写两种。\n\n他说:词这东西就是靠混着用的,才有活路。写死了就死了。\n\n审核员从窗口里探出头:这句也要登记。\n\n言舟问:我说错了吗?\n\n审核员说:没有。所以更该登记。\n\n言舟愣了一下:说对了也要登记?\n\n审核员说:登记册最后一页,记的就是改对的字。\n\n陆昭问:为什么。\n\n审核员说:因为改正本身也是一种动作。\n\n他看着言舟:这个册子里,连认错都要排队。\n\n——陆昭后来说,那是他在颂城听过的最狠的一句制度。颂城最不肯放过的,不是错,是承认自己改过。"},
  {lb:"陶矜要求把「修正处」三个字改对", hb:"全队 正义 +12 · 她挑的不是字", cls:"tv",
   e:[{"w":"all","st":"义","d":12}],
   r:"陶矜站在牌匾下看了很久,说:这三个字里有一个是错的。\n\n审核员说:哪个?\n\n她说:处。\n\n审核员说:没错啊,处。\n\n她说:是错。\n\n她说:修正是改,改了就完了。你们把改叫『处』——处是待着不动。\n\n她说:你们这里根本没有修正,只有把人按住不动。\n\n审核员在窗口后坐了很久,没说话。\n\n后来他拿出一张纸,写:陶矜,女,纠正一处。\n\n他写完念了一遍,问她:这是对的吗?\n\n陶矜说:我不知道。\n\n他说:那就对了。你不知道,所以没登记。"},
  {lb:"什么也不争,只是把登记册的厚度量一量", hb:"陆昭 算 +10 · 厚度不是错觉", cls:"tb",
   e:[{"w":"陆昭","st":"算","d":10}],
   r:"陆昭量了登记册的厚度。\n\n颂城人口八千七百。册子四尺三寸。按每页两百行、每行二十字算,能装三百五十万条。\n\n除以八千七百,一人四百条。\n\n他说:一个人平均错了四百次。\n\n崔十七说:那也不多。\n\n陆昭说:册子最前面那一页,不是错字。\n\n他翻开第一页,上面写着本册的编制说明,最后一句是:凡入册者,永不删除。\n\n他说:算缄城记名字,是因为名字会被人念。\n\n他说:这里记错字,是因为错了的人只有一种下场——被记住。\n\n他说:一个地方最能证明它不打算改的,不是它的法条。是它有册子。"}
  ]}],
4:[{t:"静默套餐 · 含一张写好的纸条",
 x:"静默城不能说话。于是城里卖「静默套餐」。\n\n套餐内容:一副耳塞,一沓纸条,和一张印好的纸条。\n\n印好的那张上头四个字:我很想说话。\n\n老板说这是卖得最好的一款。因为买的人都不用自己写——写了也发不出去。",
 o:[
  {lb:"买。一人一套", hb:"全队 念 +10", cls:"tv",
   e:[{w:"all",st:"念",d:10},{item:"静默套餐"}],
   r:"你们一人买了一套。拆开以后,八个人手里八张一模一样的「我很想说话」。\n\n小满把纸条翻过来,背面有字,是上一个买家用铅笔写的:我也是。\n\n再翻,还有一行更小的:这套我买了三次,三次都是同一张。\n\n她问老板:这纸条是不是回收的?\n\n老板点点头,然后指了指自己的嘴,摇了摇手。"},
  {lb:"不买。全靠用手比划", hb:"全队 念 +14", cls:"tg",
   e:[{w:"all",st:"念",d:14}],
   r:"你们没买,全靠比划。\n\n三天下来,八个人比划出三百多个手势。比说话快,也比说话准。\n\n临走时老板送了你们一套,不要钱。\n\n他在纸条上写:你们是头一批没买就会说话的人。这批货,我送不起第二份。"},
  {lb:"在空白纸条上替老板写一句", hb:"全队 义 +16 · 念 +6", cls:"tv",
   e:[{w:"all",st:"义",d:16},{w:"all",st:"念",d:6}],
   r:"你们在空白纸条上写了一句话,塞回套餐里。\n\n写的是:你也不必一直不说话。\n\n老板看了很久。然后他摘下耳塞,说了三年来第一个字。\n\n那个字是:吵。\n\n他说完就笑了。笑是没有声音的——笑了三十年,肌肉忘了怎么出声。"}
 ]},
 {t:"静默城 · 你不说,就是同意了",
 x:"静默城新政第三条:谁先开口,谁默认了全部条件。\n\n于是所有人都不说话。不说话的人默认了别人替他决定的一切。\n\n城里最大的声音是关门声。\n\n告示最后一行写着:本城秩序良好,投诉量为零。\n\n告示下面有人补:因为投诉要先开口。",
 o:[
  {lb:"数一数全城一天说的话", hb:"陆昭 算 +12 · 数字比棺材少", cls:"tb",
   e:[{"w":"陆昭","st":"算","d":12}],
   r:"陆昭数了一天。从东门数到西门,只听见一句半。\n\n那一句是一个母亲对孩子说的:过来。\n\n那半句是市集上一张纸条被风吹起来时,上头的字念出来的。\n\n他数完算了:全城一万九千人,一天合计开口不足十二个音节。\n\n崔十七说:比昨天那副棺材上的字还少。\n\n陆昭说:棺材上写的是名字。名字是有主的。\n\n他说:今天这十二个音节,没有一个是被问出来的。"},
  {lb:"有人在自己家里偷偷说话", hb:"全队 念 +14 · 他说完就撕了纸条", cls:"tv",
   e:[{"w":"all","st":"念","d":14}],
   r:"一个屋子里,墙上贴着一张纸条:今日天气尚可。\n\n是手写的。字很丑。\n\n屋里的人站在纸条前面看了很久,没敢念。\n\n后来他开口念了。念完他站了很久,然后把纸条撕了。\n\n他说:太冒险。\n\n陶矜问:为什么冒险?\n\n他说:因为一旦说了,就有人要回答。回答了,就有人要承担。\n\n他说:这一天的天气已经被定好了——定的时候没问过我。\n\n他说:我今天说它尚可,那明天它要是不好,是谁定的?\n\n陆昭问:所以你撕了。\n\n他说:我撕了,但我今天说了。\n\n他说:我不后悔说了。我后悔的是我又回到了不说话。"},
  {lb:"陶矜问:那要是真的有话要说呢", hb:"全队 正义 +14 · 对方的回答很慢,也很怪", cls:"tv",
   e:[{"w":"all","st":"义","d":14}],
   r:"陶矜对一个坐着的人比了个手势:有话要说,怎么办?\n\n那人想了很久,在纸上写:你说吧。\n\n她写:我们不管听没听见。\n\n那人在纸上写:写下来。你写下来的也算你说。我们照着做。\n\n陶矜写:那谁来定你听见之后的意思?\n\n那人停了很久,写:\n\n现在你说了。\n\n陶矜愣住。\n\n那人接着写:刚才这一问,已经算你开口了。条件是你定的。\n\n——陶矜后来说,她这辈子见过最硬的一堵墙,不是铁,是一个把沉默当默认、又拿默认当武器的人。\n\n她说他不是坏。他是被这条规矩吃过一次。"},
  {lb:"言舟问:不说话这个规矩,到底在保护谁", hb:"全队 念 +16 · 答案是他自己", cls:"tb",
   e:[{"w":"all","st":"念","d":16}],
   r:"言舟问:这个规矩,到底在保护谁?\n\n没人回答。当然没人回答——回答就犯规了。\n\n他自己想了一会儿,写了答案在纸上,举起来:\n\n保护先说话的人。\n\n陶矜看着那张纸,点了点头。\n\n言舟接着写:\n\n因为谁先说,谁负责。谁先说,谁的條件成立。\n\n他写:所以所有人都不说。\n\n他写:一个不让任何人负责的规矩,听起来像在保护弱者。\n\n他写:其实它保护的是不敢负责的人。包括我。\n\n他把纸放下。\n\n陆昭问:那你为什么还写。\n\n言舟说:因为我这张纸写完,别人就替我解释了。我不用解释。\n\n他说:你看,连我也是靠写字过关的。\n\n——静默城最深的洞不是不许说。是大家都学会了绕过它。"}
  ]}],
5:[{t:"铁处 · 铁饭碗发放",
 x:"铁城发铁饭碗。字面意思:铁的,饭碗。\n\n好处是摔不烂。坏处是装不了饭——铁太厚,碗太沉,端起来手腕会断。\n\n发放处的标语写着:一握在手,终身不愁。\n\n底下有人拿刀刻了一行:终身不愁,终身不吃饭。",
 o:[
  {lb:"领。一人一个", hb:"全队 敢 -8", cls:"tv",
   e:[{w:"all",st:"敢",d:-8},{relic:{name:"铁饭碗", stat:"敢", power:12, infect:2,
           desc:"铁城熔了八个碗打的。碗盛饭,铁碗盛得住、也砸得开。端着它,饿得慢些,怕也得慢些——只是铁碗凉,盛不了热汤。"}}],
   r:"你们领了八个铁饭碗。一人一个,沉甸甸的。\n\n崔十七端了半天,说:这玩意儿装不了饭。\n\n发放员说:装不了饭,但摔不烂。\n\n崔十七说:我不要摔不烂。我要能装饭。\n\n发放员说:那你去隔壁。隔壁发瓷的。瓷器归「易碎品统筹办」管,排队在第四十一天。\n\n第四十一天,这座城没了。"},
  {lb:"不领。把八个碗熔了打成刀", hb:"敢最高者 勇气 +16", cls:"tg",
   e:[{w:"high:敢",st:"敢",d:16}],
   r:"你们把八个铁饭碗熔了,打成一把刀。\n\n熔的时候铁水很亮。崔十七说:这是我见过最像饭的一团东西。\n\n刀打成以后八个人分着用,刀柄上刻着八个名字。\n\n发放员在册子上写:铁饭碗八只,已熔。备注:持有人称,熔了能吃上饭。\n\n他想了想,又添一句:他说的对。"},
  {lb:"替全城申请换成瓷碗", hb:"全队 义 +16 · 算 +8 · 全队 念 -6", cls:"tb",
   e:[{w:"all",st:"义",d:16},{w:"high:算",st:"算",d:8},{w:"all",st:"念",d:-6},{item:"换碗申请书"}],
   r:"言舟写了一份申请:请将铁饭碗更换为瓷饭碗。理由:碗的功能是盛放,不是不朽。\n\n铁处批了八个字:不予更换,铁比瓷坚。\n\n他又写了一份:那请说明,碗是给活人用的,还是给碗用的。\n\n这份没批。因为没人敢批。\n\n申请一直压在铁处,压到城没了,纸还在。"}
 ]},
 {t:"模范市民证 · 无欲无求才能领",
 x:"铁城发模范市民证。证上印着:此人无欲无求,体重稳定。\n\n持证者优先配给,优先分房,优先领药。\n\n发证条件只有一条:你必须证明你从来没想要过任何东西。\n\n窗口前排着队,队伍里没人问自己要不要。",
 o:[
  {lb:"崔十七去申请,被问到「曾经想要过多少」", hb:"全队 勇气 +12 · 她答了一个具体数字", cls:"tg",
   e:[{"w":"all","st":"敢","d":12}],
   r:"崔十七填到第三栏,停住了。\n\n第三栏是:无欲。他要填「无」。\n\n窗口说:填『无』要举证。\n\n他说:我举个例子行吗?\n\n窗口说:举多少算多少,举到没有为止。\n\n他想了想,说:我想过城西那家汤铺的最后一碗。想了三年。\n\n他还说:他想过自己的名字出现在碑上,想的顺序不对。\n\n他说完抬头:这个算不算?\n\n窗口在一张纸上记:崔十七,男,曾经想要过三样,已缴。\n\n他愣住了:缴?\n\n窗口说:欲望可以补缴。缴清就不算无欲,算已了。\n\n他说:那「已了」和「没有」差在哪?\n\n窗口说:差在——「已了」的人,有过凭据。"},
  {lb:"算全城的欲望总值", hb:"陆昭 算 +16 · 这个数就是这座城的GDP", cls:"tb",
   e:[{"w":"陆昭","st":"算","d":16}],
   r:"陆昭算了个没道理但很准的数。\n\n方法很土:把全城缴过的『欲望金额』加起来,加上没缴但写在申报表被划掉的那些。\n\n结果:八千六百四十万文。\n\n他把这个数报给办事员。\n\n办事员愣了一下,问:这是什么?\n\n陆昭说:这是全城一年的生产总值。\n\n他说:这座城所有被做出来的东西,粮、房、药、字,加起来八千六百四十万文。\n\n他说:全城的人想要的,也是八千六百四十万文。\n\n他说:一个数,既是被生产出来的,也是被想要的。\n\n办事员说:所以?\n\n陆昭说:所以这座城不缺东西。它缺的是承认自己缺东西。"},
  {lb:"有人上缴了自己的欲望,拿到收据", hb:"全队 念 +14 · 他第一次有凭据证明自己想要过", cls:"tv",
   e:[{"w":"all","st":"念","d":14}],
   r:"一个老头把欲望上缴了。\n\n他报得很细:想吃过一次城北的席,想有一件不漏雨的衣裳,想知道隔壁那家人姓什么。\n\n一共三项,合计一两二钱。\n\n窗口开了收据,写:欲望三件,已缴,永久清白。\n\n他把收据捏在手里看了很久,忽然说:我这辈子头一回有凭据,证明我想要过什么。\n\n他说:以前谁问我我都不认——认了就像贪。\n\n他说:现在这张纸上有字有印。你赖不掉了。\n\n他把收据折好,放进贴身的地方。\n\n陆昭问:交上去之后,还想要吗?\n\n老头说:想。\n\n他说:但现在我想要的东西,有名字了。"},
  {lb:"陶矜问:不高兴算不算违规", hb:"全队 正义 +12 · 窗口想了很久", cls:"tv",
   e:[{"w":"all","st":"义","d":12}],
   r:"陶矜问:那不高兴,算不算违规?\n\n窗口里的人抬起头。他大概很久没被人问过这种问题。\n\n他翻册子。翻了很久。\n\n最后他说:没写。\n\n他说:欲望那栏有,欢喜那栏有,不高兴这栏……我们没设。\n\n陶矜说:那你们怎么发的证?\n\n他说:靠体重。\n\n他说:体重稳定就算无欲无求。\n\n陶矜沉默了一会儿,说:所以一个人不高兴,只要他没瘦,合规。\n\n窗口里的人没说话。\n\n过了很久,他低声说:瘦了要重新称。重的人少,所以我们只称重的。\n\n陶矜说:那不高兴的人,是被按住的?\n\n他没回答。他低头在册子上写了一行,写完自己看了看,又划掉了。"}
  ]}],
6:[{t:"冥衣铺 · 明夷定制",
 x:"明夷城有家冥衣铺。招牌上写:明夷定制,量体裁衣。\n\n「明夷」是这座城的名字,也是寿衣的意思。\n\n老板说这两件事没关系,纯属巧合。\n\n他说:我开店的时候这城就叫明夷了。总不能让我改行。\n\n铺子里挂满了衣裳。每件都合身——因为每件都是照着活人量的。量完,等他死。",
 o:[
  {lb:"给全队各量一件", hb:"全队 念 +12 · 敢 -8", cls:"tg",
   e:[{w:"all",st:"念",d:12},{w:"all",st:"敢",d:-8},{item:"冥衣尺码单"}],
   r:"老板给每个人量了尺寸,量得很仔细,连袖口松紧都问。\n\n量到陆昭的时候他说:你这件得留宽一点。\n\n陆昭问:为什么。\n\n老板说:因为你还得长。活人会长,死人不会。\n\n他把尺码单递过来,背面印着一行小字:本店支持改尺寸,限生前。"},
  {lb:"问老板:你给多少人量过", hb:"全队 念 +16 · 算 +6", cls:"tv",
   e:[{w:"all",st:"念",d:16},{w:"high:算",st:"算",d:6}],
   r:"陆昭问:你给多少人量过。\n\n老板说:一万三千七百件。\n\n问:做完了多少。\n\n答:一万三千六百九十九件。\n\n问:差的那件呢。\n\n老板指了指最里面那件。那件最小,是小孩的。\n\n他说:那件我做了十年,一直在改。因为那孩子一直没死。\n\n他说:这是我这辈子唯一一件,希望永远做不完的活。"},
  {lb:"不量。只把铺子记进账本", hb:"陆昭 念 +10", cls:"tb",
   e:[{w:"陆昭",st:"念",d:10}],
   r:"陆昭没让量。他只在账本上写了一行:明夷有铺,铺有万衣,衣皆合身,身皆不在。\n\n写完他合上本子。\n\n老板送到门口,塞过来两个面包,说:不量,好。不量的人,本子上还有下一段。\n\n面包有点咸。"}
 ]},
 {t:"丧事代办处 · 哭是自选的",
 x:"明夷城的丧事可以代办。\n\n代办处提供全套服务:哭、抬棺、写挽联、通知亲戚、以及节哀。\n\n价目表贴在门口,整套三折。\n\n价目表底下有人补了一句:三折是因为大部分人到了这一步已经没有力气真哭了。\n\n补的人没署名。",
 o:[
  {lb:"问:能不能只买「节哀」", hb:"全队 念 +12 · 单项更贵,理由更冷", cls:"tv",
   e:[{"w":"all","st":"念","d":12}],
   r:"崔十七问:我能不能只买「节哀」?\n\n代办员说:可以。\n\n他问:多少钱?\n\n代办员说:比整套贵四倍。\n\n他问:为什么?\n\n代办员说:因为真哭的人不用买。\n\n崔十七愣住。\n\n代办员接着说:花钱买的哭是假的,那不要紧,家属能看出来。\n\n他说:花钱买的节哀是全的——因为没真哭过,后面那些该有的东西都还在。\n\n他说:节哀本来就是最贵的一项。它不用你真的伤心,只要你有。\n\n崔十七说:有?\n\n代办员说:名字。有名字就有位置。有位置,人就没白走。\n\n他说:全套三折买的是仪式。节哀买的是名字。"},
  {lb:"问:「通知亲戚」通知的是谁", hb:"陆昭 算 +14 · 他核了一遍名单", cls:"tb",
   e:[{"w":"陆昭","st":"算","d":14}],
   r:"陆昭核了一遍代办处的通知名单。\n\n名单上全是死人。\n\n代办员说:是。全是。\n\n陆昭说:那通知发不出去。\n\n代办员说:发不出去。\n\n陆昭问:那这项还收钱?\n\n代办员说:收。\n\n他说:这项收的是「通知过了」这四个字。\n\n他说:家属要的是那一刻——那一刻有文书,有人按过手印,有人说过一句「已经通知了」。\n\n陆昭看着名单。\n\n他说:所以你们替死人通知活人。\n\n代办员说:我们替死了的人,把他们没走完的手续走完。\n\n他说:手续比人走得久。"},
  {lb:"陶矜问:要是没人来办丧事呢", hb:"全队 正义 +14 · 套餐里包含:没有人", cls:"tv",
   e:[{"w":"all","st":"义","d":14}],
   r:"陶矜问:要是没人来办呢?\n\n代办员翻出一张价目表背面,上面有一行小字:『无人认领』套餐。\n\n他说:这个套餐包含三项:一个没有名字的坑,一顿没人吃的饭,和一份写着『无』的文书。\n\n陶矜问:多少钱?\n\n代办员说:不要钱。\n\n她说:为什么不要钱?\n\n代办员说:因为花钱是替人操办。不要钱才是真的没人。\n\n他说完补了一句:所以这项其实最贵。贵在经办的人走出去之后,连个可以对账的人都没有。\n\n陶矜问了最后一个问题:那『无』这个字,是谁写?\n\n代办员说:我写。\n\n她说:那你不是替人写?\n\n他说:我是替没人写。\n\n他说:这两件事不一样。"},
  {lb:"言舟在墙上找到那行没署名的话", hb:"全队 念 +16 · 他没署名,但他抄了", cls:"tv",
   e:[{"w":"all","st":"念","d":16}],
   r:"言舟在代办处最里面的墙上,找到了那行补的话:\n\n三折是因为大部分人到了这一步已经没有力气真哭了。\n\n他站了很久。\n\n他问代办员:这是谁写的?\n\n代办员说:不知道。\n\n他说:您在这行干了多少年?\n\n代办员说:二十三年。\n\n言舟说:那您看过写这句话的人?\n\n代办员想了想:看过。写完就走了。\n\n言舟问:那您记不记得他?\n\n代办员说:不记得脸。\n\n他说:但我记得他写完以后站在那儿看了很久,跟刚才你站在那儿一样。\n\n言舟把这行话抄进了本子。他抄完在下面添了一句:\n\n这个人替我们说了我们不好意思说的话,所以他不敢署名。\n\n他说:署名是要负责的。写这话的人,连死都不用他负责——他连名字都没留。"}
  ]}],
7:[{t:"缘尽亭 · 源与缘",
 x:"源城有座缘尽亭。亭里挂着一副对子:\n\n上联:有缘千里来相会\n下联:无缘对面手难搭\n横批:到此为止\n\n守亭的老头说,这对子不是他写的,是上一个守亭的人留下的。\n\n那个人走的时候说:横批写错了。应该是「到此才开始」。\n\n他说完就走了,再没回来。",
 o:[
  {lb:"把横批改成「到此才开始」", hb:"敢最高者 勇气 +16 · 全队 念 +10", cls:"tg",
   e:[{w:"high:敢",st:"敢",d:16},{w:"all",st:"念",d:10},{flag:"改了横批"}],
   r:"你们把横批换了。\n\n换完当天,来亭子里的人多了三倍。因为「到此为止」是句号,「到此才开始」是逗号。\n\n逗号后头还能写东西。\n\n老头看了半天,说:那个人说得对。\n\n他说:他走的那天,我没留他。我以为到此为止了。"},
  {lb:"在亭里替所有人搭一次肩", hb:"搭肩 +1 · 全队 念 +14", cls:"tv",
   e:[{sh:1},{w:"all",st:"念",d:14}],

  {lb:"问老头:你等的那个守亭人,回来了吗", hb:"全队 念 +18", cls:"tb",

function effectSummary(o){
  const e=o.e||[]; const out=[]; const skip=!alive().some(function(m){return m.name!=="陆昭";});
  e.forEach(function(x){
    if(x.st){
      if(x.w==="陆昭") return;
      /* 「high:敢」是内部写法——指「队里该项最高的那个」。
         玩家看到的是「highest 敢 +20」这种半吊子英文，
         所以这里必须翻成人话：最高者 / 全队 / 谁。
         顺带修一个更蠢的 bug：原来直接 fixWho(w)，而 fixWho 碰到
         "high:" 开头的会原样返回（它只管名字替换，不管这个），
         于是拼出「high:算算+12」——属性名重复、还漏了个前缀。 */
      let w;
      if(String(x.w).indexOf("high:")===0){
        if(skip) return;                        // 只有陆昭一人：没有「最高者」可言
        w = "全队最高"+x.st;
      }else if(x.w==="all"){
        w = skip?"":(alive().length>1?"全队":"");
      }else{
        /* 具体人名。关键：这个人现在必须在队里。
           事件文案常写「陶矜用欠条保他」，但陶矜可能早就不在了
           （没入队 / 已倾覆）。这时候若还照原样显示，
           玩家会看到一个自己根本不认识的人在做动作——
           「有的人物还没出现过就在选项里了」正是这么来的。
           人不在，就不显示这条效果：宁少一句，不要骗人。 */
        const t=byName(fixWho(x.w));
        if(!t) return;
        w = t.name;
      }
      if(!w) return;
      /* 属性名统一用双字（勇气/精神/谨慎/正义）。
         内部一律用单字（敢/念/算/义）做键——那是数据层的写法，
         露到界面上就会和「陆昭念 +14」这类描述打架，两套名混着看最晕。 */
      const k = STAT_NAME[x.st] || x.st;
      out.push(w+" "+k+(x.d>=0?"+":"")+x.d);
    } else if(x.sh){ out.push("搭肩 +"+x.sh); }
    else if(x.will){ out.push("意志"+(x.will>=0?"+":"")+x.will); }
    else if(x.item){ out.push("得「"+x.item+"」"); }
    else if(x.relic){ out.push("得遗骸器「"+x.relic.name+"」"); }
    else if(x.drop){ out.push("失「"+x.drop+"」"); }
  });
return out.join(" · ");
}

/* hb 是写死的后果文案（「陶矜 正义 +22」）。
   问题：角色可能已经倾覆了，文案却还在说「他正义 +22」——
   玩家看到的是一句不会兑现的承诺，还以为自己算错了什么。
   （玩家原话：「有的人死了还能加数值」。）
   这里在渲染时把已经不存在的角色从文案里摘掉：
     - 整句都靠这个人（"陶矜 正义 +22"）→ 整句去掉
     - 只是顺带提到（"…· 她的条子现实会认"）→ 换成队伍里真实的替代者
   摘不掉就说明白：告诉玩家这个人已经不在了。 */
function hbAlive(hb){
  if(!hb) return "";
  let t=String(hb);
  /* 逐个检查文案里出现的角色名。fixWho 之后的名字才是当前队里的名字。 */
  const names=ORIG_NAME.concat(["陆昭"]);
  let dropped=[];
  names.forEach(function(n){
    if(t.indexOf(n)<0) return;
    /* 陆昭永远在，不动他。 */
    if(n==="陆昭") return;
    /* 这个名字经过替换后指向谁？指向队里的人才算有效。 */
    const real=fixWho(n);
    if(byName(real)) return;
    /* 人不在：把「名字 + 属性 + 数值」整段摘掉。 */
    const re=new RegExp("(?:^|[·,，\\s])"+n+"\\s*(?:最高\\s*)?(?:勇气|精神|谨慎|正义|敢|念|算|义)?\\s*[+\\u2212-]?\\s*\\d*\\s*(?:[·,，]|$)","g");
    const before=t;
    t=t.replace(re,function(m){
      /* 保留了分隔符，别把句子接坏 */
      return m.indexOf("·")>=0 ? "·" : (m.indexOf(",")>=0 ? "," : "");
    });
    if(t!==before) dropped.push(n);
  });
  t=t.replace(/[·,，]{2,}/g,"·").replace(/^[·,，]\s*/,"").replace(/\s*[·,，]\s*$/,"").trim();
  if(dropped.length){
    t = t + (t?" · ":"") + "「"+dropped.join("、")+"」已经不在队里了";
  }
  return t;
}
/* —— 后果标签里的数值加粗 ——
   hb 是每个选项的后果说明。设计要求是「后果在选之前就摆清楚」，
   所以这里把其中的数值片段（+14 / −8 / ≥45 / 只有 0）加粗并上色，
   其余描述性文字保持灰色——强调的是代价，不是语气。 */
/* 后果加粗。玩家有权在点下去之前就看清自己要付什么，
   所以数值必须是重的那部分——不是语气重，是数字重。
   属性名有两套写法（念 / 勇气），两套都要认；
   「陆昭四枢各 +8」这种四枢一起涨的也要认。
   不做泛化正则：只认真正出现过的句式，宁可漏一个，也不要把普通词染红。 */
/* 后果加粗。玩家有权在点下去之前就看清自己要付什么，
   所以数值必须是重的那部分——不是语气重，是数字重。
   属性名有两套写法（念 / 勇气），两套都要认；
   「陆昭四枢各 +8」这种四枢一起涨的也要认。
   只认真正出现过的句式，宁可漏一个，也不要把普通词染红。 */
function hbBold(t){
  if(!t) return "";
  let s=String(t);
  /* 「主枢 / 最高枢 / 四枢」这一族抽象统称，经 unifyStatWords 裹了书名号。
     它必须单独走一次 replace —— 混进下面 ATT 的 alternation 里会失配：
     同一个式子里既有带引号的整词分支、又有裸单字分支（敢|念|算|义），
     引擎从左往右扫，裸单字那一支会先把不该它吃的字符吃掉，
     整体回溯失败的结果就是**一个都不加粗**（实测「「主枢」 +10」全丢）。
     所以：先摘掉带引号的整词，剩下的再交给 ATT。 */
  s=s.replace(/(「[^」]*?(?:主枢|最高枢|四枢)[^」]*」)(\s*[+−-]\s*\d+)/g,
    function(m, word, num){ return "<b>"+word+num+"</b>"; });
  /* 属性字。单字（念/敢/算/义）、双字（勇气/正义/精神/谨慎）、
     以及没裹引号的「主枢 / 全队主枢 / 队最高枢 / 全队最高枢」。
     同一族里长的必须写在前面——正则从左往右贪心，
     「全队主枢 -8」若先撞上「主枢」，前半截就漏了。 */
  const ATT=/(?:敢|念|算|义|勇气|正义|精神|谨慎)(?:四枢(?:各)?)?\s*[+−-]\s*\d+|(?:全队|队)?(?:最高枢|主枢)(?:四枢(?:各)?)?\s*[+−-]\s*\d+/g;
  s=s.replace(ATT,function(m){return "<b>"+m+"</b>";});
  /* 门槛：意志 ≥12 / 要有人 正义 ≥45 —— 差多少必须写清楚 */
  s=s.replace(/(?:意志\s*≥\s*\d+|(?:要有人)?[^·，,]{0,6}≥\s*\d+)/g,function(m){
    return m.indexOf("<b>")>=0 ? m : "<b>"+m+"</b>";
  });
  /* 缺值：推不开 · 意志只有 0 —— 让人知道自己差在哪 */
  s=s.replace(/意志只有\s*\d+/g,"<b>$&</b>");
  /* 独立带符号数字：+14 / −8。前面不是数字/属性字/标签符，且后面不接数字或标签，
      所以既不会套两层，也不会切进 <b> 内部。 */
  s=s.replace(/(^|[^\d敢念算义勇气正义精神谨慎四><])([+]\s*\d+|−\s*\d+)(?![\d<]|b>)/g,"$1<b>$2</b>");
  /* 合并相邻标签，消除嵌套 */
  s=s.replace(/<b>([\s\S]*?)<\/b>\s*<b>/g,"$1");
  s=s.replace(/<\/b>\s*<\/b>/g,"</b>");
  return s;
}
function choose(i){
  sfx("tap");
  const ev=curEvents()[S.ei], o=ev.o[i];
  if(ev.main){ S.mainPick=S.mainPick||{}; S.mainPick[S.ci]=i; }
  if(ev.willev){ S.sideSeen=S.sideSeen||{}; S.sideSeen[S.ci]=1;
    if(Object.keys(S.sideSeen).length>=5) achUnlock("sideseen"); }
  const res=applyEffects(o.e||[]);
  S.last=fixNames(o.r);
  if(res.dead.length){
    S.last+="\n\n【"+res.dead.map(m=>m.name).join("、")+"】倾覆了。";
    flash(res.dead[0].name, fallText(res.dead[0]));
  }
  if(res.risk.length){ S.last+="\n\n【"+res.risk.map(m=>m.name).join("、")+"】已进入逆者区间,随时可能倾覆。"; }
  /* 后果单独存，不拼进正文。
     设计决定：选项列表里不预告后果——那是在替玩家决定之前剧透。
     但选完之后的结算必须把代价摆到最显眼的地方，因为这时候已经不能反悔了。
     所以这里拆成两块：正文讲发生了什么，后果块讲为此付出了什么。 */
  { const sum=effectSummary(o);
    let items=[];
    /* unifyStatWords：把文案里的单字属性（念/算/敢/义）统一成双字
       （精神/谨慎/勇气/正义）。界面上其它地方都用双字，
       这里不统一的话，同一屏上会出现两套名字，
       玩家会以为是两套不同的系统。 */
    if(sum) items.push('<span class="cs">'+hbBold(unifyStatWords(fixNames(sum)))+'</span>');
    if(o.hb) items.push('<span class="cs">'+hbBold(unifyStatWords(fixNames(hbAlive(o.hb))))+'</span>');
    S.lastConseq = items.length
      ? '<div class="chead">后果</div>' + items.join('<span class="cdot">·</span>')
      : ""; }
  S.awaiting=true;
  render();
}

/* 死路兜底的执行：一个人扛过去。
   不给属性——陆昭的九锁死在 9，这是设定，不是 bug。
   给意志：他一个人走了这段路，这是他唯一还能挣到的东西。
   顺便记一笔：一个人扛过几次。结局页要用它说话，
   因为「你全程独自扛着」本身就是一种结果。 */
function soloPush(){
  sfx("tap");
  S.will = Math.max(0,(S.will||0)+1);
  S.willLog=S.willLog||{}; S.willLog[S.ci]=Math.max(S.willLog[S.ci]||0,1);
  S.solo=S.solo||0; S.solo++;
  S.last="一个人扛过去了。\n\n"
    +"这件事本来是要两个人做的——一个人做,要么做不成,要么做成了也留个残。\n\n"
    +"你做成了。或者说,你做成了它看起来能做成的那部分。\n\n"
    +"陆昭把这一页记上,后面补了一句:此条无人同担。";
  S.lastConseq='<div class="chead">后果</div><span class="cs">意志 <b>+1</b> · <b>没人在旁边</b></span>';
  S.awaiting=true;
  render();
}

function next(){
  if(S.pending){ forge(); return; }
  infect();
  S.ei++;
  if(S.ei>=curEvents().length){
    const oc=CITIES[S.ci];
    if(oc.doc) addItem(oc.doc);
    if(oc.doc2) addItem(oc.doc2);
    S.ci++;
    if(S.ci>=CITIES.length){ addItem("诸城志 · 序"); S.phase="epilogue"; save(); render(); return; }
    /* —— 沉淀:走一段路,人会松一点。
       没有这一步,刻度只涨不落,招募到的同伴 87% 会在终点前倾覆,
       导致 11 个结局里有 8 个永远走不到。

       陆昭必须排除在外。他的四枢是「锁死在 9」的铁律——
       每次要往一边走,另一边就把他拉回来（见 changeStat）。
       但这里原来是 alive().forEach 全员扣,绕过了那道锁:
       每过一城扣 4 点,三城之后 9 → 0,四项全空。
       玩家看到的是「四项属性突然全变成 0」,而且完全不知道是谁干的。
       铁律既然定死了,任何地方都不许碰他的四枢。 */
    const SETTLE=4;
    alive().forEach(function(m){
      if(m.name==="陆昭") return;
      STATS.forEach(function(k){ if(m.s[k]>0) m.s[k]=Math.max(0,m.s[k]-SETTLE); });
    });
    S.settled=(S.settled||0)+SETTLE;
    if(JOKE_EVENTS[S.ci]) achExtraSeen(S.ci);
    S.phase="city"; S.shoulderUsed=0; veil("西 行");
  }
  S.last=""; S.lastConseq=""; S.awaiting=false;
  render();
}

/* ============ 铸器 ============ */
function forge(){
  const m=S.pending; if(!m) return;
  const k=m.deadBy, v=m.s[k];
  let h='<div class="mask"><div class="dlg"><h2>'+m.name+' 倾覆了</h2>';
  h+='<p style="color:#A3341F">'+fallText(m)+'</p>';
  h+='<p>'+m.name+'的'+STAT_NAME[k]+'是 '+v+'。'+(m.way==="归星"?"归星了,尸身留下。":"崩身了,留下的东西还在动。")+'</p>';
  h+='<p style="font-size:13px;color:#857C6E">取'+m.name+'身上一个部位,铸成遗骸器。铸成的器保留'+((ORIG_GENDER[m.name]==="f")?"她":"他")+'的偏执,佩戴者会被反向感染。</p>';
  ["倾覆", m.way==="归星"?"归星":"崩身", m.way==="归星"?"星仆":"现象体", "遗骸器"].forEach(function(w){
    const nt=pickNote(w);
    if(nt) h+='<div class="note"><b>'+nt+'</b> —— '+TERMS[nt]+'</div>';
  });
  PARTS.forEach((p,i)=>{
    const pw=Math.round(p.power*(0.6+v/100));
    h+='<button type="button" class="opt" onclick="doForge('+i+','+pw+')"><span class="lb">'+m.name+'的'+p.k+'</span><span class="sub"><span class="hb">'+
       hbBold('铸成「'+p.name+'」 · '+m.name+'的'+STAT_NAME[k]+' +'+pw+' · 每事件感染 +'+p.infect)+'</span></span></button>';
  });
h+='<button type="button" class="opt" onclick="skipForge()"><span class="lb">不动'+m.name+'</span><span class="sub"><span class="hb">把'+m.name+'埋了。什么也不拿。</span></span></button>';
  h+='</div></div>';
  el("modal").innerHTML=h;
}
function doForge(i,pw){
  const m=S.pending, p=PARTS[i];
  S.relics.push({name:m.name+"的"+p.name, owner:m.name, stat:m.deadBy, power:pw, infect:p.infect, equipped:null,
    desc:"用"+m.name+"的"+STAT_NAME[p.k]+"做的。"+m.name+"还留着一点"+STAT_NAME[m.deadBy]+"。"});
  S.ledger.push({no:String(S.ledger.length+1).padStart(4,"0"),name:m.name,how:STAT_NAME[m.deadBy]+" "+m.s[m.deadBy]+" · "+m.way,
    note:NOTE[m.name]||"这个人被记下来了。"});
  S.pending=null; el("modal").innerHTML=""; render();
}
function skipForge(){
  const m=S.pending;
  S.ledger.push({no:String(S.ledger.length+1).padStart(4,"0"),name:m.name,how:STAT_NAME[m.deadBy]+" "+m.s[m.deadBy]+" · "+m.way,
    note:NOTE[m.name]||"这个人被记下来了。"});
  S.pending=null; el("modal").innerHTML=""; render();
}
const NOTE={
  "崔十七":"杀人事先道歉。最后一次没来得及。",
  "言舟":"他说:活着回城的概率是零点三。比昨天高。",
  "陶矜":"她给天开过一张条子。到现在还没核。",
  "阿织":"她学会说「我」那天,说了十七遍。",
  "小满":"她捡了一件衣裳,穿到最后一页。",
  "陆昭":"他把自己写进了红色那一栏。"
};

/* ============ 搭肩 ============ */
function openShoulder(){
  if(S.shoulderUsed>=1){ modalMsg("本城已经搭过肩了。下一座城再来。"); return; }
  const al=alive().filter(m=>m.name!=="陆昭"); /* 陆昭的四枢锁在九上,分不出去 */
  if(al.length<2){
    modalMsg("除了陆昭,车上能搭肩的人不够。\n\n陆昭自己分不出去——他的四项锁在九上,一动就被拉回来。\n\n得再有人上车,肩才搭得起来。");
    return;
  }
  let h='<div class="mask"><div class="dlg"><h2>搭肩</h2>';
  h+='<p style="font-size:13px;color:#857C6E">把一个人最高枢的 20 点,平均分给其余人。他降下去,大家各承担一点。这就是分担。</p>';
  h+='<p style="font-size:12px;color:#857C6E">陆昭不在名单里。他分不动,也接不住——他的九纹丝不动。</p>';
  al.forEach(m=>{
    const t=topStat(m);
    h+='<button type="button" class="opt" onclick="doShoulder(\''+m.name+'\')"><span class="lb">'+m.name+
       '</span><span class="sub"><span class="hb">'+hbBold(m.name+'的'+STAT_NAME[t]+' '+m.s[t]+' → 分出 30,其余 '+(al.length-1)+' 人各 '+
       Math.floor(30/(al.length-1)))+'</span></span></button>';
  });
  h+='<button type="button" class="btn" onclick="closeModal()">算了</button></div></div>';
  el("modal").innerHTML=h;
}
function doShoulder(name){
  const m=byName(name); if(!m||m.name==="陆昭") return;
  const k=topStat(m);
  const recv=alive().filter(x=>x!==m && x.name!=="陆昭");
  if(!recv.length){ modalMsg("没人接得住。肩没搭成。"); return; }
  const per=Math.floor(30/recv.length);
  changeStat(m,k,-30);
  recv.forEach(x=>{ changeStat(x,k,per); });
  S.shoulderUsed=1; S.shoulders++; achUnlock("shoulder");
  closeModal(); render();
  modalMsg(name+"的"+STAT_NAME[k]+"分出去了。"+name+"轻了,别人重了一点。\n\n陆昭站在旁边。他的九,纹丝不动。");
}

/* ============ 装备 ============ */
function equip(i){
  const r=S.relics[i];
  /* 无主遗骸器也能戴:它只是不知道原来是谁的(养器铺那把刀、铁饭碗都是这种),
     本就是路上捡到/买下的器物,有属性,戴上就涨,套给谁都算数。
     「无主」只在遗骸器栏里标出来提醒你——来源不是本队某人的倾覆。 */
  if(r.equipped){
    /* 卸下:把那股劲儿退回去。染上来的部分不退——那是已经拿走了的 */
    const m=byName(r.equipped);
    if(m) m.s[r.stat]=Math.max(0,m.s[r.stat]-r.power);
    r.equipped=null; render(); return;
  }
  const al=alive();
  let h='<div class="mask"><div class="dlg"><h2>佩戴 '+r.name+'</h2><p style="font-size:13px;color:#857C6E">'+r.desc+'</p>';
  al.forEach(m=>{
    const after=Math.min(100,m.s[r.stat]+r.power);
    let warn=' · 每事件染+'+r.infect;
    if(m.name==="陆昭") warn=' · 陆昭的九纹丝不动,也不会被染。但他拿得住。';
    else if(after>=100) warn=' · <b style="color:#A3341F">'+m.name+'会当场倾覆!</b>';
    else if(after>=91) warn=' · <b style="color:#A3341F">'+m.name+'将进入逆者区,随时倾覆</b> · 每事件染+'+r.infect;
    h+='<button type="button" class="opt" onclick="doEquip('+i+',\''+m.name+'\')"><span class="lb">'+m.name+
       '</span><span class="sub"><span class="hb">'+hbBold(m.name+'的'+STAT_NAME[r.stat]+' '+m.s[r.stat]+' → '+after+warn)+'</span></span></button>';
  });
  h+='<button type="button" class="btn" onclick="closeModal()">不戴</button></div></div>';
  el("modal").innerHTML=h;
}
function doEquip(i,name){
  const r=S.relics[i];
  /* 这件器原来戴在别人身上:先把那股劲儿退回去 */
  if(r.equipped && r.equipped!==name){
    const pm=byName(r.equipped);
    if(pm) pm.s[r.stat]=Math.max(0,pm.s[r.stat]-r.power);
  }
  /* 新佩戴者身上原有的别的器:也退回去 */
  S.relics.forEach(o=>{
    if(o!==r && o.equipped===name){
      const pm=byName(name);
      if(pm) pm.s[o.stat]=Math.max(0,pm.s[o.stat]-o.power);
      o.equipped=null;
    }
  });
  r.equipped=name;
  const m=byName(name);
  if(m) changeStat(m,r.stat,r.power); /* 戴上:死人的偏冲突然压上来。到 100,当场倾覆 */
  closeModal(); render();
}

/* ============ 账本 / 弹窗 ============ */
/* ============ 旅程总览(纯展示,不改状态) ============ */
function openJourney(){
  sfx("tap");
  const ci=Math.min(S.ci, CITIES.length);
  let h='<div class="mask"><div class="dlg" style="max-width:620px">';
  h+='<h2>走到哪儿了</h2>';
  h+='<div class="journey">';
  for(let i=0;i<CITIES.length;i++){
    const c=CITIES[i];
    const done=i<ci, cur=(i===ci && S.phase!=="epilogue");
    h+='<div class="jstep'+(done?" done":cur?" now":"")+'">'+
       '<span class="jdot"></span>'+
       '<span class="jname">'+c.name+'</span>'+
       '<span class="jtag">'+(done?"已走过":cur?"在此":(S.phase==="epilogue"?"未至":"未至"))+'</span>'+
       '</div>';
  }
  h+='</div>';
  const pct=Math.round(ci/CITIES.length*100);
  h+='<div class="bar" style="margin-top:14px"><span class="t" style="width:'+pct+'%;background:var(--red)"></span></div>';
  h+='<div class="it">已行 <b>'+ci+' / '+CITIES.length+'</b> 座城 · 完成度 '+pct+'%</div>';

  /* 当前队伍状态 */
  const al=alive();
  h+='<div class="sep"></div><div class="evno">此刻的队伍 · '+al.length+' / '+MAXCREW+' 人</div>';
  if(!al.length) h+='<div class="hint">名单上没有活人。</div>';
  else al.forEach(function(m){
    const top=topStat(m);
    h+='<div class="mb"><div class="nm">'+m.name+'<span class="tag">'+STAT_NAME[top]+'</span>'+
       (m.note?'<span class="tag">'+m.note+'</span>':'')+'</div>'+
       '<div class="bar"><span class="t" style="width:'+m.s[top]+'%;background:var(--red)"></span>'+
       '<span style="font-size:10px;color:var(--ink3);margin-left:6px">'+STAT_NAME[top]+' '+m.s[top]+'</span></div></div>';
  });

  /* 遗骸器一览 */
  if(S.relics&&S.relics.length){
    h+='<div class="sep"></div><div class="evno">遗骸器 · '+S.relics.length+' 件</div>';
    S.relics.forEach(function(r,i){
      const on=r.equipped;
      /* 无主的不可装备,点了会白跑一趟还让人以为坏了,所以这里不绑 onclick */
      if(r.owner){
        h+='<div class="term" style="cursor:pointer" onclick="equip('+i+')">'+
           '<b>'+r.name+'</b><span>'+(on?(on+' 佩戴中'):(r.stat+' +'+r.power))+'</span></div>';
      }else{
        h+='<div class="term"><b>'+r.name+'</b><span>无主 · '+r.stat+' +'+r.power+'</span></div>';
      }
    });
  }

  /* 已解锁成就小结 */
  const st=achState();
  const un=ACHIEVEMENTS.filter(function(a){return st.u[a.id];});
  h+='<div class="sep"></div><div class="evno">成就 · '+un.length+' / '+ACHIEVEMENTS.length+'</div>';
  h+='<div class="bar"><span class="t" style="width:'+Math.round(un.length/ACHIEVEMENTS.length*100)+'%;background:var(--gold,#c9a24a)"></span></div>';

  h+='<div class="row"><button type="button" class="btn p" onclick="closeModal()">合上</button>'+
     '<button type="button" class="btn" onclick="closeModal();openSaveIO()">存档</button>'+
     '<button type="button" class="btn" onclick="closeModal();openLedger()">看账本</button></div>';
  h+='</div></div>';
  el("modal").innerHTML=h;
}

function openLedger(){
  let h='<div class="mask"><div class="dlg"><h2>账本</h2>';
  h+='<p style="font-size:13px;color:#857C6E">蓝色记活人,红色记死人。</p>';
  S.ledger.forEach(l=>{
    h+='<div class="lg"><div><b>'+l.name+'</b> · '+l.how+'</div><div class="no">编号 '+l.no+' · 附注:'+l.note+'</div></div>';
  });
  S.met = S.met || [];
  const ms=MEET.filter(function(m){ return S.met.indexOf(m.city)>=0; });
  h+='<div class="sep"></div><div class="evno">同行 · 已认识 '+ms.length+' / '+MEET.length+'</div>';
  if(!ms.length) h+='<div class="hint">还没有。往后每座城之前,会认识一个。</div>';
  else ms.forEach(function(m){
    h+='<div class="term" style="cursor:pointer" onclick="openMeet('+MEET.indexOf(m)+')">'+
       '<b>'+m.who+'</b><span>'+m.p[0].t+'</span></div>';
  });
  const papers=S.items.filter(function(n){ return !!DOCS[n]; });
  if(papers.length){
    h+='<div class="sep"></div><div class="evno">拾得的纸 · '+papers.length+'</div>';
    papers.forEach(function(n){
      h+='<div class="term" style="cursor:pointer" onclick="openDoc('+S.items.indexOf(n)+')">'+
         '<b>'+n+'</b><span>展读</span></div>';
    });
  }
  const ks=Object.keys(TERMS).filter(function(k){ return S.seen && S.seen[k]; });
  h+='<div class="sep"></div><div class="evno">他记下的词</div>';
  if(!ks.length) h+='<div class="hint">还没有。遇见一个,记一个。</div>';
  else ks.forEach(function(k){ h+='<div class="term"><b>'+k+'</b><span>'+TERMS[k]+'</span></div>'; });
  h+='<button type="button" class="btn" onclick="closeModal()">合上</button></div></div>';
  el("modal").innerHTML=h;
}
function modalMsg(t){
  el("modal").innerHTML='<div class="mask"><div class="dlg"><p>'+t+'</p><button type="button" class="btn" onclick="closeModal()">好</button></div></div>';
}
function closeModal(){ el("modal").innerHTML=""; }

/* ============ 输入 ============ */
try{
  document.addEventListener("keydown", function(e){
    if(TW){ finishTW(); return; }
    if(el("modal").innerHTML){ if(e.key==="Escape") closeModal(); return; }
    const n=parseInt(e.key,10);
    if(n>=1 && n<=9){
      const bs=[].slice.call(document.querySelectorAll(".opt")).filter(function(b){ return !b.disabled; });
      if(bs[n-1]){ bs[n-1].click(); return; }
    }
    if(e.key===" " || e.key==="Enter"){
      const b=document.querySelector(".story .btn.p");
      if(b){ e.preventDefault(); b.click(); }
    }
  });
  document.addEventListener("click", function(){ if(TW) finishTW(); }, true);
}catch(err){}

/* ============ 启动 ============ */
try{
  render();
  showTitle();
}catch(err){
  var sb = document.getElementById("story");
  if(sb) sb.innerHTML = '<div class="warn"><b>启动失败:</b><br>'+err.message+
    '<br><br><span style="font-size:12px">'+(err.stack||'').slice(0,500)+'</span></div>';
}
</script>
